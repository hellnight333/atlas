[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.12.0a2"
description = "Atlas kernel and studio monorepo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # Text rendering for the Media Factory. ffmpeg can only draw text when it
    # was built against libfreetype, and burn subtitles when built against
    # libass -- Homebrew's build has neither, so relying on them would mean
    # "works on the CI runner, silently degrades on a developer's machine".
    # Rendering captions to a transparent PNG and compositing with `overlay`
    # is one code path on every build of ffmpeg, and gives exact typography.
    "pillow>=10.0.0",
    # Recipes are versioned, human-editable YAML in git -- the format CLAUDE.md
    # specifies, and the one a person will actually hand-edit when tuning a
    # render. Loaded with safe_load only.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["packages/kernel"]
include = ["atlas_kernel*"]

[tool.pytest.ini_options]
testpaths = ["packages/kernel/tests"]
# Kept separate on purpose. A unit test that quietly needs a browser, a port or
# a network is the one nobody can reproduce; selecting `-m "not e2e"` must give
# a run that works on a laptop with nothing installed.
markers = [
    "integration: exercises a real subsystem (filesystem, subprocess, database)",
    "e2e: drives a whole workflow end to end; needs a browser, ports or network",
    "real_auth: exercises real authentication; opts out of the test session fixture",
]
addopts = "--cov=packages/kernel/atlas_kernel --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/kernel", "workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"packages/kernel/tests/*.py" = ["B011"]
# FastAPI's dependency-injection defaults (File, Form, Depends) are the
# framework's documented idiom, not a mutable-default bug.
#
# A glob rather than one line per router. The enumerated version was four
# hand-synced lines, and adding a fifth router meant twenty lint errors that
# said nothing about the router — the failure mode of every list that has to be
# kept in step with something it does not derive from.
"packages/kernel/atlas_kernel/api.py" = ["B008"]
"packages/kernel/atlas_kernel/**/api.py" = ["B008"]
# A router that predates the api.py convention, so the glob above misses it.
# Named explicitly rather than widened: the exception is visible here, which is
# the point — an ignore broad enough to catch it by accident would also catch
# the next genuine mutable-default bug written anywhere in the kernel.
"packages/kernel/atlas_kernel/control/sales.py" = ["B008"]
# `qevik/app.py` composes the application and also serves a few routes of its
# own (health, status). Same FastAPI idiom, same reason.
"packages/kernel/atlas_kernel/qevik/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["packages/kernel/atlas_kernel"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
pretty = true
