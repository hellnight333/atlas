# Resource limits for the control plane itself.
#
# A drop-in rather than an edit to the unit, so redeploying the unit file cannot
# silently drop these — which is exactly how a safety limit gets lost.
#
# The API is protected rather than constrained: these numbers are generous
# enough that ordinary work never touches them, and low enough that a leak here
# hits a wall before the host does. The point is that whatever goes wrong stays
# survivable from an SSH session.

[Service]
# Well above steady state (~800 MB for the whole box during normal operation),
# so this bounds a runaway rather than shaping normal behaviour.
MemoryHigh=1200M
MemoryMax=1536M
MemorySwapMax=0

# The API serves requests and dispatches work; it does not need hundreds of
# processes. A number this size is a leak detector, not a capacity plan.
TasksMax=192

# Restart on failure, but never in a tight loop — an infinite restart loop is
# its own denial of service and hides the original fault behind a wall of
# identical log lines.
Restart=on-failure
RestartSec=5
StartLimitIntervalSec=300
StartLimitBurst=5
