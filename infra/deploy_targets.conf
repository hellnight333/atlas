# Where a deploy is allowed to go, and with which key.
#
# One registry, read by `infra/deploy_target.sh` (shell) and
# `infra/deploy_targets.py` (Python), so the deploy scripts, the DevLoop gates
# and anything else asking "which host, which identity" get the same answer
# from the same reviewed file.
#
# There is deliberately NO default entry. A deploy names its target:
#
#     ./infra/deploy_control.sh --target old-prod
#     ./infra/deploy_console.sh --target new-prod
#
# Running one without `--target` (or QEVIK_DEPLOY_TARGET) is refused rather
# than sent somewhere implicit — an implicit production default is how a
# migration deploys to the wrong host on the day both exist. An unknown name is
# refused too, and never falls back.
#
# A raw `user@host` may still be passed for ad-hoc work, but only together with
# an explicit QEVIK_DEPLOY_KEY: an approved identity is never inferred.
#
# Format: name|ssh destination|identity|role
#   - `identity` is a path; a leading `~/` expands to the caller's home.
#   - `-` means "let ~/.ssh/config choose the key for this destination". Use it
#     only for ad-hoc entries: the operator's ssh config is not reviewable, so
#     the production entries below name their key.
#
# Cutover does not edit this file: it changes which name the operator types.

old-prod|root@2.28.62.83|~/.ssh/naml_hetzner|production until cutover (qevik-core-01)
