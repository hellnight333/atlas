<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIRE360 — hospitality talent marketplace, a Qevik concept</title>
<meta name="description" content="A concept for a two-sided hospitality recruitment platform, built by Qevik as a sample. Not affiliated with any recruitment company. All candidates are fictional.">
<meta name="theme-color" content="#0F3D3A">
<style>
/* HIRE360 — a concept for a two-sided hospitality talent marketplace.
 *
 * Built to answer one question a recruitment business asks about an agency:
 * can you build the *product*, or only the brochure in front of it? So this is
 * deliberately not a marketing page with a screenshot on it. The search is the
 * product, it is the first thing on screen, and every filter genuinely narrows
 * a real dataset.
 *
 * Everyone in it is invented. The names are first-name-plus-initial precisely
 * so they cannot be mistaken for real people, there are no photographs of
 * anybody, and no phone number or email appears anywhere.
 *
 * Visually it is built to look like hospitality rather than HR software: a
 * hotel-lobby palette of deep teal and brass on warm paper, a serif reserved
 * exclusively for people's names — the humans get the editorial treatment, the
 * system gets the utilitarian one — and a four-column app shell (rail, filters,
 * results, shortlist dock) that no other sample in this portfolio uses.
 */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}

:root{
  --paper:#F7F5F1; --card:#FFFFFF; --sunk:#EFEBE4;
  --ink:#16130F; --ink-2:#443C33; --mute:#7A7065; --rule:#E3DCD1;
  --teal:#0F3D3A; --teal-2:#14514D; --teal-soft:#E4EEEC;
  --brass:#A97C2F; --brass-soft:#F6EEDD;
  --sage:#3F7D4E; --sage-soft:#E7F1E9;
  --clay:#A8452A; --clay-soft:#F8E9E4;
  --serif:"Georgia","Iowan Old Style","Palatino Linotype",serif;
  --sans:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --ar:"Noto Naskh Arabic","Geeza Pro","Al Bayan",serif;
  --rail:60px; --filters:274px; --dock:296px;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{margin:0;letter-spacing:-.015em}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
.n{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
[dir=rtl] body,[dir=rtl] .ar-face{font-family:var(--ar)}
.eyebrow{font-size:.63rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------------- intro ---------------- */
.intro{position:fixed;inset:0;z-index:60;background:var(--teal);color:#F3EFE7;
  display:flex;flex-direction:column;justify-content:center;padding:2rem 1.6rem;
  background-image:radial-gradient(1100px 460px at 15% -10%,rgba(169,124,47,.30),transparent 60%),
                   radial-gradient(760px 420px at 105% 110%,rgba(63,125,78,.26),transparent 62%)}
.intro .wrap{max-width:620px;margin:0 auto;width:100%}
.intro .badge{display:inline-block;border:1px solid rgba(243,239,231,.34);border-radius:999px;
  padding:.28rem .7rem;font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:#D7CFBF}
.intro h1{font-family:var(--serif);font-size:clamp(2.4rem,8vw,4rem);line-height:1.02;margin:1.1rem 0 .2rem;
  letter-spacing:-.03em}
.intro h1 em{font-style:normal;color:#D9A94F}
.intro .tag{font-size:1.02rem;color:#C6BDAC;margin-bottom:1.5rem;line-height:1.5}
.intro .lines{display:grid;gap:.5rem;margin-bottom:1.9rem}
.intro .lines div{display:flex;gap:.6rem;font-size:.9rem;color:#DDD5C6}
.intro .lines b{color:#D9A94F;font-weight:700;flex:0 0 auto}
.intro .go{background:#D9A94F;color:#1B1406;border-radius:11px;padding:.95rem 1.5rem;
  font-size:1rem;font-weight:800}
.intro .go:active{transform:translateY(1px)}
.intro .note{margin-top:1.5rem;font-size:.76rem;color:#A79C89;line-height:1.6;
  border-top:1px solid rgba(243,239,231,.16);padding-top:1rem}

/* ---------------- app shell ---------------- */
.app{display:flex;height:100vh;overflow:hidden}

nav.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--teal);color:#CFC6B5;
  display:flex;flex-direction:column;align-items:center;padding:.85rem 0;gap:.2rem}
nav.rail .mark{font-family:var(--serif);font-size:1.02rem;color:#D9A94F;font-weight:700;
  margin-bottom:.9rem;letter-spacing:-.02em}
nav.rail button{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:inherit}
nav.rail button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav.rail button[aria-current=true]{background:rgba(217,169,79,.18);color:#E8C87E}
nav.rail button:hover{color:#F0E9DC}
nav.rail .sp{margin-top:auto}
nav.rail .lang{font-size:.68rem;font-weight:800;letter-spacing:.04em;width:42px;height:32px;
  border:1px solid rgba(207,198,181,.3);border-radius:9px}

.work{flex:1 1 auto;display:flex;min-width:0}

/* ---------------- filters ---------------- */
aside.filters{width:var(--filters);flex:0 0 var(--filters);background:var(--card);
  border-inline-end:1px solid var(--rule);overflow-y:auto;padding:1.05rem}
aside.filters h2{font-size:.92rem;margin-bottom:.15rem}
.fgroup{margin-top:1.15rem}
.fgroup > .eyebrow{margin-bottom:.45rem;display:block}
.chips{display:flex;flex-wrap:wrap;gap:.32rem}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;
  padding:.3rem .62rem;font-size:.76rem;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--brass)}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#F3EFE7}
.chip.brass[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#1B1406}
.slider{width:100%;margin:.4rem 0 .1rem;accent-color:var(--teal)}
.reset{margin-top:1.3rem;width:100%;border:1px solid var(--rule);border-radius:9px;
  padding:.52rem;font-size:.8rem;font-weight:650;color:var(--mute)}
.reset:hover{color:var(--clay);border-color:var(--clay)}

/* ---------------- map ---------------- */
.map{background:var(--teal);border-radius:12px;padding:.8rem;margin-top:.3rem;position:relative}
.map svg{width:100%;height:132px;display:block}
.map .pin{cursor:pointer}
.map .pin circle{fill:rgba(217,169,79,.28);stroke:#D9A94F;stroke-width:1.2;transition:fill .15s}
.map .pin:hover circle,.map .pin[aria-pressed=true] circle{fill:#D9A94F}
.map .pin text{fill:#F3EFE7;font-size:5.6px;font-family:var(--sans);font-weight:700}
.map .pin .cnt{fill:#0F3D3A;font-size:5.2px;font-weight:800}
.map .cap{font-size:.66rem;color:#A79C89;margin-top:.35rem}

/* ---------------- results ---------------- */
main.results{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.searchbar{padding:1rem 1.2rem .8rem;border-bottom:1px solid var(--rule);background:var(--paper)}
.searchbar .row{display:flex;gap:.6rem;align-items:center}
.seek{flex:1 1 auto;display:flex;align-items:center;gap:.55rem;background:var(--card);
  border:1px solid var(--rule);border-radius:12px;padding:.15rem .85rem;min-width:0}
.seek input{flex:1 1 auto;border:0;background:none;padding:.7rem 0;font-size:.98rem;min-width:0}
.seek input:focus{outline:none}
.seek svg{width:17px;height:17px;stroke:var(--mute);fill:none;stroke-width:2;flex:0 0 auto}
.sortsel{border:1px solid var(--rule);background:var(--card);border-radius:11px;
  padding:.62rem .7rem;font-size:.84rem;font-weight:600}
.counts{display:flex;align-items:baseline;gap:.55rem;margin-top:.75rem;flex-wrap:wrap}
.counts b{font-family:var(--serif);font-size:1.32rem}
.counts span{font-size:.83rem;color:var(--mute)}
.active{display:flex;gap:.3rem;flex-wrap:wrap;margin-inline-start:auto}
.active button{background:var(--brass-soft);border:1px solid #E7D6B4;color:#7A5A1C;
  border-radius:999px;padding:.18rem .5rem;font-size:.72rem;font-weight:700}

.list{flex:1 1 auto;overflow-y:auto;padding:.9rem 1.2rem 2rem;display:flex;flex-direction:column;gap:.6rem}

.cand{display:flex;align-items:flex-start;gap:.9rem;background:var(--card);border:1px solid var(--rule);border-radius:14px;
  padding:.85rem;text-align:start;width:100%;transition:border-color .13s,box-shadow .13s,transform .13s}
.cand:hover{border-color:#CFC2AC;box-shadow:0 3px 16px rgba(22,19,15,.07)}
.cand .av{width:58px;height:58px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);font-size:1.16rem;font-weight:700;color:#FBF8F2;position:relative}
.cand .av .vt{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;
  background:var(--sage);color:#fff;font-size:.62rem;display:grid;place-items:center;
  border:2px solid var(--card);font-family:var(--sans)}
[dir=rtl] .cand .av .vt{right:auto;left:-4px}
.cand .who{flex:1 1 auto;min-width:0}
.cand .who .name{display:block;font-family:var(--serif);font-size:1.06rem;font-weight:700;
  letter-spacing:-.01em;line-height:1.25}
.cand .who .role{display:block;font-size:.73rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brass);margin-top:.12rem}
.cand .who .meta{display:block;font-size:.81rem;color:var(--mute);margin-top:.3rem}
.cand .who .tags{display:flex;gap:.28rem;flex-wrap:wrap;margin-top:.5rem}
.tg{border-radius:6px;padding:.14rem .42rem;font-size:.69rem;font-weight:650;
  background:var(--sunk);color:var(--ink-2)}
.tg.lang{background:var(--teal-soft);color:var(--teal)}
.cand .who .bar{display:block;max-width:200px}
.cand .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:.45rem}
.avail{border-radius:999px;padding:.2rem .55rem;font-size:.7rem;font-weight:800;white-space:nowrap}
.avail.now{background:var(--sage-soft);color:var(--sage)}
.avail.soon{background:var(--brass-soft);color:#7A5A1C}
.avail.later{background:var(--sunk);color:var(--mute)}
.star{width:32px;height:32px;border:1px solid var(--rule);border-radius:9px;display:grid;
  place-items:center;font-size:.9rem;color:var(--mute);background:var(--card)}
.star[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#1B1406}
.bar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:.55rem}
.bar i{display:block;height:100%;background:var(--teal)}

.empty{text-align:center;padding:3rem 1.5rem;color:var(--mute)}
.empty h3{font-family:var(--serif);font-size:1.3rem;color:var(--ink);margin-bottom:.4rem}
.empty button{margin-top:1rem;background:var(--teal);color:#F3EFE7;border-radius:10px;
  padding:.6rem 1.1rem;font-weight:700;font-size:.86rem}

/* ---------------- shortlist dock ---------------- */
aside.dock{width:var(--dock);flex:0 0 var(--dock);background:var(--card);
  border-inline-start:1px solid var(--rule);display:flex;flex-direction:column}
aside.dock .top{padding:1rem;border-bottom:1px solid var(--rule)}
aside.dock .top h2{font-size:.92rem}
aside.dock .body{flex:1 1 auto;overflow-y:auto;padding:.7rem}
.slrow{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:10px}
.slrow:hover{background:var(--paper)}
.slrow .av{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);font-size:.8rem;font-weight:700;color:#FBF8F2}
.slrow .t{flex:1 1 auto;min-width:0}
.slrow .t b{display:block;font-family:var(--serif);font-size:.9rem}
.slrow .t span{font-size:.72rem;color:var(--mute)}
.slrow .x{color:var(--mute);font-size:1rem;padding:.2rem .3rem}
.slrow .x:hover{color:var(--clay)}
aside.dock .foot{padding:.85rem;border-top:1px solid var(--rule);display:grid;gap:.45rem}
.btn{border-radius:10px;padding:.68rem;font-size:.87rem;font-weight:750;text-align:center;display:block;width:100%}
.btn.teal{background:var(--teal);color:#F3EFE7}
.btn.brass{background:var(--brass);color:#1B1406}
.btn.ghost{border:1px solid var(--rule);color:var(--ink-2);background:var(--card)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------------- overlays ---------------- */
.scrim{position:fixed;inset:0;background:rgba(22,19,15,.42);z-index:40;
  backdrop-filter:blur(2px);animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes riseup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

.sheet{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--paper);
  z-index:50;display:flex;flex-direction:column;animation:slidein .2s ease-out;overflow:hidden}
.sheet .shead{padding:1.1rem 1.2rem;border-bottom:1px solid var(--rule);background:var(--card)}
.sheet .shead .x{position:absolute;inset-inline-end:1rem;top:1rem;width:32px;height:32px;
  border:1px solid var(--rule);border-radius:50%;background:var(--paper)}
.sheet .sbody{flex:1 1 auto;overflow-y:auto;padding:1.1rem 1.2rem 1.6rem}
.sheet .sfoot{padding:.9rem 1.2rem;border-top:1px solid var(--rule);background:var(--card);
  display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.sheet .sfoot .wide{grid-column:1 / -1}

.phead{display:flex;gap:1rem;align-items:flex-start}
.phead .av{width:72px;height:72px;border-radius:15px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);font-size:1.5rem;font-weight:700;color:#FBF8F2}
.phead h2{font-family:var(--serif);font-size:1.5rem;letter-spacing:-.02em}
.phead .role{font-size:.75rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass);margin-top:.2rem}
.phead .meta{font-size:.85rem;color:var(--mute);margin-top:.35rem}
.sec{margin-top:1.35rem}
.sec > .eyebrow{display:block;margin-bottom:.5rem}
.sec p{font-size:.9rem;line-height:1.62;color:var(--ink-2)}
.tl{position:relative;padding-inline-start:1.1rem}
.tl::before{content:"";position:absolute;inset-inline-start:4px;top:.5rem;bottom:.5rem;width:2px;
  background:var(--rule)}
.tl li{position:relative;padding:.42rem 0}
.tl li::before{content:"";position:absolute;inset-inline-start:-1.1rem;top:.85rem;width:10px;height:10px;
  border-radius:50%;background:var(--paper);border:2px solid var(--brass)}
.tl li b{font-size:.9rem;font-weight:700}
.tl li span{display:block;font-size:.78rem;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.4rem .9rem;font-size:.87rem}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:600}

/* ---------------- compare ---------------- */
.compare{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;
  animation:riseup .2s ease-out}
.compare .chead{padding:1.05rem 1.2rem;border-bottom:1px solid var(--rule);background:var(--card);
  display:flex;align-items:center;gap:.8rem}
.compare .cbody{flex:1 1 auto;overflow:auto;padding:1rem}
table.cmp{width:100%;border-collapse:collapse;min-width:520px}
table.cmp th,table.cmp td{padding:.68rem .8rem;border-bottom:1px solid var(--rule);
  text-align:start;font-size:.87rem;vertical-align:top}
table.cmp thead th{background:var(--card);position:sticky;top:0}
table.cmp thead .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;color:#FBF8F2;margin-bottom:.35rem}
table.cmp thead b{font-family:var(--serif);font-size:1rem;display:block}
table.cmp thead span{font-size:.72rem;color:var(--brass);font-weight:700;text-transform:uppercase;
  letter-spacing:.07em}
table.cmp tbody th{font-weight:600;color:var(--mute);white-space:nowrap;font-size:.8rem}
.best{background:var(--sage-soft);color:var(--sage);border-radius:6px;padding:.08rem .38rem;
  font-size:.68rem;font-weight:800;margin-inline-start:.35rem}

/* ---------------- hiring request wizard ---------------- */
.wiz{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;
  animation:riseup .2s ease-out}
.wiz .whead{padding:1.05rem 1.2rem;border-bottom:1px solid var(--rule);background:var(--card)}
.wiz .steps{display:flex;gap:.25rem;margin-top:.75rem}
.wiz .steps i{flex:1 1 0;height:3px;border-radius:2px;background:var(--sunk)}
.wiz .steps i.on{background:var(--brass)}
.wiz .wbody{flex:1 1 auto;overflow-y:auto;padding:1.4rem 1.2rem;max-width:620px;width:100%;
  margin:0 auto}
.wiz h2{font-family:var(--serif);font-size:1.55rem;margin-bottom:.3rem}
.wiz .hint{font-size:.88rem;color:var(--mute);margin-bottom:1.3rem;line-height:1.55}
.wiz .wfoot{padding:.9rem 1.2rem;border-top:1px solid var(--rule);background:var(--card);
  display:flex;gap:.5rem;max-width:620px;width:100%;margin:0 auto}
.wiz .wfoot .btn{flex:1 1 0}
.field{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:11px;
  padding:.75rem .85rem;font-size:.95rem;margin-bottom:.6rem}
.review{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1rem}
.done{text-align:center;padding:2rem 0}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--sage-soft);color:var(--sage);
  display:grid;place-items:center;font-size:1.8rem;margin:0 auto 1rem}

/* ---------------- candidate mode ---------------- */
.cmode{padding:1.2rem;overflow-y:auto;flex:1 1 auto}
.cmode .hero{background:var(--teal);color:#F3EFE7;border-radius:16px;padding:1.3rem;
  background-image:radial-gradient(600px 260px at 90% -20%,rgba(217,169,79,.3),transparent 60%)}
.cmode .hero h2{font-family:var(--serif);font-size:1.6rem;margin:.35rem 0 .2rem}
.cmode .hero p{color:#C6BDAC;font-size:.88rem}
.cmode .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.7rem;
  margin-top:.9rem}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:1rem}
.panel h3{font-size:.95rem;margin-bottom:.6rem}
.opp{display:flex;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.opp:last-child{border-bottom:0}
.opp .logo{width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;color:#FBF8F2;font-size:.85rem}
.opp .t{flex:1 1 auto;min-width:0}
.opp .t b{display:block;font-size:.9rem}
.opp .t span{font-size:.76rem;color:var(--mute)}
.toggle{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.toggle button{flex:1 1 0;border-radius:8px;padding:.42rem;font-size:.8rem;font-weight:700;color:var(--mute)}
.toggle button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* ---------------- disclosure ---------------- */
/* Starts after the rail and takes no pointer events. It sat over the language
 * button at the foot of the rail, which a browser test found by being unable to
 * click it — and a real user would have found the same way, silently. */
.disclose{position:fixed;inset-inline-start:var(--rail);bottom:0;z-index:30;
  background:rgba(22,19,15,.9);color:#D8D0C2;font-size:.7rem;padding:.4rem .8rem;
  border-start-end-radius:9px;line-height:1.45;max-width:min(560px,100%);pointer-events:none}
.disclose b{color:#E8C87E}

/* ---------------- mobile ---------------- */
.mob{display:none}
@media (max-width:1080px){ :root{--dock:0px} aside.dock{display:none} }
@media (max-width:860px){
  body{font-size:14.5px}
  .app{flex-direction:column}
  nav.rail{display:none}
  .work{flex-direction:column;flex:1 1 auto;min-height:0}
  aside.filters{display:none}
  main.results{flex:1 1 auto;min-height:0}
  .searchbar{padding:max(.8rem,env(safe-area-inset-top)) .9rem .7rem}
  .list{padding:.7rem .9rem calc(76px + env(safe-area-inset-bottom))}
  .mob{display:flex}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;height:calc(62px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:rgba(247,245,241,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--rule)}
  nav.tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.15rem;font-size:.62rem;font-weight:700;color:var(--mute);position:relative}
  nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  nav.tabs button[aria-current=true]{color:var(--teal)}
  nav.tabs .badge{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);background:var(--brass);

    relevance:function(a,b){ return (b.profile + (b.verified ? 12 : 0)) - (a.profile + (a.verified ? 12 : 0)); },
    exp:function(a,b){ return b.years - a.years; },
    soon:function(a,b){ return a.days - b.days; },
    profile:function(a,b){ return b.profile - a.profile; }
  }[S.sort];
  return out.sort(by);
}

  if (picked.length < 2) return;
  var mostExp = Math.max.apply(null, picked.map(function(c){ return c.years; }));
  var soonest = Math.min.apply(null, picked.map(function(c){ return c.days; }));
  var rows = [
    [T2.role, function(c){ return esc(roleOf(c)); }],
    [T2.experience, function(c){ return '<span class="n">' + c.years + "</span> " + esc(T2.yrs)
        + (c.years === mostExp ? '<span class="best">MAX</span>' : ""); }],
    [T2.location, function(c){ return esc(cityOf(c)); }],
    [T2.availability, function(c){ return esc(availText(c))
        + (c.days === soonest ? '<span class="best">' + esc(S.lang === "ar" ? "الأقرب" : "FIRST") + "</span>" : ""); }],
    [T2.languages, function(c){ return '<span class="ltr">' + c.langs.join(" · ") + "</span>"; }],
    [T2.skills, function(c){ return c.skills.join(", "); }],
    [T2.dept, function(c){ return esc(T2.depts[c.dept]); }],
    [T2.dailyRate, function(c){ return '<span class="n ltr">AED ' + rate(c) + "</span>"; }]
  ];
  layer(
    '<div class="compare" role="dialog" aria-modal="true"><div class="chead">'
    + '<h2 class="serif" style="font-size:1.25rem">' + esc(T2.cmpTitle) + "</h2>"
    + '<span class="n" style="color:var(--mute)">' + picked.length + "</span>"
    + '<button class="btn ghost" data-close style="width:auto;margin-inline-start:auto;padding:.45rem .9rem">'
    + esc(T2.close) + "</button></div>"
    + '<div class="cbody"><table class="cmp"><thead><tr><th></th>'
    + picked.map(function(c){
        return '<th><span class="av" style="' + skin(c.id) + '">' + initials(c.name) + "</span>"
          + "<b>" + esc(c.name) + "</b><span>" + esc(roleOf(c)) + "</span></th>";
      }).join("") + "</tr></thead><tbody>"
    + rows.map(function(r){
        return "<tr><th>" + esc(r[0]) + "</th>"
          + picked.map(function(c){ return "<td>" + r[1](c) + "</td>"; }).join("") + "</tr>";
      }).join("")
    + '</tbody></table><p style="font-size:.76rem;color:var(--mute);margin-top:.9rem">'
    + esc(T2.sampleData) + "</p></div></div>"
  );
}

/* ------------------------------------------------------------------ wizard */
function openWizard(){
  S.wizard = {step:0, position:"", city:CITIES[0], dept:DEPTS[0], years:3,
              start:"", notes:"", done:false};
  drawWizard();
}
function drawWizard(){
  var T2 = t(), w = S.wizard;
  if (w.done){
    layer('<div class="wiz" role="dialog" aria-modal="true"><div class="wbody"><div class="done">'
      + '<div class="tick">✓</div><h2>' + esc(T2.doneTitle) + "</h2>"
      + '<p class="hint" style="margin-top:.5rem">' + esc(T2.doneSub) + "</p>"
      + '<button class="btn teal" data-close style="max-width:260px;margin:0 auto">'
      + esc(T2.doneBtn) + "</button></div></div></div>");
    return;
  }
  var step = T2.wizSteps[w.step];
  var body = "";
  if (w.step === 0) body = '<input class="field" id="w-position" placeholder="'
    + esc(S.lang === "ar" ? "مثال: رئيس طهاة" : "e.g. Head Chef") + '" value="' + esc(w.position) + '">';
  else if (w.step === 1) body = chipRow("w-city", CITIES.map(function(c){
    return [c, S.lang === "ar" ? CITY_AR[c] : c]; }), w.city);
  else if (w.step === 2) body = chipRow("w-dept", DEPTS.map(function(d){ return [d, T2.depts[d]]; }), w.dept);
  else if (w.step === 3) body = '<input class="slider" type="range" min="0" max="14" value="' + w.years
    + '" id="w-years"><p style="font-size:.9rem" id="w-yearsout"><span class="n">' + w.years + "</span> "
    + esc(T2.plus) + "</p>";
  else if (w.step === 4) body = chipRow("w-start", [
      ["now", T2.now], ["month", T2.weeks], ["later", T2.later]], w.start, true);
  else if (w.step === 5) body = '<textarea class="field" id="w-notes" rows="4" placeholder="'
    + esc(S.lang === "ar" ? "متطلبات إضافية (اختياري)" : "Anything specific (optional)") + '">'
    + esc(w.notes) + "</textarea>";
  else body = '<div class="review"><dl class="kv">'
    + "<dt>" + esc(T2.wizSteps[0][0]) + "</dt><dd>" + esc(w.position || "—") + "</dd>"
    + "<dt>" + esc(T2.wizSteps[1][0]) + "</dt><dd>" + esc(S.lang === "ar" ? CITY_AR[w.city] : w.city) + "</dd>"
    + "<dt>" + esc(T2.wizSteps[2][0]) + "</dt><dd>" + esc(T2.depts[w.dept]) + "</dd>"
    + "<dt>" + esc(T2.wizSteps[3][0]) + "</dt><dd><span class='n'>" + w.years + "</span> " + esc(T2.plus) + "</dd>"
    + "<dt>" + esc(T2.wizSteps[4][0]) + "</dt><dd>"
    + esc({now:T2.now, month:T2.weeks, later:T2.later}[w.start] || "—") + "</dd>"
    + (w.notes ? "<dt>" + esc(T2.wizSteps[5][0]) + "</dt><dd>" + esc(w.notes) + "</dd>" : "")
    + "</dl></div>";

  layer('<div class="wiz" role="dialog" aria-modal="true"><div class="whead">'
    + '<div style="display:flex;align-items:center;gap:.7rem">'
    + '<h2 class="serif" style="font-size:1.1rem">' + esc(T2.wizTitle) + "</h2>"
    + '<span class="n" style="color:var(--mute);font-size:.85rem">' + (w.step + 1) + "/7</span>"
    + '<button class="btn ghost" data-close style="width:auto;margin-inline-start:auto;padding:.4rem .85rem">'
    + esc(T2.close) + "</button></div>"
    + '<div class="steps">' + T2.wizSteps.map(function(_, i){
        return '<i class="' + (i <= w.step ? "on" : "") + '"></i>'; }).join("") + "</div></div>"
    + '<div class="wbody"><h2>' + esc(step[0]) + '</h2><p class="hint">' + esc(step[1]) + "</p>"
    + body + "</div>"
    + '<div class="wfoot">'
    + '<button class="btn ghost" data-wiz="back"' + (w.step === 0 ? " disabled" : "") + ">" + esc(T2.back) + "</button>"
    + '<button class="btn teal" data-wiz="next">' + esc(w.step === 6 ? T2.submit : T2.next) + "</button></div></div>");
}

/* ------------------------------------------------------------------ layers */
function layer(html){ $("layer").innerHTML = html; }
function closeLayer(){ $("layer").innerHTML = ""; S.wizard = null; }

/* ------------------------------------------------------------------ events */
document.addEventListener("click", function(e){
  var el;

  if ((el = e.target.closest("[data-close]"))) return closeLayer();

  if ((el = e.target.closest("[data-star]"))){
    e.stopPropagation();
    var id = +el.dataset.star, at = S.shortlist.indexOf(id);
    if (at >= 0) S.shortlist.splice(at, 1); else S.shortlist.push(id);
    render();
    if ($("layer").innerHTML.indexOf("sheet") >= 0) openProfile(id);
    return;
  }
  if ((el = e.target.closest("[data-open]"))) return openProfile(+el.dataset.open);
  if ((el = e.target.closest("[data-compare]")) || e.target.closest("#compare-btn")) return openCompare();
  if ((el = e.target.closest("[data-request]")) || e.target.closest("#request-btn")) return openWizard();

  if ((el = e.target.closest("[data-f]"))){
    var f = el.dataset.f, v = el.dataset.v;
    if (f.indexOf("w-") === 0){
      S.wizard[f.slice(2)] = v; return drawWizard();
    }
    S[f] = (S[f] === v) ? "" : v;
    drawFilters(); if (S.drawer) drawFilters(document.querySelector(".drawer .dbody"));
    return render();
  }
  if ((el = e.target.closest("[data-clear]"))){
    S[el.dataset.clear] = el.dataset.clear === "minYears" ? 0 : "";
    drawFilters(); return render();
  }
  if (e.target.closest("[data-reset]")){
    S.q = ""; S.dept = ""; S.city = ""; S.minYears = 0; S.avail = ""; S.lang_f = "";
    $("q").value = ""; drawFilters();
    if (S.drawer) drawFilters(document.querySelector(".drawer .dbody"));
    return render();
  }
  if ((el = e.target.closest("[data-view]"))){
    S.view = el.dataset.view; closeLayer(); return render();
  }
  if ((el = e.target.closest("[data-mode]"))){
    S.mode = el.dataset.mode;
    S.view = S.mode === "candidate" ? "account" : "discover";
    return render();
  }
  if ((el = e.target.closest("[data-setlang]"))){
    S.lang = el.dataset.setlang; return applyLang();
  }
  if ((el = e.target.closest("[data-wiz]"))){
    var w = S.wizard;
    if (el.dataset.wiz === "back"){ if (w.step > 0) w.step--; return drawWizard(); }
    var input = document.getElementById("w-position");
    if (input) w.position = input.value;
    var notes = document.getElementById("w-notes");
    if (notes) w.notes = notes.value;
    if (w.step === 6){
      S.requests.unshift({position:w.position, city:w.city, dept:w.dept,
                          years:w.years, start:w.start, notes:w.notes});
      w.done = true; return drawWizard();
    }
    w.step++; return drawWizard();
  }
  if (e.target.closest("#openfilters")){
    S.drawer = true;
    layer('<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-modal="true">'
      + '<div class="dhead" style="display:flex;align-items:center;gap:.6rem">'
      + '<h2 class="serif" style="font-size:1.1rem">' + esc(t().filters) + "</h2>"
      + '<button class="btn ghost" data-close style="width:auto;margin-inline-start:auto;padding:.4rem .8rem">'
      + esc(t().close) + '</button></div><div class="dbody"></div>'
      + '<div class="dfoot"><button class="btn ghost" data-reset>' + esc(t().reset) + "</button>"
      + '<button class="btn teal" data-close>' + esc(t().count) + " (" + found().length + ")</button></div></div>");
    drawFilters(document.querySelector(".drawer .dbody"));
    return;
  }
  if (e.target.closest("#lang-d")){ S.lang = S.lang === "en" ? "ar" : "en"; return applyLang(); }
  if (e.target.closest("[data-noop]")){
    var b = e.target.closest("[data-noop]"), was = b.textContent;
    b.textContent = S.lang === "ar" ? "تفاعل تجريبي فقط" : "Demo only — nothing sent";
    setTimeout(function(){ b.textContent = was; }, 1800);
    return;
  }
});

document.addEventListener("input", function(e){
  if (e.target.id === "q"){ S.q = e.target.value; return render(); }
  if (e.target.id === "years"){
    S.minYears = +e.target.value;
    var out = document.querySelectorAll("#yearsout");
    out.forEach(function(o){ o.textContent = S.minYears ? S.minYears + " " + t().plus : t().anyexp; });
    return render();
  }
  if (e.target.id === "w-years"){
    S.wizard.years = +e.target.value;
    document.getElementById("w-yearsout").innerHTML =
      '<span class="n">' + S.wizard.years + "</span> " + esc(t().plus);
  }
});
document.addEventListener("change", function(e){
  if (e.target.id === "sort"){ S.sort = e.target.value; render(); }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeLayer(); });

$("launch").addEventListener("click", function(){
  $("intro").hidden = true; $("app").hidden = false; render();
});
$("openfilters").addEventListener("click", function(){});

applyLang();
</script>
</body>
</html>
