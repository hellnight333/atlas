     * It rendered no input at all, so the approve handler's
     * `querySelector('input[name=origin]:checked')` found nothing and posted an
     * empty origin. Empty is not "the one we just showed you": the API reads it
     * as Qevik's own source. So this screen said "Repository: no source" and
     * queued a self-modification mission.
     *
     * Hidden rather than a disabled radio: there is nothing to choose, and a
     * control that cannot be operated is a control. What matters is that the
     * value sent is the value shown. */
    const only = originOf(list[0].name);
    return `<dl class="facts"><dt>Repository</dt>
      <dd>${pill(only.word, only.tone)} <span class="note">${esc(only.says)}</span>
      <input type="hidden" name="origin" value="${esc(list[0].name)}" checked></dd></dl>`;
  }
  return `<fieldset class="origins">
    <legend>Which repository?</legend>
    ${list.map((o, i) => {
      const shown = originOf(o.name);
      return `<label class="origin${o.modifies_qevik_itself ? ' guarded' : ''}">
        <input type="radio" name="origin" value="${esc(o.name)}"
          ${i === 0 ? 'checked' : ''}>
        <span class="what">${esc(shown.word)}</span>
        <span class="note">${esc(shown.says)}</span>
      </label>`;
    }).join('')}
  </fieldset>`;
}

/* What discovery found, on a phone.
 *
 * Deliberately one screen and no charts. The useful thing is: what turned up,
 * how sure we are about *what kind of new it is*, and what it rests on.
 *
 * The one rule this screen exists to keep: a row that is merely new to Qevik
 * must not read as "a new business appeared". The API sends
 * `claims_about_the_world` on every row precisely so this cannot be guessed,
 * and the wording below changes with it rather than with the state name. */
/* What a discovery state means — asked, never decided here.
 *
 * This used to collapse four kernel states into a boolean and write its own
 * prose for each half. That is a second state machine: `DISCOVERED_BY_QEVIK`
 * and `NEW_TO_QEVIK` are different claims and were being drawn identically,
 * and the wording here could drift from the kernel's with nothing failing.
 * `/api/discovery/states` exists precisely so a surface cannot invent a
 * friendlier meaning than the one the kernel gives. */
const STATE_TONE = {
  PROVEN_NEW_TO_SOURCE: 'ok', DISCOVERED_BY_QEVIK: 'run',
  NEW_TO_QEVIK: '', KNOWN: 'wait',
};

function discoveryLine(row, states) {
  const known = (states || []).find((s) => s.state === row.state);
  if (!known) {
    /* An unrecognised state is not a new one to guess at. Saying so beats
       rendering it as the friendlier neighbour it happens to sort next to. */
    return { word: row.state || 'unknown state', tone: 'warn',
             says: 'This console has no description for that state. It came '
                 + 'from the kernel; ask it what it means before acting.' };
  }
  return { word: known.state, tone: STATE_TONE[known.state] || '',
           says: known.means + (known.claims_about_the_world
             ? ' This one claims something about the world.'
             : ' This claims nothing about the world.') };
}

/* One opportunity, in the four parts it was detected as.
 *
 * The rule this screen keeps: an inference is never drawn as an observation.
 * The payload says `is_an_inference` on every one precisely so a renderer
 * cannot forget, and the wording here follows that flag rather than the kind. */
function opportunityCard(row) {
  const detail = row.detail || {};
  const seen = (detail.observations || [])[0] || {};
  const reading = (detail.inferences || [])[0] || null;
  const next = (detail.actions || [])[0] || null;
  const value = row.value || { status: 'UNKNOWN', amount: null };
  return `<div class="card">
    <div class="title">${esc(seen.statement || row.kind)}</div>
    <div class="meta">${pill(row.kind)} ${esc(row.source || '')}
      · ${when(row.detected_at)} · score ${esc((row.score ?? 0).toFixed(2))}</div>
    ${reading ? `<p class="stage">${pill('Inference', 'warn')}
      <span class="note">${esc(reading.statement)}</span></p>
      ${reading.would_be_wrong_if ? `<p class="note">Wrong if
        ${esc(reading.would_be_wrong_if)}.</p>` : ''}` : ''}
    <dl class="facts">
      <dt>Evidence</dt><dd>${esc(String((row.evidence_fingerprints || []).length))}
        record${(row.evidence_fingerprints || []).length === 1 ? '' : 's'}
        <span class="note">${(row.evidence_fingerprints || [])
          .map((f) => '<code>' + esc(f.slice(0, 10)) + '</code>').join(' ')}</span></dd>
      <dt>Confidence</dt><dd>${reading
        ? esc(reading.confidence.toFixed(2)) : pill('UNKNOWN')}</dd>
      <dt>Worth</dt><dd>${cost(value.amount, value.status)}</dd>
      ${next ? `<dt>Recommended</dt><dd>${esc(next.statement)}
        ${row.needs_approval ? pill('needs you', 'warn') : ''}</dd>` : ''}
    </dl>
    ${next && row.needs_approval ? `<div class="actions">
      <button data-approve-opportunity="${esc(row.id)}">Approve this</button>
      <span class="note">Approving decides <em>that</em> the work happens. What
        the work is came from this opportunity's own evidence and cannot be
        changed here. Nothing is sent to the business.</span>
      <span class="note" data-said="${esc(row.id)}"></span></div>` : ''}
    ${row.business_id ? `<p class="trail"><a
      href="#/discovery/${encodeURIComponent(row.business_id)}">See the evidence
      &rarr;</a></p>` : ''}
  </div>`;
}

async function opportunities() {
  /* Inbound first, and not for emphasis. Everything else on this page is Qevik
     noticing a business; these are businesses that arrived under their own
     steam, which is the stronger signal and the one to read first. */
  const [found, inbound] = await Promise.all([
    API.get('/api/discovery/opportunities?limit=25').catch(() => null),
    API.get('/api/missions/inbound').catch(() => null),
  ]);
  const inboundBlock = !inbound ? '' : (inbound.inbound || []).length ? `
    <h3 style="margin:0 0 .4rem">They came to us
      <span class="note">${esc(String(inbound.counts.total))}</span></h3>
    <p class="note" style="margin-bottom:.6rem">${esc(String(
      inbound.counts.new_to_qevik))} Qevik has never audited${
      inbound.counts.asked_more_than_once
        ? ', ' + esc(String(inbound.counts.asked_more_than_once)) + ' asked more than once'
        : ''}.</p>
    <div class="rows" style="margin-bottom:1.5rem">${(inbound.inbound || []).map((r) => `
      <div class="row"><div class="body">
        <div class="title">${esc(r.host)}
          ${r.already_known ? pill('we have a file', 'ok') : pill('never audited', 'warn')}
          ${r.asked > 1 ? pill('asked ' + r.asked + '×', 'run') : ''}</div>
        <div class="meta">${when(r.at)} · via ${esc(r.source || 'unknown')}${
          r.observations ? ' · ' + esc(String(r.observations)) + ' checks on file' : ''}</div>
      </div><div class="actions">${r.business_id
        ? `<a href="#/discovery/${encodeURIComponent(r.business_id)}">evidence</a>` : ''}</div></div>`
    ).join('')}</div>` : `<h3 style="margin:0 0 .4rem">They came to us</h3>
      <p class="note" style="margin-bottom:1.5rem">Nobody has asked Qevik about
        their own site yet. This fills from the public audit and from anyone
        following the link in a health check.</p>`;

  if (!found) {
  return `<header class="page"><h2>Opportunities</h2></header>
      ${inboundBlock}
      <div class="card"><p class="note">The opportunity memory could not be
      read. That is not the same as there being none.</p></div>`;
  }
  const rows = found.opportunities || [];

  queueMicrotask(() => {
    document.querySelectorAll('[data-approve-opportunity]').forEach((button) => {
      const signal = button.dataset.approveOpportunity;
      const said = document.querySelector(`[data-said="${signal}"]`);
      button.addEventListener('click', async () => {
        if (!confirm('Approve work for this business?\n\nIt creates the '
                     + 'mission that carries out what this opportunity '
                     + 'recommends. Nothing is sent to anybody.')) return;
        /* Visible before the await: this creates a mission and the round trip
           is not instant. */
        button.disabled = true;
        button.textContent = 'Approving…';
        if (said) said.textContent = '';
        try {
          const mission = await API.post('/api/missions/deliver',
                                         { signal_id: signal });
          if (said) said.textContent = 'Mission ' + mission.mission_id + ' created.';
          render();
        } catch (e) {
          button.disabled = false;
          button.textContent = 'Approve this';
          /* 422 means the opportunity's action names nothing deliverable and
             409 that it is not approvable. Both are the system refusing for a
             stated reason, not a failure to retry past. */
          if (said) said.textContent = e.message;
        }
      });
    });
  });

  return `
    <header class="page"><h2>Opportunities</h2>
      <p class="lead">${rows.length
        ? esc(String(rows.length)) + ' open, ' +
          esc(String(found.counts.needing_approval)) + ' needing you.'
        : 'Nothing open. Discovery runs nightly; an empty list means it ran and found nothing new.'}</p></header>
    ${inboundBlock}
    ${rows.map(opportunityCard).join('')}
    ${rows.length ? `<p class="note">${esc(found.note || '')}</p>` : ''}`;
}

/* How old what Qevik has observed actually is.
 *
 * Beside reach rather than on its own screen, because they are one question:
 * a business audited a fortnight ago is not one the system can currently see.
 * It went unnoticed for twelve days that the nightly pass refreshed the
 * defects and left the observations behind every health check standing still,
 * so the cadence is drawn as a measurement and never as a claim about the
 * schedule.
 */
function freshness(f) {
  if (!f || !f.with_observations) return '';
  const stale = f.older_than_a_week;
  return `<p class="note" style="margin-top:.6rem">
    <strong>${esc(String(f.fresh_within_two_days))}</strong> observed in the
    last two days, ${esc(String(f.fresh_within_a_week))} within a week,
    ${stale ? pill(String(stale) + ' older than a week', 'warn')
            : pill('none older than a week', 'ok')},
    ${esc(String(f.never_observed))} never observed.
    Newest ${when(f.newest)}, oldest ${when(f.oldest)}.</p>
  <p class="note">A site that answered is not a site that was read:
    <code>website_verified</code> records the turn and carries no
    observations.</p>`;
}

async function discoveries() {
  const [found, vocabulary, coverage] = await Promise.all([
    API.get('/api/discovery?limit=25').catch(() => null),
    API.get('/api/discovery/states').catch(() => null),
    /* How much of the discovered population Qevik can actually see. A business
       it cannot fetch produces no evidence and leaves the funnel without
       appearing anywhere as a loss — the operator sees a shorter list, not a
       gap. This is that gap. */
    API.get('/api/missions/coverage').catch(() => null),
  ]);
  const states = (vocabulary || {}).states || [];
  const c = coverage;
  const coverageBlock = !c ? '' : `
    <div class="card" style="margin-bottom:1rem"><h3>What Qevik can see</h3>
      <div class="grid">
        <div><div class="stat">${esc(String(c.answered))}</div>
          <span class="note">audited, evidence exists</span></div>
        <div><div class="stat">${esc(String(c.never_audited))}</div>
          <span class="note">waiting for the nightly pass</span></div>
        <div><div class="stat">${esc(String(c.did_not_answer))}</div>
          <span class="note">their site did not answer</span></div>
        <div><div class="stat">${c.we_failed
            ? pill(String(c.we_failed) + ' blocked by us', 'bad')
            : pill('none blocked by us', 'ok')}</div>
          <span class="note">our own check did not complete</span></div>
      </div>
      ${c.we_failed ? `<p class="note">These are businesses Qevik could have
        evidence about and does not, for a reason that was never theirs. The
        nightly verification revisits them; this number should reach zero on
        its own.</p>` : ''}
      ${freshness(c.freshness)}
      <p class="note">${esc(c.note || '')}</p></div>`;

  if (!found) {
    return `<header class="page"><h2>Discovery</h2></header>
      ${coverageBlock}
      <div class="card"><p class="note">The discovery memory could not be read.
      That is not the same as nothing having been discovered.</p></div>`;
  }
  const rows = found.discoveries || [];
  return `
    <header class="page"><h2>Discovery</h2>
      <p class="lead">${rows.length
        ? esc(String(rows.length)) + ' since the last scan, ' +
          esc(String(found.counts.claiming_about_the_world)) +
          ' of them evidenced as new by their source.'
        : 'Nothing new since the last scan.'}</p></header>
    ${coverageBlock}
    ${rows.length ? rows.map((r) => {
      const how = discoveryLine(r, states);
      return `<div class="card">
        <div class="title">${esc(r.name)}</div>
        <p class="stage">${pill(how.word, how.tone)} ${esc(how.says)}</p>
        <dl class="facts">
          <dt>Where</dt><dd>${esc([r.city, r.country].filter(Boolean).join(', ') || '—')}</dd>
          <dt>Source</dt><dd>${esc(r.source)}</dd>
          <dt>Seen</dt><dd>${when(r.observed_at)}</dd>
          <dt>Why this state</dt><dd><span class="note">${esc(r.because || '')}</span></dd>
        </dl>
        <p class="trail"><a href="#/discovery/${encodeURIComponent(r.business_id)}">See the evidence &rarr;</a></p>
      </div>`;
    }).join('') : `<div class="card"><p class="note">Discovery runs nightly.
      An empty list means the scan ran and found nothing Qevik did not already
      have — not that it did not run.</p>
      ${(found.coverage || {}).without_a_sighting ? `<p class="note">
        <strong>${esc(String(found.coverage.without_a_sighting))} of
        ${esc(String(found.coverage.businesses))} businesses have no sighting
        recorded at all</strong>, so they have no discovery state and can never
        appear here. That is a gap in what was recorded about how Qevik came to
        know them — not evidence that nothing was found.</p>` : ''}</div>`}
    ${states.length ? `<div class="card"><h3>What these states mean</h3>
      <dl class="facts">${states.map((st) => `<dt>${pill(st.state,
        STATE_TONE[st.state] || '')}</dt><dd>${esc(st.means)}
        ${st.claims_about_the_world
          ? pill('claims about the world', 'warn') : ''}</dd>`).join('')}</dl>
      <p class="note">Read from the kernel, not written here.</p></div>` : ''}
    <p class="note">${esc(found.note || '')}</p>`;
}

async function discoveryTrail(id) {
  const trail = await API.get('/api/discovery/' + encodeURIComponent(id) + '/sightings')
    .catch(() => null);
  if (!trail) {
    return `<header class="page"><h2>Evidence</h2></header>
      <div class="card"><p class="note">No sightings for that id.</p></div>`;
  }
  return `
    <header class="page"><h2>${esc((trail.sightings[0] || {}).name || 'Evidence')}</h2>
      <p class="lead">First seen ${when(trail.first_seen_at)}, last seen
      ${when(trail.last_seen_at)}. ${esc(String(trail.sightings.length))}
      observation${trail.sightings.length === 1 ? '' : 's'}.</p></header>
    ${trail.sightings.map((s) => `<div class="card">
      <div class="meta">${pill(s.state)} ${esc(s.source)} · ${when(s.observed_at)}</div>
      <p class="note">${esc(s.because || '')}</p>
      ${(s.evidence || []).map((e) => `<pre class="report">${
        esc(JSON.stringify(e.observed, null, 1))}</pre>`).join('')}
    </div>`).join('')}`;
}

function planPreview(plan, originName) {
  if (!plan) return '';
  const steps = plan.steps || [];
  const where = originOf(originName);
  const blockers = plan.blockers || [];
  return `
    <div class="card plan">
      <h3>Proposed plan</h3>
      ${plan.goal ? `<p class="goal">${esc(plan.goal)}</p>` : ''}
      ${plan.why ? `<p class="note">${esc(plan.why)}</p>` : ''}
      ${blockers.length ? `<div class="blockers">${blockers.map((b) => `
        <div class="blocker ${b.kind === 'BLOCKED_EXTERNAL_PROVIDER' ? 'external' : ''}">
          <div class="kind">${pill(b.kind, b.kind === 'BLOCKED_EXTERNAL_PROVIDER' ? 'wait' : 'bad')}</div>
          <div class="what">${esc(b.detail)}</div>
          ${b.action ? `<div class="do">${esc(b.action)}</div>` : ''}
        </div>`).join('')}</div>` : ''}
      ${steps.length ? `<ol class="steps">${steps.map((s) => `
        <li><span class="what">${esc(s.title)}</span>
          ${s.why ? `<span class="note"> — ${esc(s.why)}</span>` : ''}
          ${(s.files || []).length ? `<div class="files">${
            (s.files || []).map((f) => '<code>' + esc(f) + '</code>').join(' ')}</div>` : ''}
        </li>`).join('')}</ol>`
        : (blockers.length ? '' : '<p class="note">No steps were proposed.</p>')}
      <dl class="facts">
        <dt>Repository</dt><dd>${pill(where.word, where.tone)}
          <span class="note">${esc(where.says)}</span></dd>
        <dt>Estimated cost</dt><dd>${cost(plan.estimated_cost, plan.cost_status)}</dd>
        ${plan.security_impact ? `<dt>Security</dt><dd>${esc(plan.security_impact)}</dd>` : ''}
        ${plan.test_plan ? `<dt>How it is checked</dt><dd>${esc(plan.test_plan)}</dd>` : ''}
        ${plan.rollback ? `<dt>Rollback</dt><dd>${esc(plan.rollback)}</dd>` : ''}
      </dl>
    </div>`;
}

async function conversation(id) {
  const c = await API.get('/api/chat/' + encodeURIComponent(id));
  let mission = null;
  let report = null;
  /* Fetched here rather than at start-up: it is only needed on the screen that
   * offers a choice, and a failure must not stop the conversation rendering —
   * `originChoice` says so rather than silently offering nothing. */
  if (state.origins === null) {
    state.origins = await API.get('/api/missions/origins').catch(() => ({ origins: [] }));
  }
  if (c.mission_id) {
    mission = await API.get('/api/missions/' + encodeURIComponent(c.mission_id)).catch(() => null);
    if (mission && (mission.status === 'complete' || mission.status === 'failed')) {
      report = await API.get('/api/missions/' + encodeURIComponent(c.mission_id) + '/report')
        .catch(() => null);
    }
  }
  const stage = stageOf(c, mission);
  const shown = STAGE[stage];
  const awaiting = c.status === 'plan_proposed' && stage === 'waiting';
  const plan = c.plan || (mission && mission.plan) || null;

  const html = `
    <header class="page"><h2>${esc(c.title)}</h2>
      <p class="stage">${pill(shown.word, shown.tone)} ${esc(shown.says)}</p></header>

    ${whyItEnded(mission) ? `<div class="card why">
        <h3>Why it stopped</h3>
        <p>${esc(whyItEnded(mission))}</p></div>` : ''}

    ${planPreview(plan, mission && mission.origin_name)}

    ${awaiting ? `<div class="card decide">
        <h3>Your decision</h3>
        <p class="note">Approving queues a mission. A worker in another process
        runs it, so you can close this page.</p>
        ${originChoice(state.origins)}
        <div class="actions"><button class="primary" data-yes>Approve and queue</button>
          <button class="danger" data-no>Decline</button></div></div>` : ''}

    ${mission ? `<div class="card">
        <h3>Mission</h3>
        <div class="meta"><code>${esc(mission.mission_id)}</code> ${pill(mission.status)}
          ${mission.claimed_by ? '· held by <code>' + esc(mission.claimed_by) + '</code>' : ''}</div>
        ${track(mission.status)}
        ${(mission.blockers || []).length ? `<div class="blockers">${
          mission.blockers.map((b) => `<div class="blocker">
            <div class="kind">${pill(b.kind, 'bad')}</div>
            <div class="what">${esc(b.detail)}</div>
            ${b.action ? `<div class="do">${esc(b.action)}</div>` : ''}</div>`).join('')}</div>` : ''}
        <dl class="facts">
          <dt>Cost so far</dt><dd>${cost(mission.total_cost,
            mission.total_cost === null ? 'UNKNOWN' : 'REPORTED')}</dd>
          ${(mission.commits || []).length
            ? `<dt>Commit</dt><dd><code>${esc(mission.commits[0])}</code></dd>` : ''}
        </dl>
      </div>` : ''}

    ${report ? `<div class="card"><h3>Report</h3>
        <pre class="report">${esc(report.report)}</pre></div>` : ''}

    <div class="card"><h3>Conversation</h3>
      <div class="msgs">${(c.messages || []).map((m) => `
        <div class="msg ${esc(m.role)}">
          <div class="from">${esc(m.role)}${m.model
            ? ' · <code>' + esc(m.provider) + '/' + esc(m.model) + '</code>' : ''}
            · ${when(m.at)}</div>
          <pre>${esc(m.text)}</pre>
        </div>`).join('')}</div>
      ${(stage === 'drafting' || stage === 'blocked') && !mission ? `
        <form id="more"><div class="field">
          <label for="say2">Add to this request</label>
          <textarea id="say2" rows="2"></textarea></div>
          <div class="actions"><button type="submit">Send</button>
            <button type="button" class="primary" data-plan>Propose a plan</button></div>
        </form>` : ''}
    </div>`;

  queueMicrotask(() => {
    const plan = document.querySelector('[data-plan]');
    if (plan) plan.addEventListener('click', async () => {
      plan.disabled = true; plan.textContent = 'Asking a model…';
      try { await API.post('/api/chat/' + encodeURIComponent(id) + '/plan'); render(); }
      catch (e) { plan.disabled = false; plan.textContent = 'Propose a plan'; alert(e.message); }
    });
    const more = $('more');
    if (more) more.addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await API.post('/api/chat/' + encodeURIComponent(id) + '/messages', { text: $('say2').value }); render(); }
      catch (err) { alert(err.message); }
    });
    const yes = document.querySelector('[data-yes]');
    if (yes) yes.addEventListener('click', async () => {
      yes.disabled = true; yes.textContent = 'Queueing…';
      /* `:checked` matches a radio; the single-origin case emits a hidden
         input, which is never `:checked`. Both spellings, because sending an
         empty origin does not mean "the default we displayed" — it means
         Qevik's own source. */
      const picked = document.querySelector('input[name=origin]:checked')
        || document.querySelector('input[type=hidden][name=origin]');
      try {
        await API.post('/api/chat/' + encodeURIComponent(id) + '/decide',
                       { approved: true, origin: picked ? picked.value : '' });
        render();
      }
      catch (e) { yes.disabled = false; yes.textContent = 'Approve and queue'; alert(e.message); }
    });
    const no = document.querySelector('[data-no]');
    if (no) no.addEventListener('click', async () => {
      if (!confirm('Decline this plan?')) return;
      try { await API.post('/api/chat/' + encodeURIComponent(id) + '/decide', { approved: false }); render(); }
      catch (e) { alert(e.message); }
    });
  });
  return html;
}

/* One inbox. The derived half (`actions.py` folds a credential nobody stored,
   a machine nobody provisioned) and the posed half (`human.py` stores a
   question nobody can measure) arrive in the same list under the same
   ActionKind, because a person asking "what do you need from me" is asking one
   question and must not be shown two centres that disagree. */
const GROUPS = [
  ['NEEDS A DECISION FROM YOU',
   (a) => a.kind === 'decision' && a.status !== 'deferred'],
  ['BLOCKING NOW',
   (a) => a.kind !== 'decision' && a.blocking && a.status !== 'deferred'],
  ['WAITING FOR ME',
   (a) => a.kind !== 'decision' && !a.blocking && a.status !== 'deferred'],
  ['DEFERRED', (a) => a.status === 'deferred'],
];

views.actions = async () => {
  const centre = await API.get('/api/missions/actions');
  const open = centre.open || [];
  state.counts.actions = (centre.counts && centre.counts.blocking) || 0;
  if (state.arg) return humanTask(state.arg);

  const blocking = open.filter((a) => a.blocking).length;
  const lead = blocking
    ? `You are blocking <strong>${blocking}</strong> ${blocking === 1 ? 'thing' : 'things'}.`
    : 'Nothing is blocked on you.';

  /* When each item started waiting — and, for half of them, the honest answer
     that they have no age.
   *
   * A *posed* request is a row in a table with a real `created_at`: somebody
   * asked it at a moment and it has been waiting since. A *derived* action is
   * recomputed on every request from the current state, so its `created_at` is
   * the instant this page was loaded. Printing that would say a credential
   * missing for weeks appeared two seconds ago — which is exactly the kind of
   * false freshness that makes a reader distrust every date on the screen.
   *
   * So: real ages where they exist, "live check" where they do not, and one
   * honest timestamp for the view at the top. */
  const age = (a) => {
    if (!a.posed) {
      return `<span class="note" title="Derived from the current state each time
        this page loads, so it has no age of its own.">live check</span>`;
    }
    if (!a.created_at) return '<span class="note">no date recorded</span>';
    const raised = new Date(a.created_at);
    if (isNaN(raised)) return '<span class="note">no date recorded</span>';
    const days = (Date.now() - raised) / 86400000;
    const tone = days > 14 ? 'warn' : days < 1 ? 'ok' : '';
    return `<span class="note" title="${esc(raised.toString())}">waiting
      ${esc(when(a.created_at))}${days < 1 ? ' · new' : ''}</span>`
      .replace('class="note"', `class="note age ${tone}"`);
  };

  const groups = GROUPS.map(([label, belongs]) => {
    const rows = open.filter(belongs);
    if (!rows.length) return '';
    return `<h3 style="margin:1.2rem 0 .5rem">${esc(label)}
        <span class="note">${rows.length}</span></h3>
      <div class="rows">${rows.map((a) => `
        <div class="row"><div class="body">
          <div class="title">${esc(a.title)}
            ${a.blocking ? pill('BLOCKING', 'bad') : ''}
            ${a.kind === 'decision' ? pill('DECISION', 'warn')
              : a.posed ? pill(esc(a.kind), 'wait') : ''}
            ${a.kind === 'decision' && (a.options || []).length
              ? `<span class="note">${a.options.length} options</span>` : ''}
            ${a.reversible === false ? pill('irreversible', 'warn') : ''}</div>
          <div class="meta">${age(a)}</div>
          <div class="meta">${esc(a.reason || a.instructions || '')}</div>
          ${(a.affects || []).length
            ? `<div class="meta">Holds up: ${esc((a.affects || []).join(', '))}</div>` : ''}
          ${a.verification ? `<div class="meta">Closes when: ${esc(a.verification)}</div>` : ''}
        </div><div class="actions">${a.posed
          ? `<a href="#/actions/${encodeURIComponent(a.id)}">Open</a>`
          : (a.service ? `<a href="#/credentials">${esc(a.service)}</a>` : '')}</div></div>`
      ).join('')}</div>`;
  }).join('');

  /* One honest timestamp for the whole view. The reader's first question about
     any list like this is "how old is what I am looking at", and the answer is
     the same for every row: as of when the page asked. */
  const asOf = centre.as_of
    ? `<p class="lead-note">Read from the kernel
        <strong>${esc(when(centre.as_of))}</strong>
        <span class="note" title="${esc(new Date(centre.as_of).toString())}">${
          esc(new Date(centre.as_of).toISOString().slice(0, 16).replace('T', ' '))
        } UTC</span> · reload for a newer answer</p>`
    : '';

  return `<header class="page"><h2>Human Actions</h2></header>
    <div class="answer"><p class="lead">${lead}</p>
      <p class="lead-note">${esc(String(open.length))} open · ${esc(String(
        (centre.counts || {}).posed || 0))} need an answer from you rather than
        a setting${centre.posed_unreadable
          ? ' · <strong>the posed half could not be read</strong>' : ''}</p>
      ${asOf}</div>
    ${groups || empty('Nothing is waiting on you.')}`;
};

/* The detail. Everything needed to decide, from what the raiser recorded —
   never assembled here. A person answering must not have to read a transcript,
   a markdown ledger or a git history, and the frontend must not invent the
   wording it shows them. */
async function humanTask(id) {
  const t = await API.get(`/api/missions/human/${encodeURIComponent(id)}`)
    .catch((e) => ({ error: e.message }));
  if (t.error) return fail(t.error);

  const accepts = t.accepts || [];
  const said = `<span class="note" data-said="${esc(id)}"></span>`;
  /* Which controls exist is the request's own answer, not this page's guess.
     A question has no approve button because the model refuses approval on a
     question, and a control the API would reject should not be drawn. */
  /* A decision's controls are its options; everything else gets plain buttons.
     Drawn from what the request says it accepts, so a control the API would
     refuse is never on the page. */
  const controls = [
    accepts.includes('approve')
      ? `<button class="primary" data-respond="approve">Approve</button>` : '',
    accepts.includes('reject') ? `<button data-respond="reject">Reject</button>` : '',
    /* Options are drawn as their consequences, not as their names. A person
       choosing between "A" and "B" is not deciding; the thing that makes a
       decision answerable from this page is what each one changes and which
       records it moves. */
    accepts.includes('choose') ? (t.options || []).map((o) => `
      <div class="row"><div class="body">
        <div class="title">${esc(o.label || o.key)}</div>
        ${o.what_changes ? `<div class="meta">${esc(o.what_changes)}</div>` : ''}
        ${o.evidence_for ? `<div class="meta"><strong>Evidence:</strong>
          ${esc(o.evidence_for)}</div>` : ''}
        ${o.records_affected ? `<div class="meta"><strong>Records affected:</strong>
          ${esc(o.records_affected)}</div>` : ''}
      </div><div class="actions">
        <button class="primary" data-respond="choose"
          data-choice="${esc(o.key)}">Choose this</button>
      </div></div>`).join('') : '',
    accepts.includes('defer') ? `<button data-respond="defer">Defer</button>` : '',
  ].join(' ');

  queueMicrotask(() => {
    const note = document.querySelector(`[data-said="${CSS.escape(id)}"]`);
    document.querySelectorAll('[data-respond]').forEach((button) => {
      button.addEventListener('click', async () => {
        const kind = button.dataset.respond;
        const text = (document.getElementById('answer') || {}).value || '';
        if (kind === 'approve' && !confirm(
          'Record your approval for this request?')) return;
        /* Visible before the await: this is a round trip. */
        button.disabled = true;
        const was = button.textContent;
        button.textContent = 'Recording…';
        try {
          const done = await API.post(
            `/api/missions/human/${encodeURIComponent(id)}/respond`,
            { response: kind, body: text, chosen: button.dataset.choice || '' });
          if (note) note.textContent = `Recorded — ${done.state}. Qevik verifies this and resumes the affected work.`;
          render();
        } catch (e) {
          button.disabled = false;
          button.textContent = was;
          /* 422 is the model refusing a response this kind does not accept —
             a stated reason, not a failure to retry past. */
          if (note) note.textContent = e.message;
        }
      });
    });
  });

  return `<header class="page"><h2>${esc(t.title)}</h2>
      <p>${pill(esc(t.kind), 'wait')} ${pill(esc(t.state))}
        ${t.reversible === false ? pill('irreversible', 'warn') : pill('reversible', 'ok')}</p></header>
    <div class="card">
      <h3>Why</h3><p>${esc(t.why || '')}</p>
      ${t.blocks ? `<h3>Blocks</h3><p>${esc(t.blocks)}</p>` : ''}
      ${t.asked ? `<h3>What you need to do</h3><p>${esc(t.asked)}</p>` : ''}
      ${t.consequence ? `<h3>After you answer</h3><p>${esc(t.consequence)}</p>` : ''}
      ${t.will_not_do ? `<h3>What this does not do</h3><p>${esc(t.will_not_do)}</p>` : ''}
      ${Object.keys(t.evidence || {}).length
        ? `<h3>Evidence</h3><pre>${esc(JSON.stringify(t.evidence, null, 2).slice(0, 1200))}</pre>` : ''}
      ${t.verification ? `<h3>Closes when</h3><p>${esc(t.verification)}</p>` : ''}
      <p class="note">Raised by <code>${esc(t.created_by || 'unknown')}</code>
        ${when(t.created_at)}.</p>
    </div>
    <div class="card decide"><h3>Your response</h3>
      ${accepts.includes('answer') || accepts.includes('context') ? `
        <div class="field"><label for="answer">Answer</label>
          <textarea id="answer" rows="4" placeholder="Answer in your own words."></textarea></div>` : ''}
      ${accepts.includes('choose') ? `<div class="rows">${controls}</div>`
        : `<div class="actions">${controls}</div>`}
      <div class="actions">
        ${accepts.includes('answer') ? `<button class="primary" data-respond="answer">Record answer</button>` : ''}
        ${accepts.includes('context') ? `<button data-respond="context">Add context</button>` : ''}</div>
      ${said}
      <p class="note" style="margin-top:.7rem">This request accepts:
        ${accepts.map((a) => '<code>' + esc(a) + '</code>').join(' · ') || 'nothing'}.
        A response it does not accept is refused — a question cannot be
        approved, and no conversation here authorises an external action.</p>
    </div>
    ${(t.responses || []).length ? `<div class="card"><h3>Transcript</h3>
      <div class="rows">${t.responses.map((r) => `
        <div class="row"><div class="body">
          <div class="title">${pill(esc(r.response))} ${esc(r.actor)}</div>
          <div class="meta">${when(r.at)}${r.chosen ? ' · chose ' + esc(r.chosen) : ''}</div>
          ${r.body ? `<div class="meta">${esc(r.body)}</div>` : ''}
        </div></div>`).join('')}</div>
      <p class="note" style="margin-top:.6rem">The structured decision is
        authoritative; this transcript is supporting context.</p></div>` : ''}
    <p style="margin-top:1rem"><a href="#/actions">Back to everything waiting</a></p>`;
}

views.fabric = async () => {
  const fleet = await API.get('/api/missions/workers');
  if (!fleet.known) {
    return `<header class="page"><h2>Fabric</h2></header>
      ${empty(esc(fleet.detail || 'the cluster could not be read'))}`;
  }
  const c = fleet.counts || {};
  return `<header class="page"><h2>Fabric</h2>
      <p>Which machines can run work. ${c.ready || 0} ready · ${c.busy || 0} busy · ${c.stale || 0} stale.</p></header>
    <div class="rows">${(fleet.workers || []).map((w) => `
      <div class="row"><div class="body">
        <div class="title">${esc(w.name)} ${w.healthy ? '' : pill('STALE')}</div>
        <div class="meta">runs <code>${esc(w.serves || 'unassigned')}</code> · ${esc(w.state)}</div>
        <div class="meta">can do: ${esc((w.capabilities || []).join(', ')) || 'nothing declared'}</div>
      </div><div class="actions"><code>${esc(w.node_id)}</code></div></div>`
    ).join('') || empty('No worker has registered.')}</div>`;
};

/* The pipeline.
 *
 * Deliberately not a kanban. Columns a person rearranges by hand are what a
 * CRM looks like, and they would be a lie here: no stage on this page can be
 * set, because every one is derived from evidence — a message row that says
 * `sent`, an event that says `replied`. A card that moves under the cursor and
 * springs back is worse than no card at all.
 *
 * (The guard test reading this file forbids the attribute that would make one
 * movable, and it has no exemption for prose. Naming it in a comment is how
 * that test failed once already, so it is not named here.)
 *
 * So the order is what a person can act on, not how far along things are:
 * blockers first, because one credential unblocks many companies and that is
 * the single largest piece of work on the screen; then what can be started now,
 * named by the doing word; and the stage counts last, as a strip, because they
 * are reference rather than instruction.
 */
views.pipeline = async () => {
  const data = await API.get('/api/crm/pipeline');
  const head = `<header class="page"><h2>Pipeline</h2>
    <p>Every stage here is derived from what happened — an audit that ran, a
       message that left, a reply that arrived. Nothing on this page can be set
       by hand, which is why it cannot be optimistic.</p></header>`;

  /* An unreadable store and an empty pipeline are different facts, and only one
     of them means there is no work. */
  if (data.known === false) return head + fail(data.detail || 'the pipeline could not be read');

  const board = data.board || {};
  const rel = data.relationships || [];
  if (!rel.length) return head + empty('No company has been discovered yet.');

  const blocked = board.blocked_on || [];
  const blockers = blocked.length ? `
    <div class="answer">
      <p class="lead"><strong>${blocked[0].companies}</strong> ${
        blocked[0].companies === 1 ? 'company is' : 'companies are'} waiting on
        ${esc(blocked[0].blocker.replace(/_/g, ' ').toLowerCase())}.</p>
      <p class="lead-note">One thing obtained moves all of them at once.</p>
    </div>
    <div class="rows">${blocked.map((b) => `
      <div class="row"><div class="body">
        <div class="title">${pill(b.blocker)} <strong>${b.companies}</strong> ${
          b.companies === 1 ? 'company' : 'companies'}</div>
        <div class="meta">for example ${(b.examples || []).map(esc).join(', ')}</div>
      </div><div class="actions"><a href="#/credentials">Credentials</a></div></div>`
    ).join('')}</div>` : `
    <div class="answer"><p class="lead lead-clear">Nothing is blocked.</p>
      <p class="lead-note">${board.actionable || 0} of ${board.total || 0} can be started now.</p></div>`;

  /* Ordered by whether it can start, then by how far the relationship has got:
     a company that replied and is waiting on an answer outranks one nobody has
     audited, and neither is helped by alphabetical order. */
  const RANK = ['replied', 'customer', 'approved', 'contacted', 'proposed',
                'qualified', 'researched', 'discovered', 'dormant', 'closed'];
  const rows = rel.slice().sort((a, b) =>
    (a.next_action.blocked ? 1 : 0) - (b.next_action.blocked ? 1 : 0)
    || RANK.indexOf(a.stage) - RANK.indexOf(b.stage)
    || a.name.localeCompare(b.name));

  const strip = Object.entries(board.stages || {}).filter(([, n]) => n > 0)
    .map(([stage, n]) => `${pill(stage)} ${n}`).join(' · ');

  return head + blockers + `
    <h3 class="section">What to do next</h3>
    <div class="rows">${rows.map((r) => `
      <div class="row"><div class="body">
        <div class="title">${esc(r.name)} ${pill(r.stage)}${
          r.next_action.blocked ? ' ' + pill(r.next_action.blocked_by) : ''}</div>
        <div class="meta"><strong>${esc(r.next_action.summary)}</strong></div>
        <div class="meta">${esc(r.next_action.because)}</div>
        <div class="meta">${esc(r.because)}${
          r.last_activity ? ' · last activity ' + when(r.last_activity) : ''}</div>
      </div><div class="actions">${
        r.contactable ? '' : pill('no address', 'warn')}</div></div>`
    ).join('')}</div>
    ${data.truncated ? `<p class="note">Showing ${rel.length} of ${
      data.total_known} companies.</p>` : ''}
    <p class="note">${strip}</p>`;
};

views.credentials = async () => {
  const centre = await API.get('/api/credentials');
  /* Ordered by whose move it is: things a person must act on, then everything
     working, then adapters Qevik has not built — which are nobody's move. */
  const rank = (r) => (r.adapter_ready === false ? 2
    : r.status === 'CONNECTED' ? 1 : 0);
  const rows = (centre.credentials || []).slice().sort(
    (a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  const html = `
    <header class="page"><h2>Credentials</h2>
      <p>The one place a key is entered. No value is ever shown again after saving.</p></header>
    ${centre.vault && centre.vault.sealed ? fail(
      'The vault is sealed: QEVIK_VAULT_MASTER_KEY is not set on the server, so nothing can be stored. It refuses rather than falling back to plaintext.') : ''}
    <div class="rows">${rows.map((r) => `
      <div class="row"><div class="body">
        <div class="title">${esc(r.name)} ${pill(r.status)}
          ${r.adapter_ready === false ? pill('not built', 'wait') : ''}
          ${r.enabled === false ? pill('switched off', 'warn') : ''}</div>
        <div class="meta">${esc(r.purpose || '')}</div>
        <div class="meta">Set <code>${esc(r.credential)}</code>
          ${r.hint ? '· ends <code>' + esc(r.hint) + '</code>' : ''}
          ${r.fingerprint ? '· fingerprint <code>' + esc(r.fingerprint) + '</code>' : ''}</div>
        ${r.blocks && r.blocks.length ? `<div class="meta">Without it:
          ${esc(r.blocks.join(', '))}</div>` : ''}
        ${r.verification ? `<div class="meta">Done when: ${esc(r.verification)}</div>` : ''}
        <div class="meta">Last checked: ${r.last_checked
          ? when(r.last_checked) + (r.detail ? ' — ' + esc(r.detail) : '')
          : /* Never tested is not the same as tested and failing. Drawing them
               the same way is how a key nobody has exercised reads as broken —
               or worse, as fine. */
            '<span class="pill warn">never tested</span>'}</div>
        <div class="meta">${r.adapter_ready === false
          ? 'Nothing to do: Qevik has not built this adapter yet.'
          : r.configured
            ? (r.status === 'CONNECTED' ? 'Nothing to do.'
               : 'Your move: test it, or replace it if the test fails.')
            : 'Your move: paste the credential below.'}</div>
        <form data-provider="${esc(r.provider)}" style="margin-top:.6rem;max-width:26rem">
          <div class="field"><input type="password" name="secret" autocomplete="off"
            placeholder="${r.configured ? 'Replace this credential' : 'Paste the credential'}"></div>
          <div class="actions">
            <button class="primary" type="submit">${r.configured ? 'Rotate' : 'Save'}</button>
            <button type="button" data-test>Test</button>
            ${r.configured ? `<button type="button" data-enabled="${
              r.enabled === false ? 'on' : 'off'}">${
              r.enabled === false ? 'Switch on' : 'Switch off'}</button>` : ''}
            ${r.configured ? '<button type="button" class="danger" data-forget>Forget</button>' : ''}
            ${r.setup_url ? `<a href="${esc(r.setup_url)}" target="_blank" rel="noopener">Where to get one</a>` : ''}
          </div>
        </form>
      </div></div>`).join('')}</div>
    <p class="note" style="margin-top:1rem">
      Stored is not connected. A saved credential stays <code>PENDING_CREDENTIAL</code>
      until something tests it — reporting it as working because somebody pasted
      one is how an integration sits broken behind a green tick.</p>`;

  queueMicrotask(() => {
    document.querySelectorAll('form[data-provider]').forEach((form) => {
      const provider = form.dataset.provider;
      const configured = form.querySelector('button.primary').textContent === 'Rotate';
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const secret = form.secret.value;
        if (!secret) return;
        try {
          await API.call('/api/credentials/' + encodeURIComponent(provider) +
            (configured ? '/rotate' : ''), { method: configured ? 'POST' : 'PUT', body: { secret } });
          /* Cleared immediately: the value must not survive in the DOM, and it is
           * never read back from the server. */
          form.secret.value = '';
          render();
        } catch (err) { alert(err.message); }
      });
      const test = form.querySelector('[data-test]');
      if (test) test.addEventListener('click', async () => {
        test.disabled = true; test.textContent = 'Testing…';
        try {
          const r = await API.post('/api/credentials/' + encodeURIComponent(provider) + '/test');
          alert(r.works ? 'Connected.' : (r.status + ' — ' + (r.detail || '')));
        } catch (err) { alert(err.message); }
        finally { test.disabled = false; test.textContent = 'Test'; render(); }
      });
      const toggle = form.querySelector('[data-enabled]');
      if (toggle) toggle.addEventListener('click', async () => {
        const on = toggle.dataset.enabled === 'on';
        toggle.disabled = true; toggle.textContent = on ? 'Switching on…' : 'Switching off…';
        try {
          await API.post('/api/credentials/' + encodeURIComponent(provider) + '/enabled',
                         { enabled: on });
          render();
        } catch (err) {
          toggle.disabled = false;
          toggle.textContent = on ? 'Switch on' : 'Switch off';
          alert(err.message);
        }
      });
      const forget = form.querySelector('[data-forget]');
      if (forget) forget.addEventListener('click', async () => {
        if (!confirm('Destroy the stored credential for ' + provider + '? This cannot be undone.')) return;
        try { await API.del('/api/credentials/' + encodeURIComponent(provider)); render(); }
        catch (err) { alert(err.message); }
      });
    });
  });
  return html;
};

/* What each model did when it was last called.
 *
 * A provider's catalogue is not a list of what you can run: NVIDIA's lists 81
 * models and most of them answer 404 with a key that works. So the table above
 * says what is *registered* and this one says what was *reached*, and they are
 * deliberately two tables rather than one column, because they answer different
 * questions and a reader who conflates them will trust an offering nobody has
 * tried.
 *
 * Three states drawn three ways, and the third is the important one. A model
 * nobody has called has not failed; on a fresh deployment every row is that,
 * and painting them red would invent a fleet of faults.
 */
function measured(bench) {
  if (!bench) {
    return `<div class="card"><h3>Measured</h3>
      ${fail('The benchmark could not be read.')}</div>`;
  }
  if (bench.known === false) {
    return `<div class="card"><h3>Measured</h3>
      ${empty(esc(bench.detail || 'nothing has been measured'))}</div>`;
  }
  const rows = bench.rows || [];
  const c = (bench.summary && bench.summary.counts) || {};
  const tone = { REACHED: 'ok', REFUSED: 'bad', NOT_VERIFIED: 'warn' };
  const fastest = (bench.summary || {}).fastest;

  return `<div class="card"><h3>Measured</h3>
    <p class="note">${c.REACHED || 0} answered · ${c.REFUSED || 0} refused ·
      ${c.NOT_VERIFIED || 0} never called${fastest
        ? ` · fastest <code>${esc(fastest.model)}</code> at ${fastest.latency_ms} ms`
        : ''}</p>
    <div class="wrap-scroll"><table><thead><tr>
      <th>Model</th><th>Provider</th><th>State</th><th>Latency</th>
      <th>Cost</th><th>When</th><th>Why not</th>
    </tr></thead><tbody>
    ${rows.map((r) => `<tr>
      <td><code>${esc(r.model)}</code>${r.registered ? '' : ' <span class="note">(not registered)</span>'}</td>
      <td>${esc(r.provider || '—')}</td>
      <td>${pill(r.state, tone[r.state])}</td>
      <td class="num">${r.latency_ms == null ? '—' : r.latency_ms + ' ms'}</td>
      <td class="num">${r.cost_usd == null
        ? '<span class="unknown">UNKNOWN</span>' : '$' + r.cost_usd}</td>
      <td class="note">${r.at ? when(r.at) : '—'}</td>
      <td class="note">${esc((r.reason || '').slice(0, 90))}</td>
    </tr>`).join('')}
    </tbody></table></div>
    <p class="note" style="margin-top:.75rem">${esc((bench.summary || {}).note || '')}</p>
    ${bench.corrupt_lines ? `<p class="note">${bench.corrupt_lines} measurement
      line(s) would not parse and were skipped.</p>` : ''}</div>`;
}

views.businesses = async () => {
  const me = await API.get('/api/customer/me').catch(() => null);

/* The thirteen questions, in the order the commercial chain runs them.
   Their keys are the API's, so a renamed answer shows up as a missing question
   rather than as a question quietly rendering the wrong field. */
const DOSSIER = [
  ['who', 'Who they are'],
  ['why', 'Why Qevik selected them'],
  ['observed', 'What Qevik observed'],
  ['evidence', 'What that rests on'],
  ['produced', 'What Qevik produced'],
  ['live', 'Where the artefact is'],
  ['message', 'What exactly would be sent'],
  ['recipient', 'Who would receive it'],
  ['why_usable', 'Why that contact is usable'],
  ['approval', 'What authorises it'],
  ['sent', 'Whether it was sent'],
  ['after', 'What happened afterwards'],
];

/* One renderer per question — not a generic dump, which is what this screen
   replaces. Each draws a fact that exists; the API's own `detail` explains one
   that does not. */
const ANSWER = {
  who: (a) => `${esc(a.name)}${a.website ? ` · <a href="${esc(a.website)}"
      target="_blank" rel="noreferrer">${esc(a.website)}</a>` : ''}
    ${a.geography ? `<span class="note">· ${esc(a.geography)}</span>` : ''}`,
  why: (a) => `${esc(a.statement)} ${pill(a.state)}
    ${a.needs_approval ? pill('needs a person', 'warn') : ''}
    ${a.others ? `<span class="note">· ${a.others} other opportunit${
      a.others === 1 ? 'y' : 'ies'} about them</span>` : ''}`,
  /* Three counts, never two. An observation nobody could complete is not an
     absence, and folding it in would report our own failure as their fault. */
  observed: (a) => `${a.confirmed_absent} confirmed absent ·
    ${a.confirmed_present} present ·
    ${a.not_verified} ${a.not_verified === 1 ? 'was' : 'were'} not verified
    <span class="note">of ${a.checked}, ${when(a.audited_at)}</span>
    ${a.days_old !== null && a.days_old > 7
      ? pill(a.days_old + ' days old', 'warn') : ''}
    ${a.read_by ? '' : pill('read method not recorded', 'wait')}
    <span class="owner">age is ${esc(a.age_is)}</span>`,
  evidence: (a) => `${a.fingerprints.length} evidence fingerprint(s),
    ${a.findings.length} recorded finding(s)`,
  produced: (a) => `${esc(OFFER_NAME[a.offer] || a.offer || 'not recorded')}
    ${a.accepted ? pill('accepted', 'ok') : pill('not accepted', 'wait')}
    ${a.offer && a.offer_from !== 'the publication record'
      ? pill('recovered from the recipe', 'wait') : ''}
    <span class="note">· mission ${esc(a.mission_id || '—')}</span>`,
  live: (a) => `<a href="${esc(a.url)}" target="_blank" rel="noreferrer">${esc(a.url)}</a>`,
  message: (a) => `${pill(a.status)} via ${esc(a.channel)}
    <blockquote><strong>${esc(a.subject)}</strong>\n\n${esc(a.body)}</blockquote>`,
  recipient: (a) => `<code>${esc(a.address)}</code> · ${esc(a.channel)}
    ${a.is_the_drafted_recipient && !a.still_matches_the_record
      ? pill('the record now says something else', 'warn') : ''}`,
  why_usable: (a) => a.observations.map((o) => `read from
    <a href="${esc(o.source_url)}" target="_blank" rel="noreferrer">${esc(o.source_url)}</a>`
    ).join('<br>'),
  approval: (a) => (a.evidence_moved_since.length ? `
    <p class="note">${pill(a.evidence_moved_since.length +
      ' observation(s) changed since this was approved', 'warn')}
      ${a.evidence_moved_since.map((c) => esc(
        `${c.feature}: ${c.was || '—'} → ${c.now || '—'}`)).join(' · ')}
      <br>The message still says what a person approved. Whether a changed
      observation should stop a send is their decision, not this screen's.</p>`
    : '') + a.approvals.map((v) => `${pill(v.status)}
    ${v.authorises_automated_send
      ? pill('automated send authorised', 'warn')
      : 'approved for a person to send by hand'}
    <code>${esc(String(v.fingerprint || '').slice(0, 16))}</code>`).join('<br>'),
  sent: (a) => a.sent.map((m) => `${when(m.at)} to <code>${esc(m.recipient)}</code>
    ${m.provider_message_id ? `<code>${esc(m.provider_message_id)}</code>` : ''}`).join('<br>'),
  after: (a) => a.events.length
    ? a.events.map((e) => `${when(e.at)} · ${esc(e.kind)}
        <span class="note">(${esc(e.factory)})</span>`).join('<br>')
    : esc(a.detail),
};

async function businessDetail(id) {
  const found = await API.get(
    `/api/discovery/${encodeURIComponent(id)}/dossier`).catch((e) => ({ error: e.message }));
  if (found.error) return fail(found.error);
  if (!found.known) return `<div class="card" style="margin-top:1rem">
    <p class="note">${esc(found.detail || 'not found')}</p></div>`;
  const a = found.answers;

  /* What to do, above the file rather than under it: the only derived answer
     here, and the only one acted on. It never offers to send — sending goes
     through the approval boundary, and a suggestion shaped like a control is
     the first step to becoming one. */
  const next = `<div class="answer"><p class="lead">${esc(a.next.action)}</p>
    <p class="lead-note">${esc(a.next.because)}</p></div>`;

  const chain = DOSSIER.map(([key, question], i) => {
    const answer = a[key];
    if (!answer) return '';
    const body = answer.known
      ? (ANSWER[key] ? ANSWER[key](answer) : esc(answer.detail || ''))
      : esc(answer.detail || 'not established');
    return `<li class="${answer.known ? '' : 'gap'}">
      <div class="q">${String(i + 1).padStart(2, '0')} · ${esc(question)}</div>
      <div class="a">${body}</div>
      <span class="owner">${esc(answer.from)}</span></li>`;
  }).join('');

  return `${next}<div class="card"><h3>${esc(a.who.name)}
    <span class="note">${esc(id)}</span></h3>
    <ul class="dossier">${chain}</ul>
    <p class="note" style="margin-top:.9rem">${esc(found.note)}</p></div>`;
}

/* What is at a published address. Read from the record, never guessed: a
   publication written before the field existed says nothing, and an operator
   told a health check is a website acts on the wrong thing. */
const OFFER_NAME = {
  'offer-website': 'website',
  'offer-health-check': 'health check',
};

const LIVENESS = {
  CONFIRMED_LIVE: ['live', 'ok'],
  CONFIRMED_DOWN: ['down', 'bad'],
  NOT_CHECKED: ['not checked', ''],
};

views.publications = async () => {
  /* Both halves of the page, and they answer different questions: what is
     waiting for a decision, and what is already out there. The page used to
     promise the second in its own header and render only the first. */
  /* A completed check survives the re-render that displays it. Without this
     the button fetches results, re-renders, and the re-render throws them away
     by asking again without `check` — a control that appears to do nothing. */
  const [queue, fresh] = await Promise.all([
    API.get('/api/missions/awaiting-publication').catch(() => null),
    state.checkedPublications
      ? Promise.resolve(state.checkedPublications)
      : API.get('/api/missions/published').catch(() => null),
  ]);
  const live = fresh;
  const c = (live && live.counts) || {};

  const row = (p) => {
    const [word, tone] = LIVENESS[p.liveness] || ['unknown', ''];
    return `<div class="row"><div class="body">
      <div class="title"><a href="${esc(p.url)}" rel="noopener"
        target="_blank">${esc(p.identifier || p.url)}</a>
        ${pill(word, tone)} ${p.is_demo ? pill('demo', 'warn') : ''}
        ${pill(OFFER_NAME[p.offer] || 'what this is was not recorded',
               p.offer ? '' : 'warn')}</div>
      <div class="meta">${esc(p.url)}</div>
      <div class="meta">${when(p.at)}${p.commit
        ? ' · <code>' + esc(p.commit.slice(0, 12)) + '</code>' : ''}${
        p.status ? ' · answered ' + esc(String(p.status)) : ''}</div>
      ${p.detail ? `<div class="meta">${esc(p.detail)}</div>` : ''}
    </div></div>`;
  };

  const html = `
  <header class="page"><h2>Publications</h2>
    <p>What has actually gone live, and what is ready but not authorised.</p></header>
  ${queue === null ? fail('the queue could not be read') + `<p class="note">This is
    what the kernel said. An empty list is not shown here, because an empty list
    reads as "nothing is waiting".</p>` : awaitingPublication(queue.awaiting || [])}

  <h3 style="margin:1.5rem 0 .4rem">On the internet
    <span class="note">${esc(String(c.total || 0))}</span></h3>
  ${live === null ? fail('the published addresses could not be read') : `
    <p class="note" style="margin-bottom:.6rem">${esc(String(c.demos || 0))} of
      them are demo pages whose address travels inside an outreach message.
      ${c.live || c.down ? esc(`${c.live || 0} live, ${c.down || 0} down`) + '. ' : ''}
      ${c.unchecked ? esc(String(c.unchecked)) + ' not checked.' : ''}</p>
    <div class="actions" style="margin-bottom:.7rem">
      <button data-check-live>${live.checked ? 'Check again' : 'Check every address now'}</button>
      <span class="note" data-check-said>Asks each one over the network. Nothing
        is published or changed.</span></div>
    <div class="rows">${(live.published || []).map(row).join('')
      || empty('Nothing has been published yet.')}</div>
    <p class="note">${esc(live.note || '')}</p>`}

  <div class="card" style="margin-top:1rem"><p class="note"><strong>READY_TO_PUBLISH
    is not PUBLISHED.</strong> Approval permits a publication; it does not
    perform one.</p>
    <p class="note">This list is read from the timeline, never from the disk. A
    directory on a server is not something Qevik decided to publish.</p>
    <p><a href="#/businesses">Businesses</a></p></div>`;

  queueMicrotask(() => {
    const button = document.querySelector('[data-check-live]');
    if (!button) return;
    button.addEventListener('click', async () => {
      const said = document.querySelector('[data-check-said]');
      /* Visible before the await: this asks every address in sequence and can
         take a while, and a button that looks inert gets pressed again. */
      button.disabled = true;
      button.textContent = 'Asking each address…';
      if (said) said.textContent = '';
      try {
        state.checkedPublications = await API.get(
          '/api/missions/published?check=true');
        render();
        /* Held only for the render that displays it. A liveness verdict is a
           measurement with a time on it, and showing a five-minute-old one as
           the current state is how a dead demo keeps looking fine. */
        setTimeout(() => { state.checkedPublications = null; }, 0);
      } catch (e) {
        button.disabled = false;
        button.textContent = 'Check every address now';
        if (said) said.textContent = e.message;
      }
    });
  });
  return html;
};

/* Accepted work, and the fact that nothing has taken it anywhere.
 *
 * The two states are drawn apart on purpose. ACCEPTED is a thing that happened:
 * a person looked at a specific commit and said yes. AWAITING PUBLICATION is a
 * thing that has *not* happened, and drawing it in the same weight as the
 * acceptance is how a queue starts reading as a record of work completed. */
/* The words for a state the API reports, and only for states it reports.
 *
 * The card said "waiting for publication" unconditionally, which is the console
 * answering a question the kernel already answers — a second answer, and the one
 * on screen. A state nobody here knows renders as itself rather than as a guess. */
const WAITING = { AWAITING_PUBLICATION: 'waiting for publication' };

function awaitingPublication(rows) {
  if (!rows.length) {
    return `<div class="card"><h3>Awaiting publication</h3>
      <p class="note">Nothing accepted is waiting. An artefact appears here once
      somebody has reviewed it and said yes.</p></div>`;
  }
  /* A list, not a table. Five columns at 390px wrapped the commit id one
     character per line and repeated a caveat in every row — a table squeezed
     onto a phone rather than a design for one. The caveat is said once, above. */
  return `<div class="card" style="margin-bottom:1rem">
    <h3>Awaiting publication</h3>
    <p class="note">${esc(String(rows.length))}
      accepted artefact${rows.length === 1 ? '' : 's'}. Each shows the commit a
      person actually reviewed, not whatever its branch holds now. Nothing here
      has been published, sent or promoted — there is no capability that could
      yet, and when there is it will need its own approval.</p>
    ${rows.map((r) => `<div class="card" style="margin-top:.75rem">
      <div class="title">${esc(r.business_name || r.business_id || '—')}</div>
      <div class="meta">${pill('accepted', 'ok')}
        ${pill(WAITING[r.state] || r.state || 'state unknown',
               WAITING[r.state] ? 'warn' : '')}
        <span class="note">${esc(r.scope || '')}</span></div>
      <dl class="facts">
        <dt>Reviewed</dt><dd><code>${esc((r.commit || '').slice(0, 12))}</code></dd>
        <dt>Accepted</dt><dd>${when(r.accepted_at)} by
          ${esc(r.accepted_by || '—')}${r.note
            ? ' <span class="note">' + esc(r.note) + '</span>' : ''}</dd>
      </dl>
      <p class="trail"><a href="#/missions/${encodeURIComponent(r.mission_id)}">Read
        the artefact &rarr;</a></p>
    </div>`).join('')}
  </div>`;
}

/* --------------------------------------------------- drafted, undecided
 *
 * Fourteen messages were written to strangers and nobody decided about any of
 * them, and there was nowhere an operator could see that, let alone see why.
 * Per draft, from the kernel: which business, which channel, when the words
 * were written, how long they have sat, and why nobody has answered.
 *
 * Read-only, and there is deliberately no control anywhere on it. Approving is
 * a decision about one message bound to the fingerprint of the words a person
 * actually read; a button on a list of fourteen is how fourteen strangers get
 * written to with one click. That control lives on the mission that composed
 * the message and stays there.
 *
 * Every sentence under a row is the kernel's own wording, printed. A second
 * opinion about why something is undecided would be the untested one, and it
 * would be the one a person read before writing to a stranger. */
views.outreach = async () => {
  const head = `<header class="page"><h2>Outreach</h2>
    <p>Drafted messages nobody has decided about, and what the records say
      about why.</p></header>`;
  let found;
  try {
    found = await API.get('/api/missions/outreach-unreviewed');
  } catch (e) {
    /* The failure, never an empty list. "No drafts are waiting" is the single
       most expensive thing this page could say wrongly: it reads as every
       message having been dealt with. */
    return head + fail(e.message) + `<p class="note">This is what the kernel
      said. Nothing is listed on a failed read, because an empty list here
      would read as every draft having been decided about.</p>`;
  }
  return head + unreviewedOutreach(found);
};

function unreviewedOutreach(found) {
  const rows = found.unreviewed || [];
  const n = found.counts || {};
  if (!rows.length) {
    return `<div class="answer"><p class="lead lead-clear">No draft is
        waiting.</p>
      <p class="lead-note">Every message on file has been decided about, one
        way or the other.</p></div>
      <p class="note">${esc(found.note || '')}</p>`;
  }
  /* The length of a list the kernel produced, not a judgement about it. Which
     conditions exist and which apply are settled in `outreach/unreviewed.py`;
     this counts the rows that came back carrying any, because "nine are waiting
     on you and five cannot be answered yet" is the shape of the afternoon. */
  const settle = rows.filter((r) => (r.blocked_on || []).length).length;
  const total = n.total === undefined ? rows.length : n.total;
  return `<div class="answer">
      <p class="lead"><strong>${esc(String(total))}</strong> drafted
        message${total === 1 ? '' : 's'} nobody has decided about.</p>
      <p class="lead-note">${esc(String(n.never_asked || 0))} never put to
        anybody · ${esc(String(n.asked || 0))} asked and unanswered ·
        ${esc(String(n.asked_about_the_business || 0))} asked about the
        business but not these words · ${esc(String(settle))} with something in
        the record to settle first</p></div>
    <div class="rows">${rows.map(draftedRow).join('')}</div>
    <p class="note" style="margin-top:.9rem">${esc(found.note || '')}</p>
    <div class="card" style="margin-top:1rem"><p class="note"><strong>Nothing on
      this page decides anything.</strong> Approving a message is a separate act
      on the mission that composed it, one message at a time and bound to the
      exact words that were read. Sending is a third act behind its own
      authorisation.</p></div>`;
}

/* One draft, with both questions answered and the record behind each answer.
 *
 * The second band is drawn even when it is empty. A section that disappears
 * reads as "not shown"; a section that says nothing has to be settled first is
 * the difference between a draft waiting on a person and one that cannot be
 * answered yet, which is the distinction this screen exists to make. */
function draftedRow(r) {
  const blocked = r.blocked_on || [];
  const traces = r.traces || {};
  /* Underscores and capitals out, the kernel's names intact — a typographic
     change and not a rewording, the same one `outreachCard` makes. */
  const words = (name) => String(name || '').replace(/_/g, ' ').toLowerCase();
  const origin = r.mission_id ? 'mission <code>' + esc(r.mission_id) + '</code>'
    : r.proposal_id ? 'proposal <code>' + esc(r.proposal_id) + '</code>'
    : 'no pipeline recorded';
  return `<div class="row"><div class="body">
      <div class="title">${esc(r.business_name || r.business_id
        || 'a business the row does not name')}
        ${pill(r.channel || 'no channel recorded', r.channel ? '' : 'warn')}</div>
      <div class="meta">${esc(r.subject || 'no subject recorded')}${r.recipient
        ? ' · to ' + esc(r.recipient) : ''}</div>
      <div class="meta">${origin} · <code>${esc(r.message_id || '—')}</code></div>
      <div class="asks"><span class="q">Has anybody been asked</span>
        ${pill(words(r.state), TONE[r.state] || '')}
        <p class="said">${esc(traces[r.state] || '')}</p></div>
      <div class="asks"><span class="q">To settle before anybody could
          answer</span>
        ${blocked.length
          ? blocked.map((b) => `<div class="settle">${pill(words(b), 'warn')}
              <p class="said">${esc(traces[b] || '')}</p></div>`).join('')
          : `<p class="said">Nothing in the record has to be settled
              first.</p>`}</div>
    </div>
    <div class="waited">${r.drafted_at
      ? `<b>${esc(String(r.waiting_days))}</b> day${r.waiting_days === 1 ? '' : 's'}
         since the words were written<br>drafted ${when(r.drafted_at)}`
      : `<b class="undated">not dated</b> the row records no moment, so how long
         it has waited is not a number anybody has`}</div>
  </div>`;
}

views.measurements = async () => `
  <header class="page"><h2>Measurements</h2>
    <p>What changed, and whether we can honestly say so.</p></header>
  <div class="card"><p class="note">Measurements are recorded per business.</p>
  <p class="note">A metric with no data reads <span class="pill warn">NOT_VERIFIED</span>,
  never zero. Search Console genuinely returns zero clicks for a page nobody
  clicked; a refused request returns nothing, and recording that as zero
  manufactures a decline out of an authentication error.</p>
  <p><a href="#/businesses">Businesses</a></p></div>`;

views.reports = async () => {
  const listing = await API.get('/api/missions');
  const withReports = (listing.missions || []).filter((m) => m.report_path);
  return `<header class="page"><h2>Reports</h2>
      <p>Every finished mission leaves a durable report.</p></header>
    <div class="rows">${withReports.map((m) => `
      <div class="row"><div class="body">
        <div class="title"><a href="#/missions/${encodeURIComponent(m.mission_id)}">${esc(m.title)}</a></div>
        <div class="meta"><code>${esc(m.report_path)}</code> · ${when(m.updated_at)}</div>
      </div><div class="actions">${pill(m.status)}</div></div>`).join('')
      || empty('No reports yet. One is written when a mission finishes.')}</div>`;
};

views.history = async () => {
  const listing = await API.get('/api/chat');
  return `<header class="page"><h2>History</h2>
      <p>Every conversation, and the mission it became.</p></header>
    <div class="wrap-scroll"><table>
      <thead><tr><th>Conversation</th><th>Status</th><th>Mission</th><th>When</th></tr></thead>
      <tbody>${(listing.conversations || []).map((c) => `<tr>
        <td><a href="#/chat/${encodeURIComponent(c.conversation_id)}">${esc(c.title)}</a></td>
        <td>${pill(c.status)}</td>
        <td>${c.mission_id ? `<a href="#/missions/${encodeURIComponent(c.mission_id)}">
          <code>${esc(c.mission_id)}</code></a>` : '—'}</td>
        <td>${when(c.at)}</td></tr>`).join('')}</tbody></table></div>`;
};

views.settings = async () => {
  /* Three answers from the plan route, not two. `.catch(() => null)` collapsed
     "this tenant is not on a plan" into "nothing to show", so the card simply
     vanished — and an operator whose metered work is about to be refused had
     no way to learn why. 409 is the provisioning gap the route deliberately
     raises; anything else is a read that failed. */
  const [me, health, plan] = await Promise.all([
    API.get('/auth/me').catch(() => null),
    API.get('/api/health').catch(() => null),
    API.get('/api/customer/plan')
      .then((found) => ({ state: 'on-a-plan', found }))
      .catch((e) => ({ state: e.status === 409 ? 'no-plan' : 'unreadable',
                       detail: e.message })),
  ]);
  return `<header class="page"><h2>Settings</h2></header>
    <div class="grid">
      <div class="card"><h3>Session</h3>
        <p><code>${esc(me ? me.username : '—')}</code></p>
        <p class="note">Tenant <code>${esc((me && me.tenant_id) || '—')}</code></p>
        <p class="note">Scopes: ${esc(((me && me.scopes) || []).join(', '))}</p></div>
      <div class="card"><h3>Allowance</h3>${
        plan.state === 'on-a-plan'
          ? `<div class="stat">${esc(plan.found.plan)}</div>
             <p class="note">${esc(plan.found.remaining)} of
               ${esc(plan.found.included_units)} units left${
               plan.found.reserved_for_essential
                 ? ', ' + esc(plan.found.reserved_for_essential) + ' held back for essential work'
                 : ''}.</p>
             ${plan.found.resets_at ? `<p class="note">Resets ${when(plan.found.resets_at)}.</p>` : ''}`
        : plan.state === 'no-plan'
          ? `<div class="stat">${pill('not on a plan', 'warn')}</div>
             <p class="note">This tenant has no allowance, so anything metered
               refuses rather than running. That is a provisioning gap, not an
               empty balance — nothing has been used up.</p>
             <p class="note">Units, never money. There is no pricing in this
               layer and no figure here claims to know one.</p>`
          : `<div class="stat">${pill('unknown', 'warn')}</div>
             <p class="note">The allowance could not be read, which is not the
               same as there being none. ${esc(plan.detail || '')}</p>`}</div>
      ${health ? `<div class="card"><h3>Deployment</h3>
        <p>${pill(health.status)}</p>
        ${Object.entries(health.components || {}).map(([name, c]) =>
          `<div class="meta">${esc(name)}: ${c.configured ? 'configured' : 'absent'}
           ${c.detail ? '— ' + esc(c.detail) : ''}</div>`).join('')}</div>` : ''}
    </div>`;
};

/* --------------------------------------------------------------- render */
async function render() {
  if (!API.token) {
    live.stop();
    $('login').classList.remove('hidden');
    $('shell').classList.add('hidden');
    return;
  }
  $('login').classList.add('hidden');
  $('shell').classList.remove('hidden');
  $('live').classList.remove('hidden');
  if (!live.timer) live.start();
  drawNav();
  const main = $('main');
  main.setAttribute('aria-busy', 'true');
  try {
    main.innerHTML = await (views[state.page] || views.dashboard)();
  } catch (e) {
    main.innerHTML = fail(e.message) +
      '<p class="note">This is what the kernel said. The page shows it rather than ' +
      'an empty list, because an empty list reads as "you have none".</p>';
  }
  main.removeAttribute('aria-busy');
  drawNav();
}

/* ---------------------------------------------------------- live status
 *
 * Polling with a version token rather than server-sent events, and that is a
 * decision. This page is served through Cloudflare, which buffers streaming
 * responses by default — an SSE channel would work locally, pass review, and
 * deliver nothing in production. Polling also holds no connection open, so a
 * hundred idle tabs cost a single-worker deployment nothing.
 *
 * The page is never load-bearing for the work: this only decides when to
 * re-read. Closing the tab stops the polling and stops nothing else.
 */
/* Whether somebody is part-way through writing something.
 *
 * The pages the poll refreshes include Chat, and the conversation screen has
 * the box a feature request is typed into. A mission moving from running to
 * complete would re-render the page underneath the person and take the half
 * written sentence with it — every four seconds, on the screen whose whole
 * purpose is composing that sentence.
 *
 * Focus is not enough on its own: a phone keyboard dismissal drops focus while
 * the text stays on screen, so unsent content counts too.
 */
function typing() {
  const active = document.activeElement;
  if (active && /^(TEXTAREA|INPUT)$/.test(active.tagName) && active.type !== 'checkbox') {
    return true;
  }
  return [...document.querySelectorAll('textarea, input[type=text], input[type=password]')]
    .some((field) => field.value.trim().length > 0);
}

const live = {
  version: '', timer: null, failures: 0,

  start() {
    this.stop();
    this.tick();
    this.timer = setInterval(() => this.tick(), 4000);
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  async tick() {
    if (!API.token || document.hidden) return;
    try {
      const status = await API.get('/api/status?since=' + encodeURIComponent(this.version));
      this.failures = 0;
      if (!status.changed) { this.show(status, false); return; }
      const first = !this.version;
      this.version = status.version;
      this.show(status, true);
      /* Re-render only the pages a change could affect. Redrawing Credentials
       * because a mission moved would discard whatever somebody was typing. */
      if (!first && ['dashboard', 'missions', 'chat', 'reports', 'history'].includes(state.page)
          && !typing()) {
        render();
      }
    } catch (e) {
      /* A failed poll is not a failed mission. The badge says the view may be
       * behind; it does not claim anything about the work. */
      this.failures += 1;
      if (this.failures >= 2) {
        const box = $('live');
        box.className = 'stale';
        box.textContent = 'Not refreshing — the view may be behind';
      }
    }
  },

  show(status, changed) {
    const box = $('live');
    const c = status.counts;
    if (!c) return;
    box.className = '';
    const bits = [];
    if (c.running) bits.push(c.running + ' running');
    if (c.needs_me) bits.push(c.needs_me + ' needs you');
    if (c.blocked) bits.push(c.blocked + ' blocked');
    box.textContent = bits.length ? bits.join(' · ') : 'Nothing running';
    box.onclick = () => { location.hash = c.needs_me ? '#/actions' : '#/missions'; };
  },
};

/* Stop polling while the tab is hidden and catch up on return. A phone in a
 * pocket should not be asking every four seconds. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && API.token) live.tick();
});

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = $('login-error');
  box.innerHTML = '';
  try {
    const r = await API.call('/auth/login', {
      method: 'POST', body: { username: $('u').value, password: $('p').value },
    });
    API.token = r.token || r.access_token || '';
    $('p').value = '';
    if (!API.token) throw new Error('No session token was returned.');
    state.me = await API.get('/auth/me').catch(() => null);
    navigate();
  } catch (err) { box.innerHTML = fail(err.message); }
});

(async function start() {
  if (API.token) state.me = await API.get('/auth/me').catch(() => null);
  navigate();
})();
</script>
