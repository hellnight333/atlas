<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qevik Control</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Qevik Control.
 *
 * One file, no build step, no dependency. That is a deployment decision, not a
 * stylistic one: the control plane has to be serveable by copying a directory
 * onto a host that runs Caddy and nothing else, and every build chain is another
 * thing that can be broken on the day the operator needs the console most.
 *
 * The CSP in qevik-production.Caddyfile allows 'self' and inline style/script
 * and nothing else — no CDN, no font host, no analytics. This file is written to
 * that policy rather than asking for it to be relaxed.
 */
:root {
  /* Neutrals biased green, not pure grey: the base plane sits under the brand
     teal all day and a neutral grey reads as inherited rather than chosen. */
  --bg: #0b1211; --panel: #121b1a; --line: #223029; --raised: #16211f;
  --text: #e4ece8; --muted: #8ea099; --dim: #5f736c;
  /* #0d6e6b is the actual Qevik mark — the same value as the public site's
     theme-color and logo fill. The console previously used #4c8dff, a generic
     admin blue that matched nothing in this repository. */
  --accent: #17a29c; --accent-dim: #0d3330; --brand: #0d6e6b;
  /* Semantic colour, kept off the accent. "Needs a person" must never read as
     "selected", and every status below also carries a word. */
  --ok: #4f9d7a; --warn: #e8b64c; --bad: #d8564f; --wait: #7f9cd8;
  --signal: #e8b64c;
  --radius: 10px; --gap: 16px;
  /* Two faces, per the design system's roles. The serif is for the one line
     that answers "what needs me" — an instrument panel with a display voice,
     not a document. */
  --display: ui-serif, Iowan Old Style, Georgia, serif;
  --ui: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f6f4; --panel: #ffffff; --line: #d5e0db; --raised: #e9f0ed;
    --text: #10201c; --muted: #4d5f59; --dim: #74857f;
    --accent: #0d6e6b; --accent-dim: #d8ecea;
    --ok: #2f7d5c; --warn: #a5731a; --bad: #b23c36; --wait: #4b6bb0;
    --signal: #a5731a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--ui);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font: inherit; cursor: pointer; border-radius: 6px; padding: .5rem .9rem;
  border: 1px solid var(--line); background: var(--raised); color: var(--text);
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
input, textarea, select {
  font: inherit; width: 100%; padding: .55rem .7rem; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input:focus, textarea:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
code, pre { font-family: var(--mono); font-size: 12.5px; }
/* Counts that stack in a column must not jitter as their digits change. */
.count, .stat, td, .tabular { font-variant-numeric: tabular-nums; }
pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: .8rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}

/* ---------------------------------------------------------------- layout */
#shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
/* A grid item defaults to `min-width: auto`, which means it refuses to shrink
 * below its content — so one wide child (a mission id, a long note) widened the
 * whole column and the page scrolled sideways on a phone with the fourth
 * navigation item pushed off the screen entirely. This is the fix for that, and
 * it is needed on every level of the nesting, not only the outer one. */
#shell > *, main, .rows, .row, .row .body, .card { min-width: 0; }
/* Identifiers and URLs have no spaces to break at. Without this they are the
 * one child that reintroduces the overflow above. */
code, .meta, .title { overflow-wrap: anywhere; }
nav {
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 1rem .75rem; display: flex; flex-direction: column; gap: 2px;
}
nav h1 {
  font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); margin: .25rem .5rem 1rem;
}
nav a {
  padding: .5rem .6rem; border-radius: 6px; color: var(--text);
  display: flex; justify-content: space-between; align-items: center; gap: .5rem;
}
nav a:hover { background: var(--raised); text-decoration: none; }
nav a[aria-current="page"] { background: var(--accent-dim); color: var(--accent); }
nav .count {
  font-size: 11px; background: var(--raised); border: 1px solid var(--line);
  border-radius: 20px; padding: 0 .45rem; color: var(--muted);
}
nav .count.alert { background: var(--signal); border-color: var(--signal); color: #14100a; }
/* The short label exists for the thumb bar only; the rail shows the long one. */
nav a .short { display: none; }
/* A link that leaves the single-page app. Marked, because a rail where one
 * entry silently swaps the whole document is a rail that behaves inconsistently
 * for no visible reason — the arrow is the reason, made visible. */
nav a.external { color: var(--muted); }
nav a.external::after { content: '\2197'; color: var(--dim); font-size: 12px; }
nav a.external:hover { color: var(--text); }
nav .spacer { flex: 1; }
nav .who { font-size: 12px; color: var(--dim); padding: .5rem .6rem; }
main { padding: 1.5rem; max-width: 1180px; }
header.page { margin-bottom: 1.25rem; }
header.page h2 { margin: 0 0 .25rem; font-size: 21px; }
header.page p { margin: 0; color: var(--muted); }

/* ------------------------------------------------------------- the phone */
/*
 * Not the desktop sidebar turned sideways. That is what this was: fourteen
 * destinations in a horizontal scroller at the top of the screen, none of them
 * reachable by thumb and most irrelevant on a phone.
 *
 * Instead one column that answers "what needs me" at the top, and four
 * destinations pinned within thumb reach at the bottom. Everything else is
 * behind More — a phone is for deciding, not for browsing.
 */
@media (max-width: 820px) {
  #shell { grid-template-columns: 1fr; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    flex-direction: row; border-right: 0; border-top: 1px solid var(--line);
    padding: .35rem .35rem calc(.35rem + env(safe-area-inset-bottom));
    gap: 2px; background: var(--panel);
    box-shadow: 0 -8px 24px rgb(0 0 0 / .28);
  }
  nav h1, nav .spacer, nav .who, nav #signout { display: none; }
  /* Only the four that matter with one hand. `data-thumb` marks them in the
     markup, so the set is declared once rather than inferred from position. */
  nav a:not([data-thumb]) { display: none; }
  nav a {
    position: relative; flex: 1; flex-direction: column; gap: 2px;
    justify-content: center; text-align: center; font-size: 11.5px;
    padding: .5rem .25rem;
    min-height: 52px;              /* a thumb target, not a link */
  }
  nav a .count { position: absolute; top: .3rem; right: 20%; }
  nav a .long { display: none; }
  nav a .short { display: block; }
  /* Ordered here, not by position in PAGES. What needs a person comes first
     because that is the reason to open this on a phone at all; More is last
     because it is the way out rather than a destination. */
  nav a[href="#/actions"] { order: 1; }
  nav a[href="#/missions"] { order: 2; }
  nav a[href="#/chat"]     { order: 3; }
  nav a[href="#/more"]     { order: 4; }
  main { padding: 1rem 1rem calc(78px + env(safe-area-inset-bottom)); }
  header.page h2 { font-size: 25px; }
  /* A 44px control spanning the column is reachable wherever the thumb is. */
  .actions button, .actions > a { flex: 1 1 auto; min-height: 44px; }
  .row { flex-direction: column; align-items: stretch; }
  .row .actions { justify-content: flex-start; }
  #live { bottom: calc(74px + env(safe-area-inset-bottom)); }
}

/* The answer plane: one statement, above the reference.
 *
 * Deliberately not a card. A seventh card would join the rhythm of the six
 * below it and stop being an answer — the whole point is that it does not look
 * like the things it sits above. It carries no border and no panel fill; the
 * hierarchy comes from the face and the size, which is what a display role is
 * for. */
.answer { margin: 0 0 1.4rem; }
.lead {
  font-family: var(--display); font-size: 27px; line-height: 1.25;
  margin: 0; color: var(--text); letter-spacing: -.01em;
}
.lead strong { color: var(--signal); font-weight: 600; }
/* "Nothing needs you" is good news and must not wear the attention colour. */
.lead-clear { color: var(--muted); }
/* An unmeasured cost is drawn as its own thing — not as a number, and not in
 * the shape of one. It rendered as the literal string `undefined`, which reads
 * as a bug to a developer and as a value to everybody else. A missing
 * measurement is not zero and must not be able to look like one. */
.unknown {
  font-family: var(--ui); font-size: 15px; font-weight: 600;
  letter-spacing: .06em; color: var(--muted);
}
.lead-note {
  margin: .35rem 0 0; color: var(--muted); font-size: 13px;
  font-variant-numeric: tabular-nums;
}
@media (max-width: 820px) { .lead { font-size: 24px; } }

/* ------------------------------------------------------- one prospect */
/*
 * A chain, not a grid of cards. The numbering is earned: these are the
 * commercial steps in the order they run, and the first one without an answer
 * is the next thing somebody has to do — so the gaps must be findable by
 * scanning one edge rather than by reading.
 *
 * A fact that does not exist is a break in the rule and dimmed text, never the
 * absence colour: "nobody has approved this" is not a problem with the
 * business, and drawing it red invents a finding somebody then repeats aloud.
 */
.dossier { list-style: none; margin: 0; padding: 0; }
.dossier li {
  border-left: 2px solid var(--line); padding: .5rem 0 .5rem .9rem;
}
.dossier li.gap { border-left-style: dashed; }
.dossier .q {
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--dim); font-variant-numeric: tabular-nums;
}
.dossier .a { margin: .15rem 0 0; overflow-wrap: anywhere; }
.dossier li.gap .a { color: var(--muted); }
.dossier .owner {
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  display: block; margin-top: .2rem;
}
.dossier blockquote {
  margin: .4rem 0 0; padding: .5rem .7rem; border: 1px solid var(--line);
  border-radius: 4px; white-space: pre-wrap; font-size: 13.5px;
}

/* ------------------------------------------------- a plan somebody approves */
/*
 * This is the screen where a person takes responsibility for what runs against
 * Qevik's own source, so it is the one screen that must not be skimmable. The
 * plan used to be rendered as a chat message: a wall of text where the files
 * about to be edited, the cost, and the blockers all had the same weight as the
 * conversation around them.
 */
.stage { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.plan .goal { font-family: var(--display); font-size: 19px; margin: 0 0 .4rem; }
.steps { margin: .8rem 0 0; padding-left: 1.2rem; }
.steps li { margin-bottom: .6rem; }
.steps .what { font-weight: 600; }
.steps .files { margin-top: .25rem; display: flex; flex-wrap: wrap; gap: .3rem; }
/* The files are the part a reviewer actually has to look at, so they are not
 * inline prose. */
.steps .files code {
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 5px; padding: .1rem .35rem;
}
.facts { display: grid; grid-template-columns: max-content 1fr;
  gap: .3rem .9rem; margin: .9rem 0 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }

.blockers { display: flex; flex-direction: column; gap: .6rem; margin: .8rem 0 0; }
.blocker {
  border-left: 3px solid var(--bad); padding: .1rem 0 .1rem .7rem;
}
/* An external provider refusing is not the deployment's fault and must not be
 * drawn as though somebody here forgot something. Different colour, and the
 * action text says so. */
.blocker.external { border-left-color: var(--wait); }
.blocker .what { margin-top: .25rem; }
.blocker .do { margin-top: .25rem; color: var(--muted); font-size: 13px; }
.card.why { border-left: 3px solid var(--bad); }
.origins { border: 0; padding: 0; margin: .9rem 0 0; }
.origins legend { padding: 0; font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); }
.origin { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem;
  align-items: start; padding: .55rem .7rem; margin-top: .45rem;
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.origin input { grid-row: span 2; margin-top: .2rem; accent-color: var(--accent); }
.origin .what { font-weight: 600; }
.origin .note { grid-column: 2; font-size: 13px; }
.origin:has(input:checked) { border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent); }
/* The one that changes Qevik itself is marked before it is chosen, not after. */
.origin.guarded:has(input:checked) { border-color: var(--warn);
  background: color-mix(in srgb, var(--warn) 10%, transparent); }
.origin:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Clear of the last option. Flush against it, the buttons read as part of that
 * choice rather than as the decision about all of them. */
.decide .actions { margin-top: 1.1rem; }
/* A link, not a control. Inside `.actions` the pill stretched to the flex row
 * and read as an empty input — a thing you type in rather than follow. */
.trail { margin: .9rem 0 0; font-size: 14px; }
.trail a { color: var(--accent); text-decoration: none; }
.trail a:hover, .trail a:focus { text-decoration: underline; }
.card.why p { margin: 0; overflow-wrap: anywhere; }

.decide { border-color: var(--signal); }
.report {
  max-height: 22rem; overflow: auto; white-space: pre-wrap;
  font-size: 12px; line-height: 1.5; margin: 0;
}
@media (max-width: 820px) {
  /* One column: a definition list in two columns at 390px puts three words on
     each line and reads as a table nobody can scan. */
  .facts { grid-template-columns: 1fr; gap: .15rem; }
  .facts dt { margin-top: .5rem; }
  .plan .goal { font-size: 18px; }
  .report { max-height: 16rem; }
}

/* ---------------------------------------------------------------- pieces */
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1rem;
}
.card h3 { margin: 0 0 .6rem; font-size: 13px; color: var(--muted); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; }
.stat { font-size: 27px; font-weight: 600; line-height: 1.1; }
.stat small { font-size: 13px; color: var(--muted); font-weight: 400; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .85rem 1rem; display: flex; gap: 1rem; align-items: flex-start;
  justify-content: space-between; flex-wrap: wrap;
}
.row .body { flex: 1; min-width: 220px; }
.row .title { font-weight: 600; }
.row .meta { color: var(--muted); font-size: 12.5px; margin-top: .2rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }

.pill {
  display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  padding: .15rem .5rem; border-radius: 20px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap;
}
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.run { color: var(--accent); border-color: var(--accent); }
.pill.wait { color: var(--wait); border-color: var(--wait); }

/* The mission lifecycle, drawn as the sequence it actually is. */
.track { display: flex; flex-wrap: wrap; gap: 4px; margin-top: .6rem; }
.track span {
  font-size: 10.5px; padding: .12rem .45rem; border-radius: 4px;
  border: 1px solid var(--line); color: var(--dim);
}
.track span.done { color: var(--ok); border-color: var(--ok); }
.track span.now { background: var(--accent); border-color: var(--accent); color: #fff; }
.track span.bad { color: var(--bad); border-color: var(--bad); }

/* ------------------------------------------------- drafted, undecided
 *
 * Two labelled bands per row, because the kernel keeps the two questions apart
 * in the record: whether anybody was ever asked, and whether anything has to be
 * settled before a person could answer. One badge carrying both is how "nobody
 * has looked at this" and "this cannot be approved yet" become the same amber
 * dot, and telling those apart is the whole job of the screen.
 *
 * `--bad` appears nowhere here. A draft nobody has decided about is not a
 * failure, and red invents a problem an operator then hurries to clear. */
.asks { margin-top: .6rem; }
.asks + .asks { border-top: 1px dashed var(--line); padding-top: .55rem; }
.asks .q {
  display: block; font-size: 10.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--dim); margin-bottom: .25rem;
}
/* A trace names columns, addresses and ids, and none of them have spaces to
 * break at — the one child that would reintroduce sideways scroll on a phone. */
.asks .said { color: var(--muted); font-size: 12.5px; margin: .25rem 0 0;
  overflow-wrap: anywhere; }
.asks .settle + .settle { margin-top: .5rem; }
/* How long it has waited, given the weight of the one number on the row: a
 * fortnight and an afternoon must not have to be read to be told apart. */
.waited {
  text-align: right; min-width: 7.5rem; color: var(--muted); font-size: 12px;
  font-variant-numeric: tabular-nums; line-height: 1.35;
}
.waited b {
  display: block; font-family: var(--display); font-size: 26px;
  font-weight: 600; color: var(--text); line-height: 1.05;
}
.waited .undated { font-size: 15px; font-family: var(--ui); color: var(--muted); }
@media (max-width: 820px) {
  .waited { text-align: left; min-width: 0; }
  .waited b { display: inline; font-size: 21px; }
}

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.wrap-scroll { overflow-x: auto; }

.note { color: var(--muted); font-size: 13px; }
/* How long something has been waiting. Green for today, amber past a
   fortnight, plain in between — the two ends are the ones worth a colour. */
.note.age.ok { color: var(--ok); }
.note.age.warn { color: var(--warn); }
/* Digits that line up in a column. `tabular-nums` because proportional figures
   make 900 ms and 1100 ms the same width, and a latency column is read by
   comparing lengths before anybody reads the numbers. */
td.num { text-align: right; font-variant-numeric: tabular-nums;
         font-family: var(--mono, ui-monospace, monospace); }
/* A heading between two bands of rows, so the second band is not read as a
   continuation of the first. */
h3.section {
  margin: 1.75rem 0 .6rem; font-size: 13px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
}
.empty { color: var(--dim); padding: 2rem; text-align: center; border: 1px dashed var(--line);
  border-radius: var(--radius); }
.error {
  border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent);
  border-radius: var(--radius); padding: .8rem 1rem; margin-bottom: 1rem;
}
.field { margin-bottom: .9rem; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: .3rem; }

/* Chat */
.msgs { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1rem; }
.msg { padding: .7rem .9rem; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--panel); max-width: 46rem; }
.msg.user { margin-left: auto; background: var(--accent-dim); border-color: var(--accent); }
.msg.system { border-style: dashed; }
.msg .from { font-size: 11px; color: var(--muted); margin-bottom: .3rem; }
.msg pre { margin: 0; background: transparent; border: 0; padding: 0; }

/* The live indicator. Fixed, small, and it never covers content: a banner
   that obscures what it is reporting on is worse than no banner. */
#live {
  position: fixed; right: 1rem; bottom: 1rem; z-index: 20;
  background: var(--panel); border: 1px solid var(--accent);
  border-radius: 20px; padding: .4rem .9rem; font-size: 12.5px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25); cursor: pointer;
}
#live.stale { border-color: var(--warn); color: var(--warn); }
@media (max-width: 820px) { #live { left: 1rem; right: 1rem; text-align: center; } }

#login { max-width: 22rem; margin: 12vh auto; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h3>Qevik Control</h3>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="note" style="margin-top:1rem">
      Credentials are never stored in this page. The session token is held in
      memory and in <code>sessionStorage</code>, and is gone when the tab closes.
    </p>
  </div>
</div>

<div id="shell" class="hidden">
  <nav id="nav"></nav>
  <main id="main"></main>
  <div id="live" class="hidden" role="status" aria-live="polite"></div>
</div>

<script>
/* Qevik Control — the browser half of the control plane.
 *
 * Two rules the whole file is written to.
 *
 * **No business logic lives here.** Every number, status and decision comes from
 * the kernel over HTTP. This file arranges what the API returns and sends back
 * what a person clicked. The moment it starts deciding, for example, whether a
 * mission is really complete, there are two answers to that question and the one
 * on screen is the one nobody tested.
 *
 * **Nothing executes from the browser.** Approving a plan POSTs an approval and
 * returns; a worker in another process picks the mission up. Closing this tab
 * cannot stop it, which is the property `test_chat_to_commit.py` proves and this
 * page must not quietly undo by, say, driving a mission from a polling loop.
 */
'use strict';

const API = {
  /* Session token in sessionStorage, never localStorage: localStorage outlives
   * the tab and survives on a shared machine long after the person walked away. */
  get token() { return sessionStorage.getItem('qevik.token') || ''; },
  set token(v) { v ? sessionStorage.setItem('qevik.token', v) : sessionStorage.removeItem('qevik.token'); },

  async call(path, options = {}) {
    const headers = { 'Accept': 'application/json' };
    if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
    if (options.body !== undefined) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, {
      method: options.method || 'GET',
      headers,
      body: options.body === undefined ? undefined : JSON.stringify(options.body),
    });
    if (response.status === 401) { this.token = ''; render(); throw new Error('Session expired'); }
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
    if (!response.ok) {
      const error = new Error((data && data.detail) || ('HTTP ' + response.status));
      error.status = response.status;
      throw error;
    }
    return data;
  },
  get(p) { return this.call(p); },
  post(p, body) { return this.call(p, { method: 'POST', body: body || {} }); },
  put(p, body) { return this.call(p, { method: 'PUT', body: body || {} }); },
  del(p) { return this.call(p, { method: 'DELETE' }); },
};

/* --------------------------------------------------------------- helpers */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* The two pieces of markdown the roadmap document actually uses: `code` and
 * **bold**. Nothing else, and no library.
 *
 * Escaped FIRST, then decorated. The other order would let a document — or a
 * customer name that reached this path — close a tag. That ordering is the
 * whole safety property here, so it is not an implementation detail to tidy:
 * every character that could open an element is already an entity by the time
 * these two regexes run, and neither can produce one from entities.
 */
const md = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

function when(iso) {
  if (!iso) return '—';
  const then = new Date(iso);
  if (isNaN(then)) return esc(iso);
  const seconds = Math.round((Date.now() - then) / 1000);
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  return then.toISOString().slice(0, 10);
}

/* The kernel's vocabulary, mapped to colour. Kept as one table so a status the
 * UI does not recognise renders neutrally rather than as a success. */
const TONE = {
  complete: 'ok', PUBLISHED: 'ok', CONNECTED: 'ok', COMPLETE: 'ok', MEASURED: 'ok',
  failed: 'bad', FAILED: 'bad', INVALID_CREDENTIAL: 'bad', blocked: 'bad', BLOCKED: 'bad',
  processing: 'run', testing: 'run', reviewing: 'run', committing: 'run',
  queued: 'run', planning: 'run', IN_PROGRESS: 'run', PROCESSING: 'run',
  awaiting_approval: 'wait', plan_proposed: 'wait', PENDING_CREDENTIAL: 'warn',
  PENDING_INFRASTRUCTURE: 'warn', PARTIAL: 'warn', NOT_AUTHORISED: 'warn',
  pending_credential: 'warn', NOT_VERIFIED: 'warn', DISABLED: 'warn',
  cancelled: '', draft: '', NOT_STARTED: '', NOT_CONFIGURED: '', DEFERRED: '',
  /* Whether anybody has been asked about a drafted message. Three states drawn
     three ways, each also carrying its own word. Amber calls on the operator;
     blue is waiting on somebody else; the middle record supports neither claim
     and is drawn as neither — and a fourth state this table does not know
     renders neutrally rather than borrowing one of them. */
  NEVER_PUT_TO_A_PERSON: 'warn', ASKED_AND_UNANSWERED: 'wait',
  ASKED_ABOUT_THE_BUSINESS_NOT_THIS_MESSAGE: '',
  /* CRM stages. Only three earn a colour, and they are the three that mean
     something changed on the other side: they answered, they are paying, or
     they have gone quiet. The early stages are things we did to them, not
     things they did, and colouring those makes a list of untouched companies
     look like progress. */
  replied: 'wait', customer: 'ok', dormant: 'warn', closed: '',
};
/* An explicit tone for values that have no intrinsic one — a count is not
   good or bad, but the queue it counts is. */
const pill = (v, tone) => `<span class="pill ${tone !== undefined ? tone : (TONE[v] || '')}">${esc(v)}</span>`;

/* The mission lifecycle, in the order `mission/service.py::ALLOWED` permits.
 * Drawn as a sequence because that is what it is, and because a status word on
 * its own does not tell an operator how much is left. */
const LIFECYCLE = ['draft', 'planning', 'awaiting_approval', 'queued',
                   'processing', 'testing', 'reviewing', 'committing', 'complete'];

function track(status) {
  const at = LIFECYCLE.indexOf(status);
  const dead = ['failed', 'blocked', 'cancelled'].includes(status);
  return '<div class="track">' + LIFECYCLE.map((step, i) => {
    let cls = '';
    if (at >= 0 && i < at) cls = 'done';
    else if (i === at) cls = 'now';
    return `<span class="${cls}">${step}</span>`;
  }).join('') + (dead ? `<span class="bad">${esc(status)}</span>` : '') + '</div>';
}

function fail(message) {
  return `<div class="error"><strong>${esc(message)}</strong></div>`;
}
const empty = (m) => `<div class="empty">${esc(m)}</div>`;

/* --------------------------------------------------------------- state */
const state = { page: 'dashboard', arg: null, me: null, counts: {},
                origins: null };

const PAGES = [
  ['dashboard', 'Dashboard'], ['roadmap', 'Roadmap'], ['missions', 'Mission Control'],
  ['schedule', 'Schedule'],
  ['chat', 'Chat'], ['opportunities', 'Opportunities'], ['discovery', 'Discovery'],
  ['actions', 'Human Actions'], ['credentials', 'Credentials'],
  ['models', 'Models'], ['businesses', 'Businesses'], ['pipeline', 'Pipeline'],
  ['publications', 'Publications'],
  /* Its own destination, not a band under Publications: what is on the internet
     and what nobody has decided to say are different questions, and a draft
     nobody has looked at is not findable from a page about published sites.
     `more` lists it automatically, so a phone keeps a route to it. */
  ['outreach', 'Outreach'],
  ['fabric', 'Fabric'],
  ['measurements', 'Measurements'], ['reports', 'Reports'], ['history', 'History'],
  ['more', 'More'], ['settings', 'Settings'],
];

/* The four destinations a phone gets, and the short labels they wear there.
 *
 * Declared, not inferred from position in PAGES: a list that grew a fifteenth
 * entry would otherwise silently change what the thumb bar shows. `more` is one
 * of them because everything not in this set has to remain reachable — a
 * destination with no route to it is a destination that has been deleted.
 */
const THUMB = {
  actions: 'Needs me', missions: 'Missions', chat: 'Chat', more: 'More',
};

function navigate() {
  const [page, arg] = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/');
  state.page = PAGES.some(([id]) => id === page) ? page : 'dashboard';
  state.arg = arg ? decodeURIComponent(arg) : null;
  render();
}
window.addEventListener('hashchange', navigate);

function drawNav() {
  $('nav').innerHTML = '<h1>Qevik Control</h1>' + PAGES.map(([id, label]) => {
    const n = state.counts[id];
    const badge = n ? `<span class="count ${id === 'actions' ? 'alert' : ''}">${n}</span>` : '';
    const current = state.page === id ? ' aria-current="page"' : '';
    /* Both labels are emitted and CSS chooses. On a phone "Needs me" says what
     * the screen is for; on a desktop rail "Human Actions" is the system's own
     * name for it and matches the page heading. Swapping the text in JS would
     * make the label depend on the width at render time rather than at paint,
     * so a rotation would leave the wrong one. */
    const thumb = THUMB[id] ? ' data-thumb' : '';
    const short = THUMB[id]
      ? `<span class="short">${esc(THUMB[id])}</span>` : '';
    return `<a href="#/${id}"${current}${thumb}>` +
           `<span class="long">${esc(label)}</span>${short}${badge}</a>`;
  }).join('') +
    /* The floor is its own document, not a hash route, so it is emitted here
     * rather than added to PAGES — an entry in PAGES with no `views` function
     * renders the dashboard, which is precisely the failure that made /office
     * look like it worked for a week. */
    '<a href="/office/" class="external">The floor</a>' +
    '<div class="spacer"></div>' +
    `<div class="who">${esc(state.me ? state.me.username : '')}</div>` +
    '<a href="#/" id="signout">Sign out</a>';
  const out = $('signout');
  if (out) out.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await API.post('/auth/logout'); } catch { /* the token is going either way */ }
    API.token = ''; state.me = null; render();
  });
}

const views = {};

views.discovery = async () => (state.arg
  ? discoveryTrail(state.arg) : discoveries());

views.opportunities = async () => opportunities();

views.dashboard = async () => {
  const [health, missions, actions, costs, blockers] = await Promise.all([
    API.get('/api/health').catch(() => null),
    API.get('/api/missions').catch(() => ({ missions: [], counts: {} })),
    API.get('/api/missions/actions').catch(() => ({ counts: {} })),
    API.get('/api/missions/costs').catch(() => null),
    API.get('/api/missions/blockers').catch(() => ({ total: 0 })),
  ]);
  const c = missions.counts || {};
  const blocking = (actions.counts && actions.counts.blocking) || 0;
  const waiting = c.awaiting_approval || 0;
  /* "Needs me" is everything a person must act on, not one category of it.
   * The badge counted only blocking credential actions, so a mission sitting in
   * awaiting_approval showed a badge on Missions and none on the destination
   * literally labelled "Needs me" — the operator's own screen disagreed with
   * itself about whether anything wanted them. */
  state.counts.actions = blocking + waiting;
  state.counts.missions = waiting;
  const degraded = health && health.degraded && health.degraded.length
    ? `<div class="card"><h3>Degraded</h3><p class="note">${health.degraded.map(esc).join(', ')}
       — a component is absent, not failed. ${esc(health.note || '')}</p></div>` : '';

  /* Present and broken, which is a different sentence from absent and a much
     louder one. The off-host backup failed every night for a day while this
     screen said "Nothing needs you": the marker file was written correctly, the
     health payload had no way to express "failed", and so nothing asked.

     Drawn above the fold rather than as a card, because a card is reference and
     this is an instruction. */
  const failing = ((health && health.failing) || []).map((name) => {
    const c = (health.components || {})[name] || {};
    return `<div class="row"><div class="body">
      <div class="title">${pill('FAILED', 'bad')} ${esc(name)}</div>
      <div class="meta">${esc(c.detail || 'no detail reported')}</div>
    </div></div>`;
  }).join('');

  /* The answer, before the metrics.
   *
   * Six identical cards have rhythm and no hierarchy: nothing on the screen was
   * louder than anything else, so the one number that decides whether to keep
   * reading — does anything want me — had to be found among five that do not.
   * This states it in a sentence, in the display face, and the cards below stay
   * as reference.
   */
  /* Named by kind, not counted. "3 things need you" reads the same whether
     they are three credentials or a product decision nobody else can make, and
     the decision is the one that stops a branch of work until it is answered. */
  const mine = (actions.open || []).filter((a) => a.blocking);
  const decisions = mine.filter((a) => a.kind === 'decision');
  const questions = mine.filter((a) => a.kind === 'question');
  const named = [
    decisions.length ? `<a href="#/actions">${decisions.length} decision${
      decisions.length === 1 ? '' : 's'} only you can make</a>` : '',
    questions.length ? `<a href="#/actions">${questions.length} question${
      questions.length === 1 ? '' : 's'}</a>` : '',
  ].filter(Boolean).join(' · ');
  const lead = state.counts.actions
    ? `<p class="lead"><strong>${state.counts.actions}</strong> ${
        state.counts.actions === 1 ? 'thing needs' : 'things need'} you.</p>
       ${named ? `<p class="lead-note">${named}</p>` : ''}
       <p class="lead-note">${waiting ? esc(waiting + ' waiting for approval') : ''}${
        waiting && blocking ? ' · ' : ''}${blocking ? esc(blocking + ' blocked on a credential') : ''}</p>`
    : failing
      /* "Nothing needs you" over a broken backup is the screen actively
         reassuring an operator about the thing that is wrong. */
      ? `<p class="lead"><strong>${((health && health.failing) || []).length}</strong> ${
          ((health && health.failing) || []).length === 1
            ? 'component is' : 'components are'} broken.</p>
         <p class="lead-note">Listed above. Nothing else is waiting on you.</p>`
      : `<p class="lead lead-clear">Nothing needs you.</p>
         <p class="lead-note">${c.running || 0} running · ${c.total || 0} total</p>`;

  return `
    <header class="page"><h2>Dashboard</h2>
      <p>Everything below is read from the kernel. Nothing on this page decides anything.</p></header>
    ${failing ? `<h3 class="section">Broken</h3><div class="rows">${failing}</div>` : ''}
    <div class="answer">${lead}</div>
    <div class="grid">
      <div class="card"><h3>Missions</h3><div class="stat">${c.total || 0}</div>
        <p class="note">${c.running || 0} running · ${c.blocked || 0} blocked</p></div>
      <div class="card"><h3>Awaiting approval</h3><div class="stat">${c.awaiting_approval || 0}</div>
        <p class="note">nothing runs until a person approves</p></div>
      <div class="card"><h3>Waiting on you</h3><div class="stat">${(actions.counts && actions.counts.blocking) || 0}
        <small>of ${(actions.counts && actions.counts.total) || 0}</small></div>
        <p class="note"><a href="#/actions">Human actions</a></p></div>
      <div class="card"><h3>Blockers</h3><div class="stat">${blockers.total || 0}</div>
        <p class="note"><a href="#/missions">by class</a></p></div>
      ${costs ? `<div class="card"><h3>Cost</h3>
        <div class="stat">${(costs.priced_calls || 0) === 0
          ? '<span class="unknown">UNKNOWN</span>'
          : esc(String(costs.known_total)) + ' <small>' + esc(costs.currency || '') + '</small>'}</div>
        <p class="note">${(costs.priced_calls || 0) === 0
          ? esc(costs.unpriced_calls
              ? costs.unpriced_calls + ' call(s) reported no cost. This is not zero.'
              : 'nothing has run yet')
          : esc(costs.note || '')}${costs.unpriced_calls && costs.priced_calls
          ? esc(' · ' + costs.unpriced_calls + ' unpriced') : ''}</p></div>` : ''}
      ${health ? `<div class="card"><h3>Claiming</h3>
        <div class="stat" style="font-size:16px">${pill((health.components.claiming || {}).status || '—')}</div>
        <p class="note">${esc((health.components.claiming || {}).detail || '')}</p></div>` : ''}
    </div>
    ${degraded}`;
};

views.roadmap = async () => {
  /* Served from MASTER_STATE.md, which the repository already maintains, so
     this page and that document cannot disagree.
   *
   * It used to expect three product bands — a payload nobody built and that
   * document does not have. The route 404'd on every load and the page
   * rendered its own apology, which was the right refusal for the wrong
   * reason: showing a hardcoded copy would create a second answer to "what is
   * built", and so would inventing bands the source does not contain. So it
   * renders what the document says.
   *
   * (The guard test reading this file forbids those three field names outright
   * and has no exemption for prose, so they are not written here.)
   *
   * Section titles come from the payload rather than being written here, for
   * the same reason: a heading renamed in the document renames itself here. */
  let data = null;
  try { data = await API.get('/control/roadmap'); } catch { data = null; }

  const head = `<header class="page"><h2>Roadmap</h2>
    <p>Read from <code>MASTER_STATE.md</code>${data && data.reconciled_at
      ? `, last reconciled ${esc(data.reconciled_at)}` : ''}. Every line here is
      a quotation, not a summary.</p></header>`;

  if (!data) return head + fail('The roadmap endpoint did not answer.');
  if (data.known === false) return head + fail(esc(data.detail || 'unreadable'));

  const cell = (row, ...names) => {
    for (const n of names) if (row[n]) return row[n];
    return '';
  };

  return head + (data.sections || []).map((s) => {
    /* A named section the document no longer has. Said out loud rather than
       skipped: a band of work that quietly stops being rendered is how a
       renamed heading takes a whole section off the screen. */
    if (s.missing) return `
      <h3 class="section">${esc(s.title)}</h3>
      ${empty(`MASTER_STATE.md no longer has a section called "${s.title}".`)}`;

    const rows = (s.rows || []).map((r) => {
      /* Two shapes in the source: Capability|Evidence, and
         Component|Module|Status. Read by column name, so neither is assumed. */
      const title = cell(r, 'Capability', 'Component', 'Item');
      const status = cell(r, 'Status');
      const detail = cell(r, 'Evidence', 'Module');
      return `<div class="row"><div class="body">
        <div class="title">${md(title)}${status ? ' ' + md(status) : ''}</div>
        ${detail ? `<div class="meta">${md(detail)}</div>` : ''}
      </div></div>`;
    }).join('');

    const prose = (s.prose || []).map((p) => `<p class="note">${md(p)}</p>`).join('');
    return `
      <h3 class="section">${esc(s.title)}</h3>
      <p class="note">${esc(s.note || '')}</p>
      ${rows ? `<div class="rows">${rows}</div>` : ''}
      ${prose}`;
  }).join('');
};

views.missions = async () => {
  if (state.arg) return missionDetail(state.arg);
  const [listing, blockers] = await Promise.all([
    API.get('/api/missions'), API.get('/api/missions/blockers').catch(() => ({ by_kind: {} })),
  ]);
  const kinds = Object.entries(blockers.by_kind || {});
  const all = listing.missions || [];

  /* Grouped by whose move it is, not by recency. The questions an operator
     actually arrives with — what wants me, what is running, what broke — were
     each answerable only by scanning one flat feed and opening rows. */
  const GROUPS = [
    { key: 'needs', title: 'Needs you', note: 'Nothing here moves on its own.',
      has: (m) => ['awaiting_approval', 'blocked', 'plan_proposed'].includes(m.status) },
    { key: 'running', title: 'Running now',
      note: 'Held by a worker. Closing this page does not stop one.',
      has: (m) => !!m.claimed_by && !['complete', 'failed', 'cancelled'].includes(m.status) },
    { key: 'ended', title: 'Ended badly', note: 'Why each one stopped, from its timeline.',
      has: (m) => ['failed', 'cancelled'].includes(m.status) },
    { key: 'waiting', title: 'Queued', note: 'Waiting for a worker that can serve them.',
      has: (m) => ['draft', 'planning', 'queued'].includes(m.status) && !m.claimed_by },
    { key: 'done', title: 'Completed', note: '', has: (m) => m.status === 'complete' },
  ];
  const placed = new Set();
  const groups = GROUPS.map((g) => {
    const rows = all.filter((m) => !placed.has(m.mission_id) && g.has(m));
    rows.forEach((m) => placed.add(m.mission_id));
    return { ...g, rows };
  });
  /* Anything the groups above do not describe. A mission that silently
     vanished from this page because a new status was added would be worse than
     an ugly extra section. */
  const rest = all.filter((m) => !placed.has(m.mission_id));

  const row = (m) => `
      <div class="row">
        <div class="body">
          <div class="title"><a href="#/missions/${encodeURIComponent(m.mission_id)}">${esc(m.title)}</a></div>
          <div class="meta"><code>${esc(m.mission_id)}</code> · ${when(m.updated_at)}
            ${m.claimed_by ? '· held by <code>' + esc(m.claimed_by) + '</code>' : ''}</div>
          ${m.because ? `<div class="meta">${esc(m.because)}</div>` : ''}
          ${(m.blockers || []).length ? `<div class="meta">${m.blockers.map((b) =>
            pill(b.kind) + ' ' + esc(b.detail || '')
            + (b.action ? ' → <strong>' + esc(b.action) + '</strong>' : '')).join('<br>')}</div>` : ''}
          ${track(m.status)}
        </div>
        <div class="actions">${pill(m.status)}</div>
      </div>`;

  return `
    <header class="page"><h2>Mission Control</h2>
      <p>${all.length ? esc(String(all.length)) + ' missions, grouped by whose move it is.'
        : 'Missions run in a worker process. Closing this page does not stop one.'}</p></header>
    ${kinds.length ? `<div class="card" style="margin-bottom:1rem"><h3>Blocked by</h3>
      ${kinds.map(([kind, rows]) => `<div class="meta">${pill(kind)} ${rows.length} — ${
        esc(rows.map((r) => r.detail).join('; ').slice(0, 160))}</div>`).join('')}</div>` : ''}
    ${all.length ? groups.filter((g) => g.rows.length).map((g) => `
      <h3 style="margin:1.4rem 0 .4rem">${esc(g.title)}
        <span class="note">${esc(String(g.rows.length))}</span></h3>
      ${g.note ? `<p class="note" style="margin-bottom:.6rem">${esc(g.note)}</p>` : ''}
      <div class="rows">${g.rows.map(row).join('')}</div>`).join('')
      + (rest.length ? `<h3 style="margin:1.4rem 0 .4rem">Other
          <span class="note">${esc(String(rest.length))}</span></h3>
        <p class="note" style="margin-bottom:.6rem">Statuses this page has no
          group for. Shown rather than hidden.</p>
        <div class="rows">${rest.map(row).join('')}</div>` : '')
      : empty('No missions yet. Start one from Chat.')}`;
};

async function missionDetail(id) {
  const [mission, history] = await Promise.all([
    API.get('/api/missions/' + encodeURIComponent(id)),
    API.get('/api/missions/' + encodeURIComponent(id) + '/history').catch(() => ({ history: [] })),
  ]);
  let report = null;
  try { report = await API.get('/api/missions/' + encodeURIComponent(id) + '/report'); } catch { /* often absent */ }
  /* Only asked for when the mission actually delivered something. Most have no
     artefact, and a failed request on every mission page would make the common
     case look broken. */
  let delivery = null;
  let outreach = null;
  if (mission.signal_id) {
    try {
      delivery = await API.get('/api/missions/' + encodeURIComponent(id) + '/artefact');
    } catch { delivery = null; }
    /* Only once something is actually published. Before that the message has
       nothing to be about, and asking would render a card explaining an absence
       on every mission that has not got there yet. */
    if (delivery && (delivery.published || []).length) {
      try {
        outreach = await API.get('/api/missions/' + encodeURIComponent(id) + '/outreach');
      } catch { outreach = null; }
    }
  }

  const approve = mission.status === 'awaiting_approval'
    ? '<button class="primary" data-approve>Approve — queue this mission</button>' : '';
  const cancel = ['draft', 'planning', 'awaiting_approval', 'queued', 'blocked'].includes(mission.status)
    ? '<button class="danger" data-cancel>Cancel</button>' : '';
  /* Holding is not cancelling: the mission stays queued because it is still
     work somebody wants done, and only the moment it may start changes.
     `claim()` enforces that window, so this is a decision and not a note. */
  const defer = ['draft', 'planning', 'awaiting_approval', 'queued', 'blocked'].includes(mission.status)
    ? `<details class="hold"><summary>Hold until…</summary>
         <div class="actions">
           <label>Start no earlier than
             <input id="defer-until" type="datetime-local"></label>
           <label>Why <input id="defer-why" maxlength="500"
             placeholder="waiting on the client's copy"></label>
           <button data-defer>Hold until…</button>
         </div>
         <p class="note" data-defer-said></p>
         <p class="note">It stays queued. Nothing is cancelled, and the reason
           is recorded on the timeline.</p></details>` : '';

  const html = `
    <header class="page"><h2>${esc(mission.title)}</h2>
      <p><code>${esc(mission.mission_id)}</code> · requested by ${esc(mission.requested_by || '—')}
      · ${when(mission.created_at)}${mission.occurrence
        ? ' · recurring <code>' + esc(mission.occurrence) + '</code>' : ''}
      · ${pill(originOf(mission.origin_name).word,
               originOf(mission.origin_name).tone)}</p></header>
    <div class="card" style="margin-bottom:1rem">
      ${pill(mission.status)} ${track(mission.status)}
      <div class="actions" style="margin-top:.9rem">${approve}${cancel}</div>
      ${mission.not_before ? `<p class="note">Held until ${when(mission.not_before)}
        &mdash; it will not start before then.</p>` : ''}
      ${defer}
    </div>
    ${delivery ? deliveryCard(delivery) : ''}
    ${outreach ? outreachCard(outreach) : ''}
    ${whyItEnded(mission) ? `<div class="card why" style="margin-bottom:1rem">
      <h3>Why it stopped</h3><p>${esc(whyItEnded(mission))}</p></div>` : ''}
    ${(mission.blockers || []).length ? `<div class="card" style="margin-bottom:1rem">
      <h3>Blocked</h3>${mission.blockers.map((b) =>
        `<div class="meta">${pill(b.kind)} ${esc(b.detail)}${b.action ? ' → <strong>' + esc(b.action) + '</strong>' : ''}</div>`
      ).join('')}</div>` : ''}
    ${mission.plan ? `<div class="card" style="margin-bottom:1rem"><h3>Plan</h3>
      <div class="meta">${esc(mission.plan.goal || '')}</div>
      <ol>${(mission.plan.steps || []).map((s) =>
        `<li>${esc(s.title)}${s.files && s.files.length ? ' <code>' + esc(s.files.join(', ')) + '</code>' : ''}</li>`
      ).join('')}</ol></div>` : ''}
    <div class="grid" style="margin-bottom:1rem">
      <div class="card"><h3>Commits</h3>${(mission.commits || []).length
        ? mission.commits.map((c) => `<div><code>${esc(c.slice(0, 12))}</code></div>`).join('')
        : '<p class="note">none</p>'}</div>
      <div class="card"><h3>Model calls</h3>
        ${(mission.invocations || []).length ? mission.invocations.map((i) =>
          `<div class="meta"><code>${esc(i.provider)}/${esc(i.model)}</code> ${esc(i.task || '')} —
           ${i.cost == null ? 'cost ' + pill('UNKNOWN') : esc(i.cost) + ' ' + esc(i.currency || '')}
           <span class="pill">${esc(i.cost_status)}</span></div>`).join('')
          : '<p class="note">none</p>'}</div>
      <div class="card"><h3>Total cost</h3>
        <div class="stat" style="font-size:18px">${mission.total_cost == null
          ? pill('UNKNOWN') : esc(mission.total_cost)}</div>
        <p class="note">A missing cost is not zero.</p></div>
    </div>
    <div class="card" style="margin-bottom:1rem"><h3>History</h3><div class="wrap-scroll">
      <table><thead><tr><th>When</th><th>Status</th><th>Held by</th><th>Note</th></tr></thead><tbody>
      ${(history.history || []).map((h) => `<tr><td>${when(h.updated_at)}</td><td>${pill(h.status)}</td>
        <td><code>${esc(h.claimed_by || '—')}</code></td><td>${esc(h.note || '')}</td></tr>`).join('')}
      </tbody></table></div></div>
    ${report ? `<div class="card"><h3>Report</h3><pre>${esc(report.report)}</pre></div>`
      : '<div class="card"><h3>Report</h3><p class="note">No report yet. One is written when the mission finishes.</p></div>'}`;

  queueMicrotask(() => {
    const a = document.querySelector('[data-approve]');
    if (a) a.addEventListener('click', async () => {
      a.disabled = true; a.textContent = 'Queueing…';
      try { await API.post('/api/missions/' + encodeURIComponent(id) + '/approve'); render(); }
      catch (e) { a.disabled = false; a.textContent = 'Approve'; alert(e.message); }
    });
    const d = document.querySelector('[data-defer]');
    if (d) d.addEventListener('click', async () => {
      const until = document.getElementById('defer-until');
      const why = document.getElementById('defer-why');
      const said = document.querySelector('[data-defer-said]');
      const tell = (t) => { if (said) said.textContent = t; };
      /* Both required by the server. Saying so here beats a 422 the operator
         has to decode: a deferral without a reason cannot be told from a queue
         that is simply long, which is what SCHEDULED exists to distinguish. */
      if (!until.value) return tell('Pick the moment it may start.');
      if (why.value.trim().length < 3) {
        return tell('Say why it is being held.');
      }
      d.disabled = true; d.textContent = 'Holding…'; tell('');
      try {
        await API.post('/api/missions/' + encodeURIComponent(id) + '/defer',
                       { until: new Date(until.value).toISOString(),
                         reason: why.value.trim() });
        render();
      } catch (e) {
        d.disabled = false; d.textContent = 'Hold until…';
        tell(e.message.includes('409')
          ? 'This mission has finished; there is nothing left to hold.'
          : e.message);
      }
    });
    const c = document.querySelector('[data-cancel]');
    if (c) c.addEventListener('click', async () => {
      c.disabled = true;
      try { await API.post('/api/missions/' + encodeURIComponent(id) + '/cancel'); render(); }
      catch (e) { c.disabled = false; alert(e.message); }
    });
    if (delivery) wireReview(id, delivery);
    wireOutreach(id);
  });
  return html;
}

/* Approving and sending, kept apart.
 *
 * The fingerprint travels back with the decision. The server re-composes the
 * message and refuses a mismatch, so an operator who approved one set of words
 * cannot have a different set go out because the site moved underneath them.
 * That is why the button carries `data-fp` rather than the server trusting the
 * mission id alone. */
function wireOutreach(id) {
  const said = document.querySelector('[data-outreach-said]');
  const tell = (text) => { if (said) said.textContent = text; };

  const a = document.querySelector('[data-approve-outreach]');
  if (a) a.addEventListener('click', async () => {
    /* Visible before the await, or a slow round trip looks like a dead button. */
    a.disabled = true; a.textContent = 'Recording…'; tell('');
    try {
      await API.post('/api/missions/' + encodeURIComponent(id) + '/outreach/approve',
                     { fingerprint: a.dataset.fp });
      render();
    } catch (e) {
      a.disabled = false; a.textContent = 'Approve this message';
      /* 409 means the message changed since it was read. Saying so beats
         "request failed" — the operator needs to re-read, not retry. */
      tell(e.message.includes('409')
        ? 'The message changed since you read it. Reload and read it again '
          + 'before approving.' : e.message);
    }
  });

}

/* What a reviewer needs in front of them, without a terminal.
 *
 * The order is the chain: what was approved, by whom, on what evidence; what
 * was permitted to carry it out; what came back. A reviewer who cannot see the
 * authorisation beside the artefact is being asked to judge the artefact alone,
 * which is how work nobody approved gets accepted because it looked fine. */
const PUBLICATION_MEANS = {
  NOT_REVIEWED: 'Nobody has accepted this yet.',
  ACCEPTED: 'Reviewed and accepted. Not authorised to publish.',
  AUTHORISED: 'Authorised to publish. Not yet out.',
  PUBLISHED: 'Live. Strangers can reach it.',
};

function deliveryCard(d) {
  const files = d.files || [];
  const reviews = d.reviews || [];
  /* The most recent publication, from the API's own record. Once something is
     live the publish control goes away: publishing it again is a new decision
     and should start from the queue, not from a button that is still sitting
     there from the last time. */
  const live = (d.published || [])[(d.published || []).length - 1] || null;
  const last = reviews.length ? reviews[reviews.length - 1] : null;
  const answers = (d.provenance || {}).addresses || [];
  /* A health check asserts things about a real business, in writing, over
     Qevik's name. The reviewer approving it should see every claim and the
     evidence behind it without opening the HTML — which is why the executor
     puts them in the provenance rather than only in the page. */
  const claims = (d.provenance || {}).claims || [];
  const withheld = (d.provenance || {}).not_published_for_want_of_a_source || [];
  const claimRows = claims.length ? `<div class="card" style="margin-bottom:1rem">
    <h3>What this says about them</h3>
    <p class="note">${esc(String(claims.length))} claims, each with how it was
      established. A claim with no evidence would have been refused before this
      page existed.</p>
    <dl class="facts">${claims.map((c) => `<dt>${pill(
      { CONFIRMED_ABSENT: 'not found', CONFIRMED_PRESENT: 'found',
        NOT_VERIFIED: 'could not check' }[c.verdict] || c.verdict,
      { CONFIRMED_ABSENT: 'bad', CONFIRMED_PRESENT: 'ok',
        NOT_VERIFIED: 'warn' }[c.verdict] || '')}
      ${esc((c.feature || '').replace(/_/g, ' '))}</dt>
      <dd><span class="note">${esc(c.evidence || 'this check did not complete, so nothing is claimed')}</span></dd>`
    ).join('')}</dl></div>` : '';

  return claimRows + `<div class="card" style="margin-bottom:1rem">
    <h3>Delivered artefact</h3>
    ${last ? `<p>${pill(last.decision, last.decision === 'accepted' ? 'ok' : 'bad')}
      <span class="note">by ${esc(last.actor)} · ${when(last.at)}${last.note
        ? ' · ' + esc(last.note) : ''}</span></p>` : `<p>${pill('not reviewed', 'warn')}
      <span class="note">Nobody has decided about this yet.</span></p>`}
    <p class="stage">${pill(d.publication_state || 'NOT_REVIEWED',
      { PUBLISHED: 'ok', AUTHORISED: 'warn', ACCEPTED: 'run' }[d.publication_state] || '')}
      <span class="note">${esc(PUBLICATION_MEANS[d.publication_state]
        || 'Derived from the timeline, not from a directory on disk.')}</span></p>
    <dl class="facts">
      <dt>Authorised</dt><dd>${(d.authorised || []).length
        ? (d.authorised || []).map((a) => esc(a.actor || 'unknown') + ' · '
            + (a.at ? when(a.at) : '')
            + (a.commit ? ' · <code>' + esc(a.commit.slice(0, 12)) + '</code>'
              : '')).join('<br>')
        : `<span class="note">Not authorised. Accepting the work and letting it
           out are two decisions.</span>`}</dd>
      <dt>Approved</dt><dd>${d.signal_id
        ? `<a href="#/opportunities">${esc(d.approved_scope || d.signal_id)}</a>
           <span class="note">from <code>${esc(d.signal_id)}</code>
           by ${esc(d.approved_by || 'unknown')}</span>` : pill('UNKNOWN')}</dd>
      <dt>Evidence</dt><dd>${(d.evidence_fingerprints || []).length
        ? (d.evidence_fingerprints || []).map((f) =>
            '<code>' + esc(f.slice(0, 10)) + '</code>').join(' ')
        : '<span class="note">none recorded</span>'}</dd>
      <dt>Carried out by</dt><dd><code>${esc(d.recipe || '—')}</code> ·
        <code>${esc(d.agent_id || '—')}</code> ·
        tools ${(d.tools || []).map((t) => '<code>' + esc(t) + '</code>').join(' ') || 'none'}
        <span class="note">${(d.tools || []).some((t) =>
          ['http-fetch', 'dns', 'shell'].includes(t))
          ? 'This role has a network tool.'
          : 'No network tool: this could not publish or contact anyone.'}</span></dd>
      <dt>Origin</dt><dd>${pill(originOf(d.origin_name).word, originOf(d.origin_name).tone)}
        <span class="note"><code>${esc(d.workspace || '—')}</code> ·
        branch <code>${esc(d.branch || '—')}</code>${d.commit
          ? ' · <code>' + esc(d.commit.slice(0, 12)) + '</code>' : ''}</span></dd>
      ${answers.length ? `<dt>Answers</dt><dd>${answers.map((a) =>
        esc(a)).join('; ')}</dd>` : ''}
      ${withheld.length ? `<dt>Left out</dt><dd>${withheld.map((w) =>
        esc(w)).join(', ')} <span class="note">— no source recorded, so nothing
        was invented.</span></dd>` : ''}
    </dl>
    ${d.unreadable ? `<p class="note">${esc(d.unreadable)}</p>` : ''}
    ${files.length ? `<div class="wrap-scroll"><table>
      <thead><tr><th>File</th><th>Size</th><th></th></tr></thead><tbody>
      ${files.map((f) => `<tr><td><code>${esc(f.name)}</code></td>
        <td>${esc(String(f.size))} B</td>
        <td><button data-file="${esc(f.path)}">Read</button></td></tr>`).join('')}
      </tbody></table></div>
      <pre data-artefact hidden></pre>` : '<p class="note">No files in this commit.</p>'}
    ${live ? `<p>${pill('published', 'ok')}
      <span class="note">live at <code>${esc(live.url || live.site_id || '')}</code>
      from <code>${esc((live.commit || '').slice(0, 12))}</code> ·
      ${when(live.at)}</span></p>` : ''}
    ${!live && last && last.decision === 'accepted' ? `<div class="actions"
      style="margin-top:.9rem">
      <label class="note" for="publish-note">Publishing puts this in front of
        anyone with the address. It is a separate decision from accepting it,
        and it cannot be taken back once somebody has read the page.</label>
      <textarea id="publish-note" rows="2" style="width:100%"></textarea>
      <button class="danger" data-publish="${esc(d.commit || '')}">Publish
        ${esc((d.commit || '').slice(0, 12))} &mdash; outward</button>
      </div>` : ''}
    ${files.length ? `<div class="actions" style="margin-top:.9rem">
      <label class="note" for="review-note">What you decided, and why</label>
      <textarea id="review-note" rows="2" style="width:100%"></textarea>
      <button class="primary" data-review="accepted">Accept this artefact</button>
      <button class="danger" data-review="rejected">Reject</button>
      <p class="note">Recording a decision. Accepting does not publish it and
        does not contact anyone — both are separate acts.</p></div>` : ''}
    ${reviews.length > 1 ? `<div class="wrap-scroll" style="margin-top:.9rem">
      <table><thead><tr><th>When</th><th>Decision</th><th>By</th><th>Note</th></tr></thead>
      <tbody>${reviews.map((r) => `<tr><td>${when(r.at)}</td>
        <td>${pill(r.decision, r.decision === 'accepted' ? 'ok' : 'bad')}</td>
        <td>${esc(r.actor)}</td><td>${esc(r.note || '')}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
  </div>`;
}

/* What Qevik would say, and what stops it saying it.
 *
 * The blockers are the point of the card, not a footnote on it. A surface that
 * showed a finished message and mentioned underneath that it cannot be sent
 * reads as ready-to-go, and the one thing this must not do is make an
 * unsendable message look like a queued one. */
function outreachCard(o) {
  const p = o.prepared;
  if (!p) {
    return `<div class="card" style="margin-bottom:1rem"><h3>Outreach</h3>
      <p class="note">${esc(o.detail || 'Nothing to say yet.')}</p></div>`;
  }
  const blocked = p.blocked_on || [];
  const words = {
    NO_VERIFIED_RECIPIENT: 'No verified way to reach this business. Qevik does '
      + 'not derive an address from a domain, and a landline is not a WhatsApp '
      + 'number.',
    NO_SENDING_IDENTITY: 'No sending identity is configured. Nothing here can '
      + 'send, and approving would record permission rather than create it.',
  };
  const approved = (o.approvals || []).length;
  return `<div class="card" style="margin-bottom:1rem">
    <h3>Outreach</h3>
    <p>${approved ? pill('approved to send', 'warn') : pill('prepared', '')}
      ${blocked.length ? pill('blocked', 'bad') : ''}
      <span class="note">Preparing a message sends nothing.</span></p>
    ${blocked.length ? `<div class="why">${blocked.map((b) =>
      `<p>${pill(b.replace(/_/g, ' ').toLowerCase(), 'bad')}
       ${esc(words[b] || '')}</p>`).join('')}</div>` : ''}
    <dl class="facts">
      <dt>Business</dt><dd>${esc(p.business_name || p.business_id)}</dd>
      <dt>Published site</dt><dd><a href="${esc(p.url)}" rel="noopener"
        target="_blank">${esc(p.url)}</a>
        <span class="note">from <code>${esc((p.commit || '').slice(0, 12))}</code></span></dd>
      <dt>Why we are writing</dt><dd>${esc(p.approved_scope || '—')}
        <span class="note">opportunity <code>${esc(p.signal_id)}</code></span></dd>
      <dt>Evidence</dt><dd>${(p.evidence_fingerprints || []).map((f) =>
        '<code>' + esc(f.slice(0, 10)) + '</code>').join(' ') || '—'}</dd>
      <dt>Recipient</dt><dd>${p.recipient
        ? esc(p.recipient) + ' <span class="note">' + esc(p.channel) + '</span>'
        : pill('none verified', 'bad')}</dd>
      <dt>Sending identity</dt><dd>${blocked.includes('NO_SENDING_IDENTITY')
        ? pill('none configured', 'bad') : pill('configured', 'ok')}</dd>
    </dl>
    <p class="note">Every claim below, and the record it came from:</p>
    <dl class="facts">${Object.entries(p.traces || {}).map(([claim, from]) =>
      `<dt>${esc(claim)}</dt><dd><code>${esc(from)}</code></dd>`).join('')}</dl>
    <p class="note">Proposed message &mdash; <strong>${esc(p.subject)}</strong></p>
    <pre>${esc(p.body)}</pre>
    <div class="actions">${approved
      ? `<span class="note">Approved. Nothing goes out from this page &mdash;
           delivery is dispatched to a worker, and no worker can send yet.</span>`
      : `<button data-approve-outreach data-fp="${esc(p.fingerprint)}"
           >Approve this message</button>
         <span class="note">Records permission to send these exact words to
           this exact address. Sends nothing.</span>`}</div>
    <p class="note" data-outreach-said></p>
  </div>`;
}

function wireReview(id, delivery) {
  document.querySelectorAll('[data-file]').forEach((button) => {
    button.addEventListener('click', async () => {
      const pane = document.querySelector('[data-artefact]');
      /* Visible before the await. A file that takes a moment to arrive
         otherwise looks like a button that did nothing. */
      pane.hidden = false;
      pane.textContent = 'Reading ' + button.dataset.file + '…';
      try {
        const got = await API.get('/api/missions/' + encodeURIComponent(id)
          + '/artefact/file?path=' + encodeURIComponent(button.dataset.file));
        /* textContent, never innerHTML. This is a customer's generated markup
           and the operator's session is in this page. */
        pane.textContent = got.text;
      } catch (e) { pane.textContent = e.message; }
    });
  });
  document.querySelectorAll('[data-publish]').forEach((button) => {
    button.addEventListener('click', async () => {
      const commit = button.dataset.publish;
      if (!window.confirm('Publish ' + commit.slice(0, 12)
        + ' to the public site host?\n\nAnyone with the address will be able '
        + 'to read it. This cannot be taken back.')) return;
      button.disabled = true;
      button.textContent = 'Authorising…';
      try {
        await API.post('/api/missions/' + encodeURIComponent(id) + '/publish',
          { commit, note: (document.querySelector('#publish-note') || {}).value || '' });
        render();
      } catch (e) {
        button.disabled = false;
        button.textContent = 'Publish — outward';
        alert(e.message);
      }
    });
  });
  document.querySelectorAll('[data-review]').forEach((button) => {
    button.addEventListener('click', async () => {
      const decision = button.dataset.review;
      const note = (document.querySelector('#review-note') || {}).value || '';
      button.disabled = true;
      button.textContent = decision === 'accepted' ? 'Recording…' : 'Recording…';
      try {
        await API.post('/api/missions/' + encodeURIComponent(id) + '/review',
          { decision, note, commit: delivery.commit || '' });
        render();
      } catch (e) {
        button.disabled = false;
        button.textContent = decision === 'accepted' ? 'Accept this artefact' : 'Reject';
        alert(e.message);
      }
    });
  });
}

/* The five queues. WAITING and BLOCKED are drawn apart on purpose: one
   resolves by itself and the other never will, and an operator who cannot tell
   them apart chases the wrong half. */
const QUEUES = [
  ['NOW', 'Running now', 'run', 'Dispatched, or about to be.'],
  ['NEXT', 'Next', '', 'Ready. Waiting only for a free worker.'],
  ['SCHEDULED', 'Scheduled', 'wait', 'Held until a window somebody chose.'],
  ['WAITING', 'Waiting', 'warn', 'On a person, or on other work. Resolves by itself.'],
  ['BLOCKED', 'Blocked', 'bad', 'Cannot proceed. Nothing here resolves on its own.'],
];

views.schedule = async () => {
  const plan = await API.get('/api/missions/schedule?concurrency=2');
  const queues = plan.queues || {};
  const section = ([id, label, tone, blurb]) => {
    const rows = queues[id] || [];
    return `<div class="card" style="margin-bottom:1rem">
      <h3>${esc(label)} ${pill(String(rows.length), tone)}</h3>
      <div class="note" style="margin:-.3rem 0 .7rem">${esc(blurb)}</div>
      ${rows.length ? `<div class="rows">${rows.map((r) => `
        <div class="row"><div class="body">
          <div class="title"><a href="#/missions/${encodeURIComponent(r.mission_id)}">${esc(r.mission_id)}</a></div>
          <div class="meta">${esc(r.why)}</div>
          ${r.runs_after ? `<div class="meta">runs after ${when(r.runs_after)}</div>` : ''}
        </div><div class="actions">${pill(r.priority)}</div></div>`).join('')}</div>`
        : empty('Nothing.')}
    </div>`;
  };
  return `
    <header class="page"><h2>Schedule</h2>
      <p>What runs next, and why everything else does not. This page decides
      nothing — a worker still has to win the claim.</p></header>
    ${QUEUES.map(section).join('')}
    <div class="note">${esc(plan.note || '')}</div>`;
};

/* Everything the thumb bar does not carry.
 *
 * Required, not decorative: the bar shows four of fifteen destinations, and a
 * destination with no route to it has effectively been deleted. On a desktop
 * the rail already lists them all, so this page says so rather than duplicating
 * the rail badly.
 */
views.more = async () => {
  const [me, health] = await Promise.all([
    /* `/auth/me`, not `/api/me`. There is no `/api/me`: the auth router is
       mounted at `/auth` and the customer one at `/api/customer`. This
       404'd on every load and the `.catch(() => null)` turned it into an
       empty panel — the page rendered, so nothing looked wrong. */
    API.get('/auth/me').catch(() => null),
    API.get('/api/health').catch(() => null),
  ]);
  const hidden = PAGES.filter(([id]) => !THUMB[id] && id !== 'more');
  const claiming = ((health || {}).components || {}).claiming || {};
  const sandbox = ((health || {}).components || {}).sandbox || {};
  const html = `
    <header class="page"><h2>More</h2>
      <p>Everything the bottom bar does not carry.</p></header>
    <div class="rows">${hidden.map(([id, label]) => `
      <div class="row"><div class="body">
        <div class="title"><a href="#/${id}">${esc(label)}</a></div>
      </div></div>`).join('')}</div>
    <div class="card" style="margin-top:1rem">
      <h3>This deployment</h3>
      <div class="meta">Signed in as <code>${esc(me ? me.username : '—')}</code>${
        me && me.tenant_id ? ' · tenant <code>' + esc(me.tenant_id) + '</code>' : ''}</div>
      <div class="meta">Claiming: ${pill(claiming.status || 'unknown',
        claiming.status === 'COMPLETE' ? 'ok' : 'warn')} ${esc(claiming.detail || '')}</div>
      <div class="meta">Sandbox: ${pill(sandbox.confinement || 'unknown',
        sandbox.confinement === 'FULL' ? 'ok' : 'warn')}</div>
      <div class="actions" style="margin-top:.9rem">
        <button type="button" id="more-signout" class="danger">Sign out</button>
      </div>
    </div>`;

  queueMicrotask(() => {
    const out = $('more-signout');
    /* Sign out lives here on a phone because the rail that holds it is hidden.
     * Without this the only way out of a session on a phone is clearing the
     * browser's storage. */
    if (out) out.addEventListener('click', async () => {
      try { await API.post('/auth/logout'); } catch { /* the token is going anyway */ }
      API.token = ''; state.me = null; render();
    });
  });
  return html;
};

views.chat = async () => {
  if (state.arg) return conversation(state.arg);
  const listing = await API.get('/api/chat');
  const html = `
    <header class="page"><h2>Chat</h2>
      <p>Say what you want. Qevik proposes a plan; nothing runs until you approve it.</p></header>
    <div class="card" style="margin-bottom:1rem">
      <form id="start">
        <div class="field"><label for="say">What would you like Qevik to do?</label>
          <textarea id="say" rows="3" required placeholder="Improve the Qevik website."></textarea></div>
        <button class="primary" type="submit">Start</button>
      </form>
    </div>
    <div class="rows">${(listing.conversations || []).map((c) => `
      <div class="row"><div class="body">
        <div class="title"><a href="#/chat/${encodeURIComponent(c.conversation_id)}">${esc(c.title)}</a></div>
        <div class="meta">${when(c.at)}${c.mission_id ? ' · mission <code>' + esc(c.mission_id) + '</code>' : ''}</div>
      </div><div class="actions">${pill(c.status)}</div></div>`).join('')
      || empty('No conversations yet.')}</div>`;

  queueMicrotask(() => {
    const form = $('start');
    if (form) form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true; button.textContent = 'Starting…';
      try {
        const made = await API.post('/api/chat', { text: $('say').value });
        location.hash = '#/chat/' + encodeURIComponent(made.conversation_id);
      } catch (err) { alert(err.message); button.disabled = false; button.textContent = 'Start'; }
    });
  });
  return html;
};

/* The five states a request can be in, and the word for each.
 *
 * Named once. The console showed a raw status string, so "blocked" and
 * "declined" and "failed" all read as the same shade of bad, and "waiting for
 * approval" — the one state a person can actually do something about — looked
 * like the others. */
const STAGE = {
  blocked:  { word: 'Blocked',            tone: 'bad',  says: 'This cannot proceed. Nothing here resolves it on its own.' },
  waiting:  { word: 'Waiting for you',    tone: 'warn', says: 'Nothing runs until you approve it.' },
  running:  { word: 'Running',            tone: 'run',  says: 'A worker has it. You can close this page.' },
  failed:   { word: 'Failed',             tone: 'bad',  says: 'It ran and did not succeed. The report says what happened.' },
  complete: { word: 'Complete',           tone: 'ok',   says: 'Done. The report is below.' },
  drafting: { word: 'Drafting',           tone: '',     says: 'No plan has been proposed yet.' },
  declined: { word: 'Declined',           tone: '',     says: 'You declined this plan. It is kept on the record.' },
  closed:   { word: 'Closed',             tone: '',     says: 'This conversation was closed without a mission.' },
  /* A mission exists and its status could not be read. Deliberately not
   * 'drafting': that sentence says nothing is happening, which is a claim this
   * screen has no basis for. A failed read is NOT_VERIFIED, never an absence. */
  unread:   { word: 'Status unread',      tone: 'warn', says: 'A mission exists for this request, but its status could not be read just now. It may well be running.' },
};

/* Why a mission ended badly, in one line, without making the person read a
 * report to find out. The reason is already recorded: the worker attaches a
 * note to the transition into `failed` ("acceptance did not pass after 3
 * attempt(s): …"), and `fold` merges that note into the summary the API
 * returns. Nothing new is computed here.
 *
 * Returns '' when there is nothing to say. A missing note is reported as a
 * missing note — inventing a plausible reason for a failure is worse than
 * admitting none was recorded. */
/* Why a mission is in the state it is in.
 *
 * `note` is the *latest* event's note, and a worker writes several after the
 * transition that ended a mission — the scratch, the cost, the report — all
 * carrying the terminal status. Reading `note` as the reason told an operator
 * that all six failed missions in production ended because a "report written".
 * `because` is the note of the transition that entered the state, folded by the
 * kernel, so every surface gets the same answer. */
function whyItEnded(mission) {
  if (!mission) return '';
  if (mission.status !== 'failed' && mission.status !== 'cancelled') return '';
  const why = (mission.because || '').trim();
  if (!why) return 'No reason was recorded for this. The report below is the only account of what happened.';
  return why;
}

function stageOf(conversation, mission) {
  /* Derived from the mission where one exists, because the mission is what is
   * actually happening; the conversation only records how it started. */
  if (mission) {
    if (mission.status === 'complete') return 'complete';
    if (mission.status === 'failed' || mission.status === 'cancelled') return 'failed';
    if (mission.status === 'blocked') return 'blocked';
    if (mission.status === 'awaiting_approval') return 'waiting';
    return 'running';
  }
  if (conversation.status === 'plan_proposed') {
    return (conversation.plan && (conversation.plan.blockers || []).length
            && !(conversation.plan.steps || []).length) ? 'blocked' : 'waiting';
  }
  if (conversation.status === 'plan_rejected') return 'declined';
  /* Reached with no mission object. If the conversation says one was created,
   * the fetch failed — say so rather than reporting the mission missing. */
  if (conversation.status === 'mission_created') return 'unread';
  if (conversation.status === 'closed') return 'closed';
  return 'drafting';
}

/* A cost, or the honest absence of one. Never a bare number, and never 0 for
 * "nobody measured" — the whole cost_status rule in one function so no caller
 * can render it a different way. */
function cost(value, status) {
  if (value === null || value === undefined || status === 'UNKNOWN') {
    return '<span class="unknown">UNKNOWN</span>' +
      '<span class="note"> — nothing priced this. It is not zero.</span>';
  }
  return `<strong>${esc(String(value))}</strong> <span class="note">(${esc(status || 'ESTIMATED')})</span>`;
}

/* Which repository this work touches, said in words rather than as a key.
 *
 * The one fact somebody approving needs and could not see: "add this feature"
 * against Qevik's own source and the same sentence against a customer's
 * repository are very different decisions, and the screen showed neither. The
 * name alone ("qevik", "acme-web") is a key from a config file and means
 * nothing to a person, so it is spelled out. */
function originOf(name) {
  const key = (name || '').trim();
  if (!key || key === 'qevik') {
    return { word: "Qevik's own source", tone: 'warn',
             says: 'This changes Qevik itself. It cannot run without you.' };
  }
  if (key === 'none') {
    return { word: 'No repository', tone: '',
             says: 'Nothing is at risk; this works in a throwaway checkout.' };
  }
  return { word: key, tone: '',
           says: 'A customer repository. Qevik\'s own source is untouched.' };
}

/* Which repository the approved mission will work on.
 *
 * Radio inputs rather than a <select>: there are three or four of these, each
 * needs a sentence explaining what it means, and a native select on a phone
 * hides all of that behind a wheel showing one line at a time. The whole point
 * is that somebody reads the difference before approving.
 *
 * The value is a **key**. No path is sent, and none is received — `/api/origins`
 * deliberately does not return them.
 */
function originChoice(available) {
  const list = (available && available.origins) || [];
  if (!list.length) {
    /* Not "there are none": the list could not be read. Saying nothing here
     * would leave the approve button meaning something unstated. */
    return `<p class="note">The list of repositories could not be read, so this
      will run against ${esc(originOf('').word)}.</p>`;
  }
  if (list.length === 1) {
    /* A fact, not a choice — and still an input.
     *
