<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qevik Control</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Qevik Control.
 *
 * One file, no build step, no dependency. That is a deployment decision, not a
 * stylistic one: the control plane has to be serveable by copying a directory
 * onto a host that runs Caddy and nothing else, and every build chain is another
 * thing that can be broken on the day the operator needs the console most.
 *
 * The CSP in qevik-production.Caddyfile allows 'self' and inline style/script
 * and nothing else — no CDN, no font host, no analytics. This file is written to
 * that policy rather than asking for it to be relaxed.
 */
:root {
  --bg: #0e1116; --panel: #161b22; --line: #262d38; --raised: #1c2330;
  --text: #e6edf3; --muted: #8b98a8; --dim: #5c6875;
  --accent: #4c8dff; --accent-dim: #1f3a63;
  --ok: #3fb950; --warn: #d29922; --bad: #f85149; --wait: #a371f7;
  --radius: 8px; --gap: 16px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --line: #d8dee4; --raised: #f0f3f6;
    --text: #1f2328; --muted: #59636e; --dim: #818b98;
    --accent: #0969da; --accent-dim: #ddf4ff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font: inherit; cursor: pointer; border-radius: 6px; padding: .5rem .9rem;
  border: 1px solid var(--line); background: var(--raised); color: var(--text);
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
input, textarea, select {
  font: inherit; width: 100%; padding: .55rem .7rem; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
input:focus, textarea:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: .8rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}

/* ---------------------------------------------------------------- layout */
#shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
nav {
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 1rem .75rem; display: flex; flex-direction: column; gap: 2px;
}
nav h1 {
  font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); margin: .25rem .5rem 1rem;
}
nav a {
  padding: .5rem .6rem; border-radius: 6px; color: var(--text);
  display: flex; justify-content: space-between; align-items: center; gap: .5rem;
}
nav a:hover { background: var(--raised); text-decoration: none; }
nav a[aria-current="page"] { background: var(--accent-dim); color: var(--accent); }
nav .count {
  font-size: 11px; background: var(--raised); border: 1px solid var(--line);
  border-radius: 20px; padding: 0 .45rem; color: var(--muted);
}
nav .count.alert { background: var(--bad); border-color: var(--bad); color: #fff; }
nav .spacer { flex: 1; }
nav .who { font-size: 12px; color: var(--dim); padding: .5rem .6rem; }
main { padding: 1.5rem; max-width: 1180px; }
header.page { margin-bottom: 1.25rem; }
header.page h2 { margin: 0 0 .25rem; font-size: 21px; }
header.page p { margin: 0; color: var(--muted); }

@media (max-width: 820px) {
  #shell { grid-template-columns: 1fr; }
  nav {
    flex-direction: row; overflow-x: auto; border-right: 0;
    border-bottom: 1px solid var(--line); padding: .5rem; gap: 4px;
  }
  nav h1, nav .spacer, nav .who { display: none; }
  nav a { white-space: nowrap; }
  main { padding: 1rem; }
}

/* ---------------------------------------------------------------- pieces */
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1rem;
}
.card h3 { margin: 0 0 .6rem; font-size: 13px; color: var(--muted); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; }
.stat { font-size: 27px; font-weight: 600; line-height: 1.1; }
.stat small { font-size: 13px; color: var(--muted); font-weight: 400; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .85rem 1rem; display: flex; gap: 1rem; align-items: flex-start;
  justify-content: space-between; flex-wrap: wrap;
}
.row .body { flex: 1; min-width: 220px; }
.row .title { font-weight: 600; }
.row .meta { color: var(--muted); font-size: 12.5px; margin-top: .2rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }

.pill {
  display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  padding: .15rem .5rem; border-radius: 20px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap;
}
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.run { color: var(--accent); border-color: var(--accent); }
.pill.wait { color: var(--wait); border-color: var(--wait); }

/* The mission lifecycle, drawn as the sequence it actually is. */
.track { display: flex; flex-wrap: wrap; gap: 4px; margin-top: .6rem; }
.track span {
  font-size: 10.5px; padding: .12rem .45rem; border-radius: 4px;
  border: 1px solid var(--line); color: var(--dim);
}
.track span.done { color: var(--ok); border-color: var(--ok); }
.track span.now { background: var(--accent); border-color: var(--accent); color: #fff; }
.track span.bad { color: var(--bad); border-color: var(--bad); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.wrap-scroll { overflow-x: auto; }

.note { color: var(--muted); font-size: 13px; }
.empty { color: var(--dim); padding: 2rem; text-align: center; border: 1px dashed var(--line);
  border-radius: var(--radius); }
.error {
  border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent);
  border-radius: var(--radius); padding: .8rem 1rem; margin-bottom: 1rem;
}
.field { margin-bottom: .9rem; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: .3rem; }

/* Chat */
.msgs { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1rem; }
.msg { padding: .7rem .9rem; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--panel); max-width: 46rem; }
.msg.user { margin-left: auto; background: var(--accent-dim); border-color: var(--accent); }
.msg.system { border-style: dashed; }
.msg .from { font-size: 11px; color: var(--muted); margin-bottom: .3rem; }
.msg pre { margin: 0; background: transparent; border: 0; padding: 0; }

/* The live indicator. Fixed, small, and it never covers content: a banner
   that obscures what it is reporting on is worse than no banner. */
#live {
  position: fixed; right: 1rem; bottom: 1rem; z-index: 20;
  background: var(--panel); border: 1px solid var(--accent);
  border-radius: 20px; padding: .4rem .9rem; font-size: 12.5px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25); cursor: pointer;
}
#live.stale { border-color: var(--warn); color: var(--warn); }
@media (max-width: 820px) { #live { left: 1rem; right: 1rem; text-align: center; } }

#login { max-width: 22rem; margin: 12vh auto; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h3>Qevik Control</h3>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="note" style="margin-top:1rem">
      Credentials are never stored in this page. The session token is held in
      memory and in <code>sessionStorage</code>, and is gone when the tab closes.
    </p>
  </div>
</div>

<div id="shell" class="hidden">
  <nav id="nav"></nav>
  <main id="main"></main>
  <div id="live" class="hidden" role="status" aria-live="polite"></div>
</div>

<script>
/* Qevik Control — the browser half of the control plane.
 *
 * Two rules the whole file is written to.
 *
 * **No business logic lives here.** Every number, status and decision comes from
 * the kernel over HTTP. This file arranges what the API returns and sends back
 * what a person clicked. The moment it starts deciding, for example, whether a
 * mission is really complete, there are two answers to that question and the one
 * on screen is the one nobody tested.
 *
 * **Nothing executes from the browser.** Approving a plan POSTs an approval and
 * returns; a worker in another process picks the mission up. Closing this tab
 * cannot stop it, which is the property `test_chat_to_commit.py` proves and this
 * page must not quietly undo by, say, driving a mission from a polling loop.
 */
'use strict';

const API = {
  /* Session token in sessionStorage, never localStorage: localStorage outlives
   * the tab and survives on a shared machine long after the person walked away. */
  get token() { return sessionStorage.getItem('qevik.token') || ''; },
  set token(v) { v ? sessionStorage.setItem('qevik.token', v) : sessionStorage.removeItem('qevik.token'); },

  async call(path, options = {}) {
    const headers = { 'Accept': 'application/json' };
    if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
    if (options.body !== undefined) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, {
      method: options.method || 'GET',
      headers,
      body: options.body === undefined ? undefined : JSON.stringify(options.body),
    });
    if (response.status === 401) { this.token = ''; render(); throw new Error('Session expired'); }
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
    if (!response.ok) {
      const error = new Error((data && data.detail) || ('HTTP ' + response.status));
      error.status = response.status;
      throw error;
    }
    return data;
  },
  get(p) { return this.call(p); },
  post(p, body) { return this.call(p, { method: 'POST', body: body || {} }); },
  put(p, body) { return this.call(p, { method: 'PUT', body: body || {} }); },
  del(p) { return this.call(p, { method: 'DELETE' }); },
};

/* --------------------------------------------------------------- helpers */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function when(iso) {
  if (!iso) return '—';
  const then = new Date(iso);
  if (isNaN(then)) return esc(iso);
  const seconds = Math.round((Date.now() - then) / 1000);
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  return then.toISOString().slice(0, 10);
}

/* The kernel's vocabulary, mapped to colour. Kept as one table so a status the
 * UI does not recognise renders neutrally rather than as a success. */
const TONE = {
  complete: 'ok', PUBLISHED: 'ok', CONNECTED: 'ok', COMPLETE: 'ok', MEASURED: 'ok',
  failed: 'bad', FAILED: 'bad', INVALID_CREDENTIAL: 'bad', blocked: 'bad', BLOCKED: 'bad',
  processing: 'run', testing: 'run', reviewing: 'run', committing: 'run',
  queued: 'run', planning: 'run', IN_PROGRESS: 'run', PROCESSING: 'run',
  awaiting_approval: 'wait', plan_proposed: 'wait', PENDING_CREDENTIAL: 'warn',
  PENDING_INFRASTRUCTURE: 'warn', PARTIAL: 'warn', NOT_AUTHORISED: 'warn',
  pending_credential: 'warn', NOT_VERIFIED: 'warn', DISABLED: 'warn',
  cancelled: '', draft: '', NOT_STARTED: '', NOT_CONFIGURED: '', DEFERRED: '',
};
/* An explicit tone for values that have no intrinsic one — a count is not
   good or bad, but the queue it counts is. */
const pill = (v, tone) => `<span class="pill ${tone !== undefined ? tone : (TONE[v] || '')}">${esc(v)}</span>`;

/* The mission lifecycle, in the order `mission/service.py::ALLOWED` permits.
 * Drawn as a sequence because that is what it is, and because a status word on
 * its own does not tell an operator how much is left. */
const LIFECYCLE = ['draft', 'planning', 'awaiting_approval', 'queued',
                   'processing', 'testing', 'reviewing', 'committing', 'complete'];

function track(status) {
  const at = LIFECYCLE.indexOf(status);
  const dead = ['failed', 'blocked', 'cancelled'].includes(status);
  return '<div class="track">' + LIFECYCLE.map((step, i) => {
    let cls = '';
    if (at >= 0 && i < at) cls = 'done';
    else if (i === at) cls = 'now';
    return `<span class="${cls}">${step}</span>`;
  }).join('') + (dead ? `<span class="bad">${esc(status)}</span>` : '') + '</div>';
}

function fail(message) {
  return `<div class="error"><strong>${esc(message)}</strong></div>`;
}
const empty = (m) => `<div class="empty">${esc(m)}</div>`;

/* --------------------------------------------------------------- state */
const state = { page: 'dashboard', arg: null, me: null, counts: {} };

const PAGES = [
  ['dashboard', 'Dashboard'], ['roadmap', 'Roadmap'], ['missions', 'Mission Control'],
  ['schedule', 'Schedule'],
  ['chat', 'Chat'], ['actions', 'Human Actions'], ['credentials', 'Credentials'],
  ['models', 'Models'], ['businesses', 'Businesses'], ['publications', 'Publications'],
  ['measurements', 'Measurements'], ['reports', 'Reports'], ['history', 'History'],
  ['settings', 'Settings'],
];

function navigate() {
  const [page, arg] = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/');
  state.page = PAGES.some(([id]) => id === page) ? page : 'dashboard';
  state.arg = arg ? decodeURIComponent(arg) : null;
  render();
}
window.addEventListener('hashchange', navigate);

function drawNav() {
  $('nav').innerHTML = '<h1>Qevik Control</h1>' + PAGES.map(([id, label]) => {
    const n = state.counts[id];
    const badge = n ? `<span class="count ${id === 'actions' ? 'alert' : ''}">${n}</span>` : '';
    const current = state.page === id ? ' aria-current="page"' : '';
    return `<a href="#/${id}"${current}>${esc(label)}${badge}</a>`;
  }).join('') + '<div class="spacer"></div>' +
    `<div class="who">${esc(state.me ? state.me.username : '')}</div>` +
    '<a href="#/" id="signout">Sign out</a>';
  const out = $('signout');
  if (out) out.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await API.post('/auth/logout'); } catch { /* the token is going either way */ }
    API.token = ''; state.me = null; render();
  });
}

/* --------------------------------------------------------------- pages */
const views = {};

views.dashboard = async () => {
  const [health, missions, actions, costs, blockers] = await Promise.all([
    API.get('/api/health').catch(() => null),
    API.get('/api/missions').catch(() => ({ missions: [], counts: {} })),
    API.get('/api/missions/actions').catch(() => ({ counts: {} })),
    API.get('/api/missions/costs').catch(() => null),
    API.get('/api/missions/blockers').catch(() => ({ total: 0 })),
  ]);
  state.counts.actions = (actions.counts && actions.counts.blocking) || 0;
  state.counts.missions = (missions.counts && missions.counts.awaiting_approval) || 0;

  const c = missions.counts || {};
  const degraded = health && health.degraded && health.degraded.length
    ? `<div class="card"><h3>Degraded</h3><p class="note">${health.degraded.map(esc).join(', ')}
       — a component is absent, not failed. ${esc(health.note || '')}</p></div>` : '';

  return `
    <header class="page"><h2>Dashboard</h2>
      <p>Everything below is read from the kernel. Nothing on this page decides anything.</p></header>
    <div class="grid">
      <div class="card"><h3>Missions</h3><div class="stat">${c.total || 0}</div>
        <p class="note">${c.running || 0} running · ${c.blocked || 0} blocked</p></div>
      <div class="card"><h3>Awaiting approval</h3><div class="stat">${c.awaiting_approval || 0}</div>
        <p class="note">nothing runs until a person approves</p></div>
      <div class="card"><h3>Waiting on you</h3><div class="stat">${(actions.counts && actions.counts.blocking) || 0}
        <small>of ${(actions.counts && actions.counts.total) || 0}</small></div>
        <p class="note"><a href="#/actions">Human actions</a></p></div>
      <div class="card"><h3>Blockers</h3><div class="stat">${blockers.total || 0}</div>
        <p class="note"><a href="#/missions">by class</a></p></div>
      ${costs ? `<div class="card"><h3>Cost</h3>
        <div class="stat">${costs.known_total} <small>${esc(costs.currency || '')}</small></div>
        <p class="note">${esc(costs.note || '')}</p></div>` : ''}
      ${health ? `<div class="card"><h3>Claiming</h3>
        <div class="stat" style="font-size:16px">${pill((health.components.claiming || {}).status || '—')}</div>
        <p class="note">${esc((health.components.claiming || {}).detail || '')}</p></div>` : ''}
    </div>
    ${degraded}`;
};

views.roadmap = async () => {
  /* The roadmap is served from a static document the kernel also writes, so the
   * UI and MASTER_STATE.md cannot disagree. Fetched rather than embedded. */
  let data = null;
  try { data = await API.get('/control/roadmap'); } catch { data = null; }
  if (!data) {
    return `<header class="page"><h2>Roadmap</h2>
      <p>Product A phases, the Product B programme, and Product C as a separate business.</p></header>
      ${fail('The roadmap endpoint is not available on this deployment.')}
      <p class="note">The roadmap is derived from <code>MASTER_STATE.md</code> by the
      kernel. Until <code>/control/roadmap</code> is served, this page has nothing
      to show — and showing a hardcoded copy here would create a second answer to
      "what is built" that drifts from the first.</p>`;
  }
  const section = (title, note, items) => `
    <h3 style="margin:1.5rem 0 .5rem">${esc(title)}</h3>
    <p class="note" style="margin-bottom:.75rem">${esc(note)}</p>
    <div class="rows">${items.map((i) => `
      <div class="row"><div class="body">
        <div class="title">${esc(i.item)} ${pill(i.status)}</div>
        <div class="meta">${esc(i.why || '')}</div>
        ${i.next_action ? `<div class="meta"><strong>Next:</strong> ${esc(i.next_action)}</div>` : ''}
        ${i.acceptance ? `<div class="meta"><strong>Done when:</strong> ${esc(i.acceptance)}</div>` : ''}
      </div></div>`).join('')}</div>`;
  return `<header class="page"><h2>Roadmap</h2>
      <p>Reconciled ${esc(data.reconciled_at || '')} at <code>${esc(data.commit || '')}</code>.</p></header>
    ${section('Product A — evidence engine', data.product_a_note || '', data.product_a || [])}
    ${section('Product B — execution platform', data.product_b_note || '', data.product_b || [])}
    ${section('Product C — separate business', data.product_c_note || '', data.product_c || [])}`;
};

views.missions = async () => {
  if (state.arg) return missionDetail(state.arg);
  const [listing, blockers] = await Promise.all([
    API.get('/api/missions'), API.get('/api/missions/blockers').catch(() => ({ by_kind: {} })),
  ]);
  const kinds = Object.entries(blockers.by_kind || {});
  return `
    <header class="page"><h2>Mission Control</h2>
      <p>Missions run in a worker process. Closing this page does not stop one.</p></header>
    ${kinds.length ? `<div class="card" style="margin-bottom:1rem"><h3>Blocked by</h3>
      ${kinds.map(([kind, rows]) => `<div class="meta">${pill(kind)} ${rows.length} — ${
        esc(rows.map((r) => r.detail).join('; ').slice(0, 160))}</div>`).join('')}</div>` : ''}
    <div class="rows">${(listing.missions || []).map((m) => `
      <div class="row">
        <div class="body">
          <div class="title"><a href="#/missions/${encodeURIComponent(m.mission_id)}">${esc(m.title)}</a></div>
          <div class="meta"><code>${esc(m.mission_id)}</code> · ${when(m.updated_at)}
            ${m.claimed_by ? '· held by <code>' + esc(m.claimed_by) + '</code>' : ''}</div>
          ${track(m.status)}
        </div>
        <div class="actions">${pill(m.status)}</div>
      </div>`).join('') || empty('No missions yet. Start one from Chat.')}</div>`;
};

async function missionDetail(id) {
  const [mission, history] = await Promise.all([
    API.get('/api/missions/' + encodeURIComponent(id)),
    API.get('/api/missions/' + encodeURIComponent(id) + '/history').catch(() => ({ history: [] })),
  ]);
  let report = null;
  try { report = await API.get('/api/missions/' + encodeURIComponent(id) + '/report'); } catch { /* often absent */ }

  const approve = mission.status === 'awaiting_approval'
    ? '<button class="primary" data-approve>Approve — queue this mission</button>' : '';
  const cancel = ['draft', 'planning', 'awaiting_approval', 'queued', 'blocked'].includes(mission.status)
    ? '<button class="danger" data-cancel>Cancel</button>' : '';

  const html = `
    <header class="page"><h2>${esc(mission.title)}</h2>
      <p><code>${esc(mission.mission_id)}</code> · requested by ${esc(mission.requested_by || '—')}
      · ${when(mission.created_at)}</p></header>
    <div class="card" style="margin-bottom:1rem">
      ${pill(mission.status)} ${track(mission.status)}
      <div class="actions" style="margin-top:.9rem">${approve}${cancel}</div>
    </div>
    ${(mission.blockers || []).length ? `<div class="card" style="margin-bottom:1rem">
      <h3>Blocked</h3>${mission.blockers.map((b) =>
        `<div class="meta">${pill(b.kind)} ${esc(b.detail)}${b.action ? ' → <strong>' + esc(b.action) + '</strong>' : ''}</div>`
      ).join('')}</div>` : ''}
    ${mission.plan ? `<div class="card" style="margin-bottom:1rem"><h3>Plan</h3>
      <div class="meta">${esc(mission.plan.goal || '')}</div>
      <ol>${(mission.plan.steps || []).map((s) =>

/* The five queues. WAITING and BLOCKED are drawn apart on purpose: one
   resolves by itself and the other never will, and an operator who cannot tell
   them apart chases the wrong half. */
const QUEUES = [
  ['NOW', 'Running now', 'run', 'Dispatched, or about to be.'],
  ['NEXT', 'Next', '', 'Ready. Waiting only for a free worker.'],
  ['SCHEDULED', 'Scheduled', 'wait', 'Held until a window somebody chose.'],
  ['WAITING', 'Waiting', 'warn', 'On a person, or on other work. Resolves by itself.'],
  ['BLOCKED', 'Blocked', 'bad', 'Cannot proceed. Nothing here resolves on its own.'],
];

        ${r.detail ? `<div class="meta">${esc(r.detail)}</div>` : ''}
        <form data-provider="${esc(r.provider)}" style="margin-top:.6rem;max-width:26rem">
          <div class="field"><input type="password" name="secret" autocomplete="off"
            placeholder="${r.configured ? 'Replace this credential' : 'Paste the credential'}"></div>
          <div class="actions">
            <button class="primary" type="submit">${r.configured ? 'Rotate' : 'Save'}</button>
            <button type="button" data-test>Test</button>
            ${r.configured ? '<button type="button" class="danger" data-forget>Forget</button>' : ''}
            ${r.setup_url ? `<a href="${esc(r.setup_url)}" target="_blank" rel="noopener">Where to get one</a>` : ''}
          </div>
        </form>
      </div></div>`).join('')}</div>
    <p class="note" style="margin-top:1rem">
      Stored is not connected. A saved credential stays <code>PENDING_CREDENTIAL</code>
      until something tests it — reporting it as working because somebody pasted
      one is how an integration sits broken behind a green tick.</p>`;

  queueMicrotask(() => {
    document.querySelectorAll('form[data-provider]').forEach((form) => {
      const provider = form.dataset.provider;
      const configured = form.querySelector('button.primary').textContent === 'Rotate';
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const secret = form.secret.value;
        if (!secret) return;
        try {
          await API.call('/api/credentials/' + encodeURIComponent(provider) +
            (configured ? '/rotate' : ''), { method: configured ? 'POST' : 'PUT', body: { secret } });
          /* Cleared immediately: the value must not survive in the DOM, and it is
           * never read back from the server. */
          form.secret.value = '';
          render();
        } catch (err) { alert(err.message); }
      });
      const test = form.querySelector('[data-test]');
      if (test) test.addEventListener('click', async () => {
        test.disabled = true; test.textContent = 'Testing…';
        try {
          const r = await API.post('/api/credentials/' + encodeURIComponent(provider) + '/test');
          alert(r.works ? 'Connected.' : (r.status + ' — ' + (r.detail || '')));
        } catch (err) { alert(err.message); }
        finally { test.disabled = false; test.textContent = 'Test'; render(); }
      });
      const forget = form.querySelector('[data-forget]');
      if (forget) forget.addEventListener('click', async () => {
        if (!confirm('Destroy the stored credential for ' + provider + '? This cannot be undone.')) return;
        try { await API.del('/api/credentials/' + encodeURIComponent(provider)); render(); }
        catch (err) { alert(err.message); }
      });
    });
  });
  return html;
};

/* --------------------------------------------------------------- render */
async function render() {
  if (!API.token) {
    live.stop();
    $('login').classList.remove('hidden');
    $('shell').classList.add('hidden');
    return;
  }
  $('login').classList.add('hidden');
  $('shell').classList.remove('hidden');
  $('live').classList.remove('hidden');
  if (!live.timer) live.start();
  drawNav();
  const main = $('main');
  main.setAttribute('aria-busy', 'true');
  try {
    main.innerHTML = await (views[state.page] || views.dashboard)();
  } catch (e) {
    main.innerHTML = fail(e.message) +
      '<p class="note">This is what the kernel said. The page shows it rather than ' +
      'an empty list, because an empty list reads as "you have none".</p>';
  }
  main.removeAttribute('aria-busy');
  drawNav();
}

/* ---------------------------------------------------------- live status
 *
 * Polling with a version token rather than server-sent events, and that is a
 * decision. This page is served through Cloudflare, which buffers streaming
 * responses by default — an SSE channel would work locally, pass review, and
 * deliver nothing in production. Polling also holds no connection open, so a
 * hundred idle tabs cost a single-worker deployment nothing.
 *
 * The page is never load-bearing for the work: this only decides when to
 * re-read. Closing the tab stops the polling and stops nothing else.
 */
const live = {
  version: '', timer: null, failures: 0,

  start() {
    this.stop();
    this.tick();
    this.timer = setInterval(() => this.tick(), 4000);
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  async tick() {
    if (!API.token || document.hidden) return;
    try {
      const status = await API.get('/api/status?since=' + encodeURIComponent(this.version));
      this.failures = 0;
      if (!status.changed) { this.show(status, false); return; }
      const first = !this.version;
      this.version = status.version;
      this.show(status, true);
      /* Re-render only the pages a change could affect. Redrawing Credentials
       * because a mission moved would discard whatever somebody was typing. */
      if (!first && ['dashboard', 'missions', 'chat', 'reports', 'history'].includes(state.page)) {
        render();
      }
    } catch (e) {
      /* A failed poll is not a failed mission. The badge says the view may be
       * behind; it does not claim anything about the work. */
      this.failures += 1;
      if (this.failures >= 2) {
        const box = $('live');
        box.className = 'stale';
        box.textContent = 'Not refreshing — the view may be behind';
      }
    }
  },

  show(status, changed) {
    const box = $('live');
    const c = status.counts;
    if (!c) return;
    box.className = '';
    const bits = [];
    if (c.running) bits.push(c.running + ' running');
    if (c.needs_me) bits.push(c.needs_me + ' needs you');
    if (c.blocked) bits.push(c.blocked + ' blocked');
    box.textContent = bits.length ? bits.join(' · ') : 'Nothing running';
    box.onclick = () => { location.hash = c.needs_me ? '#/actions' : '#/missions'; };
  },
};

/* Stop polling while the tab is hidden and catch up on return. A phone in a
 * pocket should not be asking every four seconds. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && API.token) live.tick();
});

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = $('login-error');
  box.innerHTML = '';
  try {
    const r = await API.call('/auth/login', {
      method: 'POST', body: { username: $('u').value, password: $('p').value },
    });
    API.token = r.token || r.access_token || '';
    $('p').value = '';
    if (!API.token) throw new Error('No session token was returned.');
    state.me = await API.get('/auth/me').catch(() => null);
    navigate();
  } catch (err) { box.innerHTML = fail(err.message); }
});

(async function start() {
  if (API.token) state.me = await API.get('/auth/me').catch(() => null);
  navigate();
})();
</script>
</body>
</html>
