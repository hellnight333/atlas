<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qevik Sales Intelligence</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Qevik Sales Intelligence.
 *
 * A sales interface, not a database viewer. The whole design exists to make one
 * sequence readable at a glance — RESEARCH -> EVIDENCE -> OPPORTUNITY ->
 * OUTREACH — rather than to render rows.
 *
 * The one rule everything else follows: **three states, drawn three ways.**
 * CONFIRMED_PRESENT, CONFIRMED_ABSENT and NOT_VERIFIED never share a colour or
 * a glyph. A dashboard that paints "not verified" red has invented a finding,
 * and the operator will repeat it to a business owner who knows better. A
 * REFUTED finding gets a fourth treatment again — violet, reading as a
 * correction rather than a fault, because the old claim was ours, not theirs.
 *
 * Semantic colour is deliberately separate from the accent. Blue means "you can
 * act on this"; green, amber and grey mean things about evidence. They never
 * borrow each other's meaning.
 */
*,*::before,*::after{box-sizing:border-box}
/* Both spellings. The markup gates the app shell with a `.hidden` class and the
 * attribute is used elsewhere; defining only one left the whole workspace frame
 * on screen before sign-in, which a browser test caught and a reader would
 * have read as a broken dashboard. */
[hidden],.hidden{display:none !important}

:root{
  --shell:#101623; --shell-2:#18202F; --shell-line:#252E3E; --shell-ink:#E8ECF3;
  --shell-dim:#8B95A8;
  --bg:#F6F7F9; --card:#FFFFFF; --sunk:#F0F2F5;
  --ink:#0E1420; --ink-2:#3E4757; --mute:#6B7484; --rule:#E3E6EB;
  --accent:#2B5CE6; --accent-soft:#EAF0FE;
  --present:#0E8A5F; --present-soft:#E6F5EF;
  --absent:#C2410C;  --absent-soft:#FDF0E8;
  --unknown:#7A8496;  --unknown-soft:#F0F2F5;
  --refuted:#6D28D9; --refuted-soft:#F2ECFD;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --side:236px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
nav.side{width:var(--side);flex:0 0 var(--side);background:var(--shell);color:var(--shell-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
nav.side .brand{padding:1.2rem 1.1rem .9rem;border-bottom:1px solid var(--shell-line)}
nav.side .brand b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.01em}
nav.side .brand span{font-size:.7rem;color:var(--shell-dim)}
nav.side .links{padding:.7rem .6rem;display:flex;flex-direction:column;gap:.1rem;flex:1 1 auto;overflow-y:auto}
nav.side a{display:flex;align-items:center;gap:.6rem;padding:.55rem .65rem;border-radius:8px;
  color:var(--shell-dim);font-size:.88rem;font-weight:600}
nav.side a:hover{background:var(--shell-2);color:var(--shell-ink)}
nav.side a[aria-current=page]{background:var(--accent);color:#fff}
nav.side a .c{margin-left:auto;font-size:.72rem;opacity:.75;font-variant-numeric:tabular-nums}
nav.side svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
nav.side .foot{padding:.8rem 1.1rem;border-top:1px solid var(--shell-line);font-size:.74rem;
  color:var(--shell-dim);display:flex;align-items:center;gap:.5rem}
nav.side .foot button{color:var(--shell-dim);font-size:.74rem;text-decoration:underline}

main{flex:1 1 auto;min-width:0;padding:1.5rem 1.7rem 4rem}
.head{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.3rem;flex-wrap:wrap}
.head h1{font-size:1.55rem}
.head p{color:var(--mute);font-size:.9rem;margin-top:.25rem}
.head .tools{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px}
.pad{padding:1.1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent);color:#fff;
  border-radius:8px;padding:.5rem .85rem;font-size:.85rem;font-weight:650;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:.34rem .6rem;font-size:.78rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--rule);
  border-radius:8px;padding:.5rem .7rem;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.16rem .55rem;
  font-size:.7rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tag.present{background:var(--present-soft);color:var(--present)}
.tag.absent{background:var(--absent-soft);color:var(--absent)}
.tag.unknown{background:var(--unknown-soft);color:var(--unknown)}
.tag.refuted{background:var(--refuted-soft);color:var(--refuted)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.flat{background:var(--sunk);color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:.7rem;margin-bottom:1.4rem}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:.85rem .95rem}
.kpi b{display:block;font-size:1.65rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.kpi span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:650}
.kpi.hot b{color:var(--accent)}
.kpi.warn b{color:var(--absent)}

/* ---------- prospect cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:.85rem}
.pcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;transition:border-color .12s,box-shadow .12s}
.pcard:hover{border-color:#C9D2E4;box-shadow:0 2px 12px rgba(16,22,35,.06)}
.pcard .shot{aspect-ratio:16/9;background:var(--sunk);overflow:hidden;border-bottom:1px solid var(--rule);
  position:relative}
.pcard .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.pcard .shot .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);
  font-size:.76rem;text-align:center;padding:1rem}
.pcard .body{padding:.85rem .95rem 1rem;display:flex;flex-direction:column;gap:.5rem;flex:1 1 auto}
.pcard .title{display:flex;align-items:flex-start;gap:.6rem}
.pcard .title b{font-size:.98rem;font-weight:700;line-height:1.25}
.pcard .title .score{margin-left:auto;text-align:right;flex:0 0 auto}
.pcard .title .score b{display:block;font-size:1.25rem;font-weight:800;line-height:1}
.pcard .title .score span{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pcard .meta{font-size:.78rem;color:var(--mute)}
.pcard .gap{font-size:.84rem}
.pcard .gap i{font-style:normal;color:var(--mute)}
.pcard .facts{display:flex;gap:.3rem;flex-wrap:wrap}
.pcard .foot{display:flex;align-items:center;gap:.5rem;padding-top:.5rem;border-top:1px solid var(--rule);
  margin-top:auto;font-size:.78rem;color:var(--mute)}

/* ---------- filters ---------- */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:.5rem;margin-bottom:1rem}
.filters label{display:block}
.filters .eyebrow{margin-bottom:.25rem}

/* ---------- detail ---------- */
.detail-head{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:1.2rem}
.detail-head h1{font-size:1.7rem}
.detail-head .sub{color:var(--mute);font-size:.88rem;margin-top:.3rem}
.scorebig{text-align:right;margin-left:auto}
.scorebig b{display:block;font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.scorebig span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1rem;align-items:start}
.hero{background:linear-gradient(160deg,#141C2C,#0E1420);color:#fff;border-radius:13px;padding:1.25rem}
.hero .eyebrow{color:#8C97AC}
.hero h2{font-size:1.5rem;margin:.4rem 0 .55rem;color:#fff}
.hero p{color:#B9C2D2;font-size:.88rem;line-height:1.55}
.hero .ev{background:rgba(255,255,255,.06);border-radius:9px;padding:.65rem .8rem;margin-top:.8rem;
  font-size:.82rem;color:#D3DAE6;font-family:var(--mono)}
.hero .fix{margin-top:.8rem;font-size:.88rem;color:#fff}
.hero .fix b{color:#7FE7C0}

.finding{display:flex;gap:.75rem;padding:.8rem .95rem;border-bottom:1px solid var(--rule);align-items:flex-start}
.finding:last-child{border-bottom:0}
.finding .dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:.7rem;font-weight:800;margin-top:.1rem}
.finding .dot.present{background:var(--present-soft);color:var(--present)}
.finding .dot.absent{background:var(--absent-soft);color:var(--absent)}
.finding .dot.unknown{background:var(--unknown-soft);color:var(--unknown)}
.finding .dot.refuted{background:var(--refuted-soft);color:var(--refuted)}
.finding .what{flex:1 1 auto;min-width:0}
.finding .what b{font-size:.9rem;font-weight:650}
.finding .what p{font-size:.8rem;color:var(--mute);margin-top:.2rem;line-height:1.5}
.finding .what .ev{font-family:var(--mono);font-size:.74rem;color:var(--ink-2);background:var(--sunk);
  border-radius:6px;padding:.35rem .5rem;margin-top:.35rem;word-break:break-word}
.finding .side{flex:0 0 auto;text-align:right}

.shots{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.shotcard{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sunk)}
.shotcard .cap{display:flex;align-items:center;gap:.4rem;padding:.5rem .65rem;background:var(--card);
  border-bottom:1px solid var(--rule);font-size:.75rem;color:var(--mute)}
.shotcard .cap b{color:var(--ink);font-weight:650}
.shotcard a{display:block;max-height:280px;overflow:hidden}
.shotcard img{width:100%;display:block}
.shotcard .none{padding:1.6rem 1rem;text-align:center;color:var(--mute);font-size:.8rem}

.msg{background:var(--sunk);border:1px solid var(--rule);border-radius:10px;padding:.9rem 1rem;
  white-space:pre-wrap;font-size:.88rem;line-height:1.6;word-break:break-word}
.dns li{display:flex;gap:.5rem;font-size:.83rem;color:var(--ink-2);padding:.35rem 0;line-height:1.5}
.dns li::before{content:"✕";color:var(--absent);font-weight:800;flex:0 0 auto}

.tl{position:relative;padding-left:1.15rem}
.tl::before{content:"";position:absolute;left:5px;top:.4rem;bottom:.4rem;width:2px;background:var(--rule)}
.tl li{position:relative;padding:.45rem 0 .45rem 0;font-size:.83rem}
.tl li::before{content:"";position:absolute;left:-1.15rem;top:.75rem;width:10px;height:10px;
  border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.tl li .when{color:var(--mute);font-size:.75rem}

table.compact{width:100%;border-collapse:collapse;font-size:.85rem}
table.compact th{text-align:left;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);font-weight:700;padding:.5rem .6rem;border-bottom:1px solid var(--rule)}
table.compact td{padding:.55rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.compact tr:last-child td{border-bottom:0}

.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem;align-items:start}
.pipe .col{background:var(--card);border:1px solid var(--rule);border-radius:11px;overflow:hidden}
.pipe .col h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  padding:.65rem .8rem;border-bottom:1px solid var(--rule);display:flex}
.pipe .col h3 span{margin-left:auto;color:var(--ink);font-weight:800}
.pipe .col .item{padding:.6rem .8rem;border-bottom:1px solid var(--rule);font-size:.83rem;
  display:block;width:100%;text-align:left}
.pipe .col .item:last-child{border-bottom:0}
.pipe .col .item:hover{background:var(--sunk)}
.pipe .col .item b{display:block;font-weight:650}
.pipe .col .item span{color:var(--mute);font-size:.75rem}

.empty{padding:2.2rem 1rem;text-align:center;color:var(--mute);font-size:.88rem}
.err{color:var(--absent);font-size:.85rem}

/* ---------- sign in ---------- */
#login{max-width:23rem;margin:14vh auto;padding:1.5rem}
#login h1{font-size:1.3rem;margin-bottom:.3rem}
#login p{color:var(--mute);font-size:.85rem;margin-bottom:1.1rem}
#login input{margin-bottom:.6rem}

/* ---------- mobile ---------- */
.mobar{display:none}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
  .shots{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{font-size:14.5px}
  .shell{flex-direction:column}
  nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex:none;
    z-index:20;border-top:1px solid var(--shell-line)}
  nav.side .brand,nav.side .foot{display:none}
  nav.side .links{flex-direction:row;overflow-x:auto;padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom));
    gap:.2rem;scrollbar-width:none}
  nav.side .links::-webkit-scrollbar{display:none}
  nav.side a{flex-direction:column;gap:.15rem;font-size:.62rem;padding:.45rem .5rem;min-width:62px;
    text-align:center;flex:0 0 auto}
  nav.side a .c{display:none}
  main{padding:1rem 1rem 6.5rem}
  .head h1{font-size:1.3rem}
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .detail-head{gap:.6rem}
  .scorebig{margin-left:0}
  .scorebig b{font-size:1.9rem}
  .mobar{display:flex;position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));
    z-index:19;background:var(--card);border-top:1px solid var(--rule);padding:.5rem .7rem;gap:.45rem}
  .mobar .btn{flex:1 1 0;justify-content:center;padding:.6rem .3rem;font-size:.78rem}
}

    .opps{display:grid;gap:1rem}
    .opp{display:grid;grid-template-columns:2.2rem 1fr;gap:.7rem;padding-bottom:1rem;
      border-bottom:1px solid var(--rule)}
    .opp:last-child{border-bottom:0;padding-bottom:0}
    .opp-n{color:var(--accent);font-size:.85rem;padding-top:.15rem}
    .opp-head{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
    .perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.4rem}
    .perm{display:flex;gap:.5rem;align-items:center;border:1px solid var(--rule);
      padding:.55rem .7rem;border-radius:6px;cursor:pointer;font-size:.9rem}
    .perm.on{border-color:var(--accent)}
    .perm input{accent-color:var(--accent)}
    .job{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.5rem 0;
      border-bottom:1px solid var(--rule)}
    .job:last-child{border-bottom:0}
</style>
</head>
<body>

<div id="login" class="card hidden">
  <h1>Qevik Sales Intelligence</h1>
  <p>Sign in. Prospect evidence and contact details are behind this door.</p>
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <div class="row"><button class="btn" id="signin">Sign in</button><span id="loginerr" class="err"></span></div>
</div>

<div class="shell hidden" id="app">
  <nav class="side" aria-label="Sections">
    <div class="brand"><b>Qevik</b><span>Sales Intelligence</span></div>
    <div class="links" id="nav"></div>
    <div class="foot"><span id="me"></span><button id="signout">Sign out</button></div>
  </nav>
  <main id="view"><div class="empty">Loading…</div></main>
</div>

<script>
"use strict";

const API = location.origin.replace(/\/$/, "");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const NAV = [
  ["dashboard", "Dashboard", '<path d="M3 12h6v9H3zM9 3h6v18H9zM15 8h6v13h-6z"/>'],
  ["prospects", "Prospects", '<circle cx="9" cy="8" r="3.4"/><path d="M3 20a6 6 0 0 1 12 0M17 11h4M19 9v4"/>'],
  ["pipeline",  "Pipeline",  '<path d="M4 5h16M6 12h12M9 19h6"/>'],
  ["outreach",  "Outreach",  '<path d="M4 5h16v13H8l-4 3z"/>'],
  ["evidence",  "Evidence",  '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>'],
  ["demos",     "Demos",     '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'],
  ["settings",  "Settings",  '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'],
];

/* ------------------------------------------------------------------ api */
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    credentials: "include",
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    ...opts,
  });
  if (res.status === 401) { showLogin(); throw new Error("unauthenticated"); }
  if (!res.ok) throw new Error((await res.text().catch(() => "")) || res.statusText);
  return res.status === 204 ? null : res.json();
}

function showLogin() {
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
}

/* ------------------------------------------------- three-state rendering */
/* The whole point of the interface. `NOT_VERIFIED` must never be able to
 * borrow the styling of `CONFIRMED_ABSENT`; they are different claims and only
 * one of them can be said out loud. */
const STATE = {
  CONFIRMED_PRESENT: { cls: "present", mark: "✓", word: "Confirmed present" },
  CONFIRMED_ABSENT:  { cls: "absent",  mark: "✕", word: "Confirmed absent" },
  NOT_VERIFIED:      { cls: "unknown", mark: "?", word: "Not verified" },
  REFUTED:           { cls: "refuted", mark: "↺", word: "Refuted" },
};
const state = s => STATE[s] || STATE.NOT_VERIFIED;

function tag(s, text) {
  const v = state(s);
  return `<span class="tag ${v.cls}">${v.mark} ${esc(text || v.word)}</span>`;
}

function scoreColour(n) {
  return n >= 75 ? "var(--accent)" : n >= 55 ? "var(--ink)" : "var(--mute)";
}

function copyBtn(text, label = "Copy") {
  const id = "c" + Math.abs(hash(text)).toString(36);
  copyables[id] = text;
  return `<button class="btn ghost sm" data-copy="${id}">${esc(label)}</button>`;
}
const copyables = {};
function hash(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }

/* WhatsApp affordance appears only for a number WhatsApp can actually reach.
 * Offering it for a landline produces a message that silently goes nowhere. */
function contactButtons(c, phone) {
  const out = [];
  if (phone) out.push(`<a class="btn ghost sm" href="tel:${esc(phone.replace(/\s/g, ""))}">Call</a>`);
  if (c && c.whatsapp === "REACHABLE" && c.wa_link)
    out.push(`<a class="btn sm" href="${esc(c.wa_link)}" target="_blank" rel="noopener">Open WhatsApp</a>`);
  if (phone) out.push(copyBtn(phone, "Copy number"));
  return out.join(" ");
}

/* ------------------------------------------------------------- routing */
let route = { view: "dashboard", id: "" };

function go(view, id = "") {
  route = { view, id };
  location.hash = id ? `#/${view}/${id}` : `#/${view}`;
  render();
}

function readHash() {
  const parts = (location.hash || "#/dashboard").slice(2).split("/");
  route = { view: parts[0] || "dashboard", id: parts[1] || "" };
}

function drawNav(counts) {
  $("nav").innerHTML = NAV.map(([key, label, icon]) => `
    <a href="#/${key}" data-view="${key}"${route.view === key ? ' aria-current="page"' : ""}>
      <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}
      ${counts && counts[key] != null ? `<span class="c n">${counts[key]}</span>` : ""}
    </a>`).join("");
}

/* --------------------------------------------------------------- views */
let summary = null;

async function render() {
  drawNav(summary ? { prospects: summary.total, outreach: summary.approved } : null);
  const view = $("view");
  view.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (route.view === "prospects" && route.id) return await drawProspect(route.id);
    const fn = { dashboard: drawDashboard, prospects: drawProspects, pipeline: drawPipeline,
                 outreach: drawOutreach, evidence: drawEvidence, demos: drawDemos,
                 settings: drawSettings }[route.view] || drawDashboard;
    await fn();
  } catch (err) {
    if (String(err.message) !== "unauthenticated")
      view.innerHTML = `<div class="card pad err">Could not load: ${esc(err.message)}</div>`;
  }
}

let filters = { q: "", industry: "", contact: "", website: "", stage: "", sort: "score", page: 1 };

async function drawProspects() {
  const qs = new URLSearchParams({ ...filters, size: 24 }).toString();
  const data = await api("/control/sales/prospects?" + qs);
  const pages = Math.max(1, Math.ceil(data.total / data.size));
  const sel = (name, opts, value) => `<select data-filter="${name}">` +
    opts.map(([v, l]) => `<option value="${v}"${v === value ? " selected" : ""}>${l}</option>`).join("") +
    `</select>`;

  $("view").innerHTML = `
    <div class="head">
      <div><h1>Prospects</h1><p>${data.total} match. Ranked by opportunity, every score explainable from stored evidence.</p></div>
    </div>
    <div class="filters">
      <label><span class="eyebrow">Search</span>
        <input id="q" placeholder="Name, domain, phone, area…" value="${esc(filters.q)}"></label>
      <label><span class="eyebrow">Industry</span>${sel("industry", [
        ["", "All"], ["Food & Drink", "Food & Drink"], ["Health & Beauty", "Health & Beauty"],
        ["Home Services", "Home Services"], ["Automotive", "Automotive"],
        ["Professional Services", "Professional Services"],
        ["Recruitment & Staffing", "Recruitment & Staffing"], ["Hospitality", "Hospitality"],
        ["Retail", "Retail"], ["Real Estate", "Real Estate"], ["Fitness", "Fitness"],
        ["Technology", "Technology"], ["Education", "Education"], ["Games", "Games"],
        ["Other", "Other"]],
        filters.industry)}</label>
      <label><span class="eyebrow">Contact</span>${sel("contact", [
        ["", "Any"], ["whatsapp", "WhatsApp reachable"], ["phone", "Phone only"],
        ["email", "Email only"], ["none", "No contact"]], filters.contact)}</label>
      <label><span class="eyebrow">Website</span>${sel("website", [
        ["", "Any"], ["weaknesses", "Has confirmed weakness"], ["no_arabic", "No Arabic"],
        ["no_mobile_cta", "No mobile call button"], ["slow", "Slow"], ["https", "HTTPS working"]],
        filters.website)}</label>
      <label><span class="eyebrow">Sort</span>${sel("sort", [
        ["score", "Opportunity score"], ["confidence", "Evidence confidence"],
        ["verified", "Last verified"], ["contactability", "Contactability"],
        ["industry", "Industry"], ["stage", "Outreach stage"]], filters.sort)}</label>
    </div>
    ${data.items.length ? `<div class="grid">${data.items.map(card).join("")}</div>`
      : `<div class="card empty">Nothing matches those filters.</div>`}
    <div class="row" style="justify-content:center;margin-top:1.2rem">
      <button class="btn ghost sm" data-page="${filters.page - 1}" ${filters.page <= 1 ? "disabled" : ""}>Previous</button>
      <span class="small muted n">Page ${filters.page} of ${pages}</span>
      <button class="btn ghost sm" data-page="${filters.page + 1}" ${filters.page >= pages ? "disabled" : ""}>Next</button>
    </div>`;

  const q = $("q");
  let debounce;
  q.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { filters.q = q.value; filters.page = 1; drawProspects()
      .then(() => { const box = $("q"); if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); } }); }, 260);
  });
}

/* Two writes, both recording something a human did. Neither generates anything:
   ticking a permission records what a customer said, and requesting a build
   queues a job. A queued job is not a product and never reaches a message. */
function wireProspectActions(id) {
  const save = document.getElementById("permsave");
  if (save) save.addEventListener("click", async () => {
    const picked = document.querySelector('input[name="mediaperm"]:checked');
    if (!picked) return;
    const was = save.textContent;
    save.disabled = true; save.textContent = "Recording…";   // before the await
    try {
      await api(`/control/sales/prospects/${id}/media-permission`, {
        method: "POST",
        body: JSON.stringify({ permission: picked.value,
                               source: document.getElementById("permsrc").value }),
      });
      save.textContent = "Recorded";
      setTimeout(() => drawProspect(id), 600);
    } catch (err) {
      save.disabled = false; save.textContent = was;
      alert("Not recorded: " + err.message);
    }
  });

  document.querySelectorAll("[data-build]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const product = btn.dataset.build, was = btn.textContent;
      btn.disabled = true; btn.textContent = "Queueing…";
      try {
        const r = await api(`/control/sales/prospects/${id}/build`, {
          method: "POST",
          body: JSON.stringify({ product, opportunity: btn.dataset.opp }),
        });
        btn.textContent = `Queued ${r.job_id}`;
        setTimeout(() => drawProspect(id), 800);
      } catch (err) {
        btn.disabled = false; btn.textContent = was;
        alert(err.message.includes("REQUIRES BRIEF")
          ? "Requires a brief — this business has no evidenced opportunity yet. Audit it first."
          : "Not queued: " + err.message);
      }
    });
  });

  document.querySelectorAll('input[name="mediaperm"]').forEach(r =>
    r.addEventListener("change", () => {
      document.querySelectorAll(".perm").forEach(l =>
        l.classList.toggle("on", l.contains(document.querySelector('input[name="mediaperm"]:checked'))));
    }));
}

const KIND = {
  business_discovered: "Discovered", website_audited: "Website audited",
  claims_verified: "Claims re-verified live", website_demo_published: "Demo built and published",
  screenshot_captured: "Screenshots captured", prospect_scored: "Scored",
  outreach_drafted: "Draft written", experiment_prepared: "Message prepared (not sent)",
  experiment_sent: "Sent by hand", experiment_response: "Reply received",
  experiment_objection: "Objection recorded", experiment_outcome: "Outcome recorded",
};
const kindLabel = k => KIND[k] || k.replace(/_/g, " ");

function when(iso) {
  if (!iso) return "";
  const then = new Date(iso), mins = (Date.now() - then) / 60000;
  if (mins < 60) return `${Math.round(mins)} minutes ago`;
  if (mins < 1440) return `${Math.round(mins / 60)} hours ago`;
  const days = Math.round(mins / 1440);
  return days === 1 ? "yesterday" : `${days} days ago`;
}

/* ------------------------------------------------------------ events */
document.addEventListener("click", async event => {
  const open = event.target.closest("[data-open]");
  if (open) return go("prospects", open.dataset.open);

  const nav = event.target.closest("nav.side a");
  if (nav) { event.preventDefault(); return go(nav.dataset.view); }

  const goto = event.target.closest("[data-go]");
  if (goto) return go(goto.dataset.go);

  const page = event.target.closest("[data-page]");
  if (page && !page.disabled) { filters.page = +page.dataset.page; return drawProspects(); }

  const copy = event.target.closest("[data-copy]");
  if (copy) {
    const text = copyables[copy.dataset.copy] || "";
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement("textarea"); t.value = text;
            document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    const was = copy.textContent; copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = was), 1400);
    return;
  }

  const sent = event.target.closest("[data-sent]");
  if (sent) {
    const at = prompt("When did you actually send it? Leave blank for now.\n(YYYY-MM-DD HH:MM, your local time)");
    if (at === null) return;
    const stamp = at.trim() ? new Date(at.replace(" ", "T")) : new Date();
    if (isNaN(stamp)) return alert("Could not read that time.");
    const channel = prompt("Channel? (whatsapp / phone / email)", "whatsapp");
    if (!channel) return;
    await api(`/control/sales/prospects/${sent.dataset.sent}/sent`, { method: "POST",
      body: JSON.stringify({ channel, sent_at: stamp.toISOString() }) });
    return render();
  }

  const reply = event.target.closest("[data-reply]");
  if (reply) {
    const response = prompt("What kind of reply? (interested / questions / not_now / declined / hostile)");
    if (!response) return;
    const verbatim = prompt("Paste exactly what they said (optional):") || "";
    await api(`/control/sales/prospects/${reply.dataset.reply}/reply`, { method: "POST",
      body: JSON.stringify({ response, verbatim }) });
    return render();
  }
});

document.addEventListener("change", event => {
  const filter = event.target.closest("[data-filter]");
  if (!filter) return;
  filters[filter.dataset.filter] = filter.value;
  filters.page = 1;
  drawProspects();
});
