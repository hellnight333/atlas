repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python3 -m mypy
        language: system
        pass_filenames: false
        args: [packages/kernel/atlas_kernel]
      - id: pytest-architecture
        name: pytest architecture contracts
        entry: python3 -m pytest packages/kernel/tests/test_architecture_contracts.py
        language: system
        pass_filenames: false
