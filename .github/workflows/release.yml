name: Release

# Installers are built here, not on a developer machine. Tauri cannot
# cross-compile, so each platform needs its own native runner.
# A dispatch builds every platform, collects the artifacts and generates the
# checksums, but never creates a GitHub Release -- that step requires a tag.
# Use it to validate the whole pipeline before tagging. There was a `dry_run`
# input here that nothing ever read; the tag is the real switch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            pg: darwin-arm64
            bundles: app
          # macos-13 was retired by GitHub, so this job simply queued until it
          # was cancelled -- it never ran a single step, which reads like a
          # stalled build rather than a missing runner. macos-15-intel is the
          # current standard (free, unlimited for public repositories)
          # Intel runner.
          - os: macos-15-intel
            label: macOS (Intel)
            target: x86_64-apple-darwin
            pg: darwin-amd64
            bundles: app
          # 22.04 deliberately: AppImages built against a newer glibc refuse to
          # start on older distributions, and the reverse is not true.
          - os: ubuntu-22.04
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            pg: linux-amd64
            bundles: appimage
          - os: windows-latest
            label: Windows (x86_64)
            target: x86_64-pc-windows-msvc
            pg: windows-amd64
            bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build the kernel binary
        run: |
          python -m PyInstaller infra/packaging/atlas-kernel.spec \
            --distpath infra/packaging/dist \
            --workpath infra/packaging/build \
            --noconfirm --log-level WARN
        shell: bash

      - name: Stage the kernel as a Tauri sidecar
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp infra/packaging/dist/atlas-kernel.exe \
               "apps/desktop/src-tauri/binaries/atlas-kernel-${{ matrix.target }}.exe"
          else
            cp infra/packaging/dist/atlas-kernel \
               "apps/desktop/src-tauri/binaries/atlas-kernel-${{ matrix.target }}"
            chmod +x "apps/desktop/src-tauri/binaries/atlas-kernel-${{ matrix.target }}"
          fi
        shell: bash

      - name: Fetch the bundled PostgreSQL
        run: python infra/packaging/fetch_postgres.py --platform ${{ matrix.pg }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the application
        working-directory: apps/desktop
        env:
          ATLAS_BUILD_COMMIT: ${{ github.sha }}
          # Signing is intentionally absent for the alpha — see the block below
          # and docs/PACKAGING.md before adding certificates.
          #
          # These are deliberately NOT set to "". Tauri checks whether the
          # variable is *present*, not whether it has a value, so an empty
          # string made it attempt codesign with a blank identity and fail:
          #   failed codesign application: failed to run command codesign
          # Unset is what "do not sign" means. This built locally, where the
          # variables simply do not exist, and only failed in CI.
          #
          # --verbose is not noise-for-its-own-sake. tauri-bundler runs
          # linuxdeploy with std::process::Command::output(), which captures
          # stdout and stderr and then discards them, reporting only
          #   failed to bundle project: `failed to run linuxdeploy`
          # It only surfaces the tool's own output when the log level is above
          # Error. An AppImage failure is undiagnosable without this.
          #
          # APPIMAGE_EXTRACT_AND_RUN was set here to work around a suspected
          # FUSE restriction. That was wrong: tauri-bundler already sets the
          # variable itself and also passes --appimage-extract-and-run, so it
          # was inert. The real failure was an unsatisfiable dependency inside
          # the bundled PostgreSQL tree, fixed in infra/packaging/fetch_postgres.py.
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --verbose

      # ----------------------------------------------------------------------
      # SIGNING — deliberately not configured for the Public Alpha.
      #
      # Alpha builds are unsigned. macOS Gatekeeper and Windows SmartScreen
      # will warn, which is why every release publishes SHA-256 checksums.
      #
      # To sign later, add these repository secrets and the steps described in
      # docs/PACKAGING.md. No placeholder certificate is invented here, because
      # a fake identity fails at bundle time in a way that looks like a build
      # bug rather than a missing credential.
      #
      #   macOS   APPLE_CERTIFICATE            base64 .p12 (Developer ID Application)
      #           APPLE_CERTIFICATE_PASSWORD   .p12 password
      #           APPLE_SIGNING_IDENTITY       "Developer ID Application: NAME (TEAMID)"
      #           APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   for notarisation
      #
      #   Windows WINDOWS_CERTIFICATE          base64 .pfx (code signing)
      #           WINDOWS_CERTIFICATE_PASSWORD .pfx password
      #           and set bundle.windows.certificateThumbprint in tauri.conf.json
      # ----------------------------------------------------------------------

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          out="dist-release"
          mkdir -p "$out"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev-${GITHUB_SHA::7}"

          # Installers, as produced by the Tauri bundler.
          find "$bundle" -type f \( -name "*.AppImage" -o -name "*-setup.exe" \) \
            -exec cp {} "$out/" \;

          # The bundled database, taken from the tree fetch_postgres.py filled.
          #
          # RC1 copied "$exe_dir/resources" here, which never existed: the
          # config maps "resources/postgres" to "postgres", so Tauri writes
          # $exe_dir/postgres. The copy failed every time and was hidden by a
          # trailing `|| true`, so both portable archives shipped with no
          # database at all while the release notes promised one.
          postgres="apps/desktop/src-tauri/resources/postgres"
          if [ ! -x "$postgres/bin/pg_ctl" ] && [ ! -f "$postgres/bin/pg_ctl.exe" ]; then
            echo "::error::bundled PostgreSQL missing from $postgres"
            exit 1
          fi

          # A portable archive that cannot start a database is not a release
          # artifact. Never let a resource copy fail quietly.
          verify_portable() {
            local root="$1"
            local missing=0
            for required in postgres/bin/pg_ctl postgres/bin/initdb postgres/bin/postgres; do
              if [ ! -e "$root/$required" ] && [ ! -e "$root/$required.exe" ]; then
                echo "::error::portable archive is missing $required"
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || exit 1
            echo "portable archive verified: $(find "$root/postgres" -type f | wc -l) database files"
          }

          # Portable forms. M012 asks for a zip on Windows and a tar.gz on
          # Linux so Atlas can be run without an installer at all.
          case "${{ runner.os }}" in
            macOS)
              app=$(find "$bundle/macos" -maxdepth 1 -name "*.app" | head -1)
              [ -n "$app" ] && ditto -c -k --keepParent "$app" \
                "$out/Atlas_${version}_${{ matrix.target }}.app.zip"
              # Built with hdiutil rather than Tauri's bundler: that one drives
              # Finder over AppleScript to style the window, which needs an
              # interactive GUI session and fails with "AppleEvent timed out"
              # on a runner. The image this produces is functionally identical,
              # only without the background art.
              python3 infra/packaging/make_dmg.py "$app" \
                --output "$out" --name "Atlas_${version}_${{ matrix.target }}"
              ;;
            Windows)
              exe_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release"
              portable="$out/portable"
              mkdir -p "$portable/Atlas"
              cp "$exe_dir/atlas-desktop.exe" "$portable/Atlas/Atlas.exe"
              cp -r "$postgres" "$portable/Atlas/postgres"
              cp "apps/desktop/src-tauri/binaries/atlas-kernel-${{ matrix.target }}.exe" \
                 "$portable/Atlas/atlas-kernel.exe"
              cp LICENSE NOTICE "$portable/Atlas/"
              verify_portable "$portable/Atlas"
              (cd "$portable" && 7z a -tzip "../Atlas_${version}_windows-x86_64_portable.zip" Atlas >/dev/null)
              rm -rf "$portable"
              ;;
            Linux)
              exe_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release"
              staging="$out/staging/Atlas"
              mkdir -p "$staging"
              cp "$exe_dir/atlas-desktop" "$staging/atlas"
              cp -r "$postgres" "$staging/postgres"
              cp "apps/desktop/src-tauri/binaries/atlas-kernel-${{ matrix.target }}" \
                 "$staging/atlas-kernel"
              cp LICENSE NOTICE "$staging/"
              verify_portable "$staging"
              tar -czf "$out/Atlas_${version}_linux-x86_64.tar.gz" -C "$out/staging" Atlas
              rm -rf "$out/staging"
              ;;
          esac

          echo "--- collected ---"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Deliberately not gated on the tag as a whole. Everything here except the
    # final upload is safe to run on any dispatch, and gating the whole job
    # meant the checksum and release-note steps had never executed once before
    # the tag push that would publish them. Only creating the GitHub Release is
    # irreversible, so only that step waits for a tag.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          python3 infra/packaging/checksums.py generate artifacts
          python3 infra/packaging/checksums.py verify artifacts

      - name: Extract release notes for this version
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull just this version's section out of the changelog.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $version; using a pointer instead."
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "### Verifying your download"
            echo ""
            echo "These builds are **unsigned**. macOS Gatekeeper and Windows SmartScreen will warn you."
            echo "Check the SHA-256 of your download against \`SHA256SUMS.txt\` before running it:"
            echo ""
            echo '```bash'
            echo "shasum -a 256 <file>     # macOS / Linux"
            echo "certutil -hashfile <file> SHA256   # Windows"
            echo '```'
            echo ""
            echo "Atlas bundles its own PostgreSQL. You do not need to install a database."
          } >> release-notes.md

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true

      - name: Report what a tagged run would have published
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Not a tag, so no GitHub Release was created."
          echo "The artifacts and checksums above are what a tagged run would publish."
          ls -lh artifacts
