name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel quality
    runs-on: ubuntu-latest

    # The kernel test suite talks to a real Postgres. Without this service the
    # pytest step cannot pass at all, however healthy the code is.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas
      ATLAS_PROFILE: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # The Media Factory tests decode what they produce rather than trusting
      # it, so they need a real ffmpeg. Installed explicitly rather than relying
      # on the runner image: the tests skip when it is absent, and a silent skip
      # would quietly drop those modules out of the coverage gate.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check packages/kernel workers

      - name: Black
        run: python -m black --check packages/kernel workers

      - name: Mypy
        run: python -m mypy packages/kernel/atlas_kernel

      # The 90% coverage gate lives in pyproject; this step fails on regression.
      - name: Pytest with coverage
        run: python -m pytest packages/kernel/tests

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript compile
        run: npx tsc -b --force

      - name: Production build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-web
          path: apps/desktop/dist
          retention-days: 14

  desktop-shell:
    name: Desktop shell (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # The web bundle must exist before tauri-build runs, and the sidecar and
      # PostgreSQL do not: this job checks the shell compiles, it does not
      # produce an installer. release.yml does that.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
